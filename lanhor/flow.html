      get zones() { return zones.map((z) => ({ kind: z.kind, tiles: z.tiles.length, count: z.count, progress: z.progress })); },
      addTen,
    };
  }

  Kit.init({
    id: 'flow',
    number: '02',
    accent: '#4cc9f0',
    accentInk: '#032430',
    title: { sprite: 'School of Fish', abstract: 'Flow' },
    hint: {
      sprite: 'Steer with WASD, arrows or hold the mouse. Grow in green, avoid red.',
      abstract: 'Steer with WASD, arrows or hold the mouse. Grow in green, avoid red.',
    },
    about: {
      sprite: 'Steer a school of fish through an underwater maze. Keep it in the green seagrass and new fish swim in to join. Red water picks them off one by one. Currents push the school until it slips out of them, and in narrow gaps the fish squeeze into a line, then gather back into a ball.',
      abstract: 'Steer a group of agents through a maze. Keep it in the green zone and new agents appear and join. The red zone removes them one by one. Flow lanes push the group until it leaves them, and in narrow gaps the agents squeeze into a line, then gather back into a ball.',
    },
    controls: [
      { keys: ['W', 'A', 'S', 'D'], label: { sprite: 'Swim the school', abstract: 'Move the group' } },
      { keys: ['←', '↑', '→', '↓'], label: 'Or use the arrow keys' },
      { keys: ['Hold mouse'], label: { sprite: 'Swim toward the pointer', abstract: 'Move toward the pointer' } },
      { keys: ['+'], label: { sprite: 'Add 10 fish', abstract: 'Add 10 agents' } },
      { keys: ['P'], label: 'Show the path field' },
      { keys: ['L'], label: 'Next level' },
    ],
    stats: [
      { id: 'n', label: { sprite: 'Fish', abstract: 'Agents' }, value: 1 },
      { id: 'best', label: 'Best', value: 1 },
    ],
    tweaks: [
      { type: 'section', label: { sprite: 'School', abstract: 'Group' } },
      { type: 'range', id: 'startSize', label: 'Start size', min: 1, max: 40, step: 1, value: DEF.startSize, note: 'Used when you reset (R)' },
      { type: 'range', id: 'maxSchool', label: { sprite: 'Max school size', abstract: 'Max group size' }, min: 10, max: MAX_FISH, step: 5, value: DEF.maxSchool, onInput: trimToCap },
      { type: 'range', id: 'swimSpeed', label: { sprite: 'Swim speed', abstract: 'Move speed' }, min: 2, max: 6, step: 0.5, value: DEF.swimSpeed, format: (v) => v + ' tiles/s', onInput: () => { S.anchor.tile = -1; } },
      { type: 'range', id: 'separation', label: 'Separation', min: 0, max: 2, step: 0.1, value: DEF.separation, format: (v) => v.toFixed(1) + '×' },
      { type: 'range', id: 'alignment', label: 'Alignment', min: 0, max: 2, step: 0.1, value: DEF.alignment, format: (v) => v.toFixed(1) + '×' },
      { type: 'range', id: 'cohesion', label: 'Cohesion', min: 0, max: 2, step: 0.1, value: DEF.cohesion, format: (v) => v.toFixed(1) + '×' },
      { type: 'button', id: 'add10', label: { sprite: 'Add 10 fish', abstract: 'Add 10 agents' }, onClick: addTen },
      { type: 'section', label: { sprite: 'Water', abstract: 'Flow' } },
      { type: 'range', id: 'current', label: { sprite: 'Current strength', abstract: 'Flow strength' }, min: 0, max: 10, step: 0.5, value: DEF.current, format: (v) => v + ' tiles/s', onInput: () => { S.anchor.tile = -1; } },
      { type: 'note', label: { sprite: 'Jets in narrow gaps run at full strength, open-water drifts at half.', abstract: 'Lanes in narrow gaps run at full strength, open lanes at half.' } },
      { type: 'section', label: 'Zones' },
      { type: 'range', id: 'joinInterval', label: { sprite: 'Join interval', abstract: 'Add interval' }, min: 0.4, max: 4, step: 0.1, value: DEF.joinInterval, format: (v) => v.toFixed(1) + ' s' },
      { type: 'range', id: 'lossInterval', label: { sprite: 'Loss interval', abstract: 'Remove interval' }, min: 0.2, max: 3, step: 0.1, value: DEF.lossInterval, format: (v) => v.toFixed(1) + ' s' },
      { type: 'section', label: 'Display' },
      { type: 'toggle', id: 'showField', label: 'Show path field', value: DEF.showField, onChange: (v) => Kit.ui.setActive(btnField, v), note: { sprite: 'Arrows show the way each fish takes to the target.', abstract: 'Arrows show the way each agent takes to the target.' } },
    ],
    setup,
    reset: resetSchool,
    update,
    resize: layout,
    viewChanged: buildLayer,
    render(ctx, rdt) {
      if (!layer) return;
      updateAmbient(Kit.paused ? 0 : rdt * Kit.timeScale);
      if (Kit.isAbstract) renderShapes(ctx); else renderSprite(ctx);
    },
    pointerMove: onPointer,
    pointerDown: onPointer,
    keydown: onKey,
  });
})();
</script>
</body>
</html>

  // an object turns 8° a notch, 1° with Shift (aiming a mirror wants precision); off any lamp or
  // object the wheel turns the selected one
  const o = h.obj || (!h.lamp && !h.handle ? S.selObj : null);
  if (l) {
    if (S.selLamp !== l) selectLamp(l);
    if (p.shift) setWidth(l, l.width - steps * 3 * DEG);
    else setAim(l, l.aim + steps * 4 * DEG);
  } else if (o) {
    rotateObstacle(o, steps * (p.shift ? 1 : 8) * DEG);
  }
}

function dblclick(p) {
  updateHover(p.x, p.y);
  if (S.hover.lamp && Kit.realTime - S.lampPlacedAt > 0.5) toggleLamp(S.hover.lamp);
}

const STEP_KEYS = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyQ', 'KeyE']);
const shiftHeld = () => Kit.held('ShiftLeft', 'ShiftRight');
/** One keyboard nudge; f = 1 for a tap, or a time-scaled fraction while the key is held. With Shift
 *  (fine) every nudge is small: 1° of aim, width or turn, 1 px of movement. */
function nudge(code, f, fine) {
  const l = S.selLamp, o = S.selObj;
  if (l) {
    const a = (fine ? 1 : 3) * DEG * f, w = (fine ? 1 : 2) * DEG * f;
    if (code === 'ArrowLeft' || code === 'KeyQ') setAim(l, l.aim - a);
    else if (code === 'ArrowRight' || code === 'KeyE') setAim(l, l.aim + a);
    else if (code === 'ArrowUp') setWidth(l, l.width + w);
    else if (code === 'ArrowDown') setWidth(l, l.width - w);
  } else if (o) {
    const a = (fine ? 1 : 6) * DEG * f;
    if (code === 'KeyQ') rotateObstacle(o, -a);
    else if (code === 'KeyE') rotateObstacle(o, a);
    else {
      const step = (fine ? 1 : 6 * S.scale) * f;
      const dx = code === 'ArrowLeft' ? -step : code === 'ArrowRight' ? step : 0;
      const dy = code === 'ArrowUp' ? -step : code === 'ArrowDown' ? step : 0;
      moveObstacleTo(o, o.bx + dx, o.by + dy);
    }
  }
}

function keydown(e) {
  const c = e.code;
  const digit = /^(?:Digit|Numpad)([0-9])$/.exec(c);
  const key = digit ? digit[1] : c === 'KeyG' ? 'G' : null;
  if (key) {
    if (e.repeat) return true;
    const n = +key;
    if (n >= 1 && n <= NC) setColor(COLORS[n - 1], true);
    else addObject(OBJECT_OF_KEY[key]);
    return true;
  }
  if (c === 'Minus' || c === 'NumpadSubtract') {   // − sits next to 0: the mirror
    if (!e.repeat) addObject('mirror');
    return true;
  }
  if (STEP_KEYS.has(c)) {
    if (!e.repeat) { nudge(c, 1, e.shiftKey); keyHold.set(c, Kit.realTime); }
    return true;
  }
  switch (c) {
    case 'KeyL': if (!e.repeat) addLampFree(); return true;
    case 'Tab': cycleLamp(e.shiftKey ? -1 : 1); return true;
    case 'KeyO': if (S.selLamp && !e.repeat) toggleLamp(S.selLamp); return true;
    case 'Delete': case 'Backspace': case 'KeyX': if (!e.repeat) deleteSelected(); return true;
    default: return false;
  }
}
function keyup(e) { keyHold.delete(e.code); }

/** Continuous rotation / width / movement while a nudge key is held (runs on wall time, also when paused). */
function pollKeys(rdt) {
  for (const [code, t0] of keyHold) {
    if (!Kit.keys.has(code)) { keyHold.delete(code); continue; }
    const fine = shiftHeld();
    if (Kit.realTime - t0 > 0.22) nudge(code, rdt * (fine ? 10 : 25), fine);   // fine: a slow, steady 10°/s turn
  }
}

// ================================================================== rendering: shared layers
const bgLayer = document.createElement('canvas');
const floorLayer = document.createElement('canvas');
const baseLayer = document.createElement('canvas');   // background + the beams that hold still (sprites)
const FLAP_FRAMES = 8;
const RIM_BUCKETS = 3;
// additive mix of the sprite light colors for every set of colors (bit i = COLORS[i]): at most 63 glows
const MIX = Array.from({ length: 1 << NC }, (_, mask) => {
  const sum = [0, 0, 0];
  COLORS.forEach((c, i) => { if (mask & (1 << i)) { const v = U.hexToRgb(LIGHT[c]); sum[0] += v.r; sum[1] += v.g; sum[2] += v.b; } });
  return '#' + sum.map((v) => Math.min(255, v).toString(16).padStart(2, '0')).join('');
});
const maskSeen = new Uint8Array(1 << NC), maskList = [];   // scratch: the light mixes on screen this frame
const GLOW = 64, GLOW_COLS = 16, GLOW_ROWS = 6;   // room for every mix plus the swatch and particle colors
const glowAtlas = document.createElement('canvas');
glowAtlas.width = GLOW * GLOW_COLS; glowAtlas.height = GLOW * GLOW_ROWS;
const glowSlots = new Map();
let mothRes = 0;
const mothAtlas = document.createElement('canvas');
const lampAtlas = document.createElement('canvas');
lampAtlas.res = 0;
const LAMP_CELL = { x: -25, y: -14, w: 32, h: 28 };    // spotlight head bounds in lamp units
const MOTH_CELL = { x: -44, y: -62, w: 74, h: 124 };   // frame bounds in moth units

/** Glow drawn at a size that repeats every frame (moth halos, steady lamp halos, dust motes): cached
 *  at that whole pixel size and blitted unscaled at whole device pixels, which skips per-frame
 *  resampling. Expects the canvas's base DPR transform. */
const glowSized = new Map();
function drawGlowSized(ctx, hex, x, y, size) {
  const d = Kit.dpr, px = Math.max(2, Math.round(size * d)), key = hex + px;
  let c = glowSized.get(key);
  if (!c) {
    const i = glowSlot(hex);
    if (i < 0) return;
    if (glowSized.size >= 600) glowSized.clear();   // bounded: sizes × the mixes on screen
    c = document.createElement('canvas');
    c.width = c.height = px;
    c.getContext('2d').drawImage(glowAtlas, (i % GLOW_COLS) * GLOW, Math.floor(i / GLOW_COLS) * GLOW, GLOW, GLOW, 0, 0, px, px);
    glowSized.set(key, c);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(c, Math.round(x * d - px / 2), Math.round(y * d - px / 2));
  ctx.setTransform(d, 0, 0, d, 0, 0);
}

function drawGlow(ctx, hex, x, y, size) {
  const i = glowSlot(hex);
  if (i < 0) return;
  ctx.drawImage(glowAtlas, (i % GLOW_COLS) * GLOW, Math.floor(i / GLOW_COLS) * GLOW, GLOW, GLOW, x - size / 2, y - size / 2, size, size);
}

/** Atlas slot of the soft glow for a colour, painted on first use (-1 when the atlas is full). */
function glowSlot(hex) {
  let i = glowSlots.get(hex);
  if (i === undefined) {
    i = glowSlots.size;
    if (i >= GLOW_COLS * GLOW_ROWS) return -1;
    glowSlots.set(hex, i);
    const g = glowAtlas.getContext('2d'), h = GLOW / 2, cx = (i % GLOW_COLS) * GLOW + h, cy = Math.floor(i / GLOW_COLS) * GLOW + h;
    const grd = g.createRadialGradient(cx, cy, 0, cx, cy, h - 1);
    grd.addColorStop(0, U.rgba(U.mixHex(hex, '#ffffff', 0.6), 1));
    grd.addColorStop(0.16, U.rgba(hex, 0.8));
    grd.addColorStop(0.45, U.rgba(hex, 0.22));
    grd.addColorStop(1, U.rgba(hex, 0));
    g.fillStyle = grd;
    g.fillRect(cx - h, cy - h, GLOW, GLOW);
  }
  return i;
}

function buildBackground() {
  const W = Kit.W, H = Kit.H, dpr = Kit.dpr;
  if (!W || !H) return;
  bgLayer.width = Math.round(W * dpr); bgLayer.height = Math.round(H * dpr);
  const g = bgLayer.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (Kit.isAbstract) paintBackgroundShapes(g, W, H); else paintBackgroundSprite(g, W, H);
  S.floorDirty = true;
  S.baseValid = false;
}

function paintBackgroundShapes(g, W, H) {
  const pr = Kit.playRect, R = S.room;
  g.fillStyle = SH.bg;
  g.fillRect(0, 0, W, H);
  const band = new Path2D();
  pathRoundRect(band, pr.x, pr.y, pr.w, pr.h, 6);
  pathRoundRect(band, R.x, R.y, R.w, R.h, S.rc);
  g.fillStyle = SH.band;
  g.fill(band, 'evenodd');
}

function paintBackgroundSprite(g, W, H) {
  const pr = Kit.playRect, R = S.room, b = S.band, s = S.scale;
  const rnd = U.mulberry32(1234);
  g.fillStyle = '#070815';
  g.fillRect(0, 0, W, H);

  // ---- room: night floor
  g.save();
  g.clip(S.roomPath);
  const cx = R.x + R.w * 0.5, cy = R.y + R.h * 0.45, diag = Math.hypot(R.w, R.h);
  const bgG = g.createRadialGradient(cx, cy, 0, cx, cy, diag * 0.62);
  bgG.addColorStop(0, '#17234d');
  bgG.addColorStop(0.55, '#0d1636');
  bgG.addColorStop(1, '#060a1d');
  g.fillStyle = bgG;
  g.fillRect(R.x, R.y, R.w, R.h);
  // floorboards, barely there
  const bh = Math.max(34, 52 * s);
  let row = 0;
  for (let y = R.y - rnd() * bh; y < R.y + R.h; y += bh, row++) {
    g.fillStyle = row % 2 ? 'rgba(140,170,255,0.022)' : 'rgba(0,0,10,0.05)';
    g.fillRect(R.x, y, R.w, bh);
    g.fillStyle = 'rgba(0,0,12,0.38)';
    g.fillRect(R.x, y, R.w, 1.4);
    let x = R.x + rnd() * 300 * s;
    while (x < R.x + R.w) { g.fillRect(x, y, 1.4, bh); x += (220 + rnd() * 260) * s; }
  }
  // grain speckle
  for (let i = 0; i < (R.w * R.h) / 900; i++) {
    g.fillStyle = rnd() < 0.5 ? 'rgba(160,180,255,0.035)' : 'rgba(0,0,0,0.08)';
    g.fillRect(R.x + rnd() * R.w, R.y + rnd() * R.h, 1.5, 1.5);
  }
  // vignette + frame shade
  const vg = g.createRadialGradient(cx, cy, diag * 0.22, cx, cy, diag * 0.62);
  vg.addColorStop(0, 'rgba(2,3,12,0)');
  vg.addColorStop(1, 'rgba(2,3,12,0.62)');
  g.fillStyle = vg;
  g.fillRect(R.x, R.y, R.w, R.h);
  const sh = 26 * s;
  const edge = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const lg = g.createLinearGradient(x0, y0, x1, y1);
    lg.addColorStop(0, 'rgba(0,0,6,0.55)');
    lg.addColorStop(1, 'rgba(0,0,6,0)');
    g.fillStyle = lg;
    g.fillRect(rx, ry, rw, rh);
  };
  edge(0, R.y, 0, R.y + sh, R.x, R.y, R.w, sh);
  edge(0, R.y + R.h, 0, R.y + R.h - sh, R.x, R.y + R.h - sh, R.w, sh);
  edge(R.x, 0, R.x + sh, 0, R.x, R.y, sh, R.h);
  edge(R.x + R.w, 0, R.x + R.w - sh, 0, R.x + R.w - sh, R.y, sh, R.h);
  g.restore();

  // ---- frame: dark walnut with mitred corners
  const band = new Path2D();
  pathRoundRect(band, pr.x, pr.y, pr.w, pr.h, 12);
  pathRoundRect(band, R.x, R.y, R.w, R.h, S.rc);
  g.save();
  g.clip(band, 'evenodd');
  const sides = [
    { pts: [pr.x, pr.y, pr.x + pr.w, pr.y, R.x + R.w, R.y, R.x, R.y], horiz: true, o: pr.y, i: R.y, a: pr.x, z: pr.x + pr.w },
    { pts: [pr.x, pr.y + pr.h, pr.x + pr.w, pr.y + pr.h, R.x + R.w, R.y + R.h, R.x, R.y + R.h], horiz: true, o: pr.y + pr.h, i: R.y + R.h, a: pr.x, z: pr.x + pr.w },
    { pts: [pr.x, pr.y, pr.x, pr.y + pr.h, R.x, R.y + R.h, R.x, R.y], horiz: false, o: pr.x, i: R.x, a: pr.y, z: pr.y + pr.h },
    { pts: [pr.x + pr.w, pr.y, pr.x + pr.w, pr.y + pr.h, R.x + R.w, R.y + R.h, R.x + R.w, R.y], horiz: false, o: pr.x + pr.w, i: R.x + R.w, a: pr.y, z: pr.y + pr.h },
  ];
  for (const sd of sides) {
    g.save();
    g.beginPath();
    g.moveTo(sd.pts[0], sd.pts[1]);
    for (let k = 2; k < 8; k += 2) g.lineTo(sd.pts[k], sd.pts[k + 1]);
    g.closePath();
    g.clip();
    const lg = sd.horiz ? g.createLinearGradient(0, sd.o, 0, sd.i) : g.createLinearGradient(sd.o, 0, sd.i, 0);
    lg.addColorStop(0, '#24150b');
    lg.addColorStop(0.18, '#4f321d');
    lg.addColorStop(0.5, '#3f2716');
    lg.addColorStop(0.82, '#55371f');
    lg.addColorStop(1, '#1e1209');
    g.fillStyle = lg;
    g.fillRect(pr.x, pr.y, pr.w, pr.h);
    // wood grain along the length of the side
    const thick = sd.i - sd.o;
    const lines = Math.round(Math.abs(thick) / 2.2);
    for (let k = 0; k < lines; k++) {
      const off = sd.o + thick * ((k + rnd() * 0.8) / lines);
      const ph = rnd() * TAU, ph2 = rnd() * TAU, amp = 0.6 + rnd() * 1.4;
      g.strokeStyle = rnd() < 0.7 ? `rgba(18,8,2,${0.18 + rnd() * 0.22})` : `rgba(255,205,150,${0.04 + rnd() * 0.05})`;
      g.lineWidth = 0.6 + rnd() * 0.9;
      g.beginPath();
      for (let q = sd.a; q <= sd.z + 20; q += 18) {
        const w = off + Math.sin(q * 0.011 + ph) * amp + Math.sin(q * 0.047 + ph2) * amp * 0.35;
        if (q === sd.a) { if (sd.horiz) g.moveTo(q, w); else g.moveTo(w, q); } else if (sd.horiz) g.lineTo(q, w); else g.lineTo(w, q);
      }
      g.stroke();
    }
    g.restore();
  }
  // mitre seams
  g.strokeStyle = 'rgba(10,5,1,0.7)';
  g.lineWidth = 1.2;
  g.beginPath();
  g.moveTo(pr.x, pr.y); g.lineTo(R.x + S.rc * 0.3, R.y + S.rc * 0.3);
  g.moveTo(pr.x + pr.w, pr.y); g.lineTo(R.x + R.w - S.rc * 0.3, R.y + S.rc * 0.3);
  g.moveTo(pr.x + pr.w, pr.y + pr.h); g.lineTo(R.x + R.w - S.rc * 0.3, R.y + R.h - S.rc * 0.3);
  g.moveTo(pr.x, pr.y + pr.h); g.lineTo(R.x + S.rc * 0.3, R.y + R.h - S.rc * 0.3);
  g.stroke();
  // brass lamp rail sitting in a groove
  g.strokeStyle = '#120a04';
  g.lineWidth = Math.max(4, b * 0.2);
  g.stroke(S.railPath);
  g.strokeStyle = '#8a6326';
  g.lineWidth = Math.max(2.2, b * 0.1);
  g.stroke(S.railPath);
  g.save();
  g.translate(-0.6, -0.8);
  g.strokeStyle = 'rgba(255,222,150,0.55)';
  g.lineWidth = 0.9;
  g.stroke(S.railPath);
  g.restore();
  // screws
  const screw = (x, y) => {
    const r = Math.max(2.4, b * 0.1);
    const sg = g.createRadialGradient(x - r * 0.4, y - r * 0.4, 0, x, y, r);
    sg.addColorStop(0, '#f3d79a'); sg.addColorStop(0.6, '#a57a35'); sg.addColorStop(1, '#4a3212');
    g.fillStyle = sg;
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    const a = rnd() * Math.PI;
    g.strokeStyle = 'rgba(40,24,6,0.85)'; g.lineWidth = 0.9;
    g.beginPath(); g.moveTo(x - Math.cos(a) * r * 0.7, y - Math.sin(a) * r * 0.7); g.lineTo(x + Math.cos(a) * r * 0.7, y + Math.sin(a) * r * 0.7); g.stroke();
  };
  const q = b * 0.2;
  screw(pr.x + q + 2, pr.y + q + 2); screw(pr.x + pr.w - q - 2, pr.y + q + 2);
  screw(pr.x + q + 2, pr.y + pr.h - q - 2); screw(pr.x + pr.w - q - 2, pr.y + pr.h - q - 2);
  const stepX = Math.max(180, pr.w / Math.round(pr.w / 260)), stepY = Math.max(180, pr.h / Math.round(pr.h / 260));
  for (let x = pr.x + stepX; x < pr.x + pr.w - stepX * 0.5; x += stepX) { screw(x, pr.y + q); screw(x, pr.y + pr.h - q); }
  for (let y = pr.y + stepY; y < pr.y + pr.h - stepY * 0.5; y += stepY) { screw(pr.x + q, y); screw(pr.x + pr.w - q, y); }
  g.restore();
  // bevels
  g.save();
  g.strokeStyle = 'rgba(255,214,160,0.16)';
  g.lineWidth = 1.5;
  g.beginPath(); pathRoundRect(g, pr.x + 1, pr.y + 1, pr.w - 2, pr.h - 2, 11); g.stroke();
  g.strokeStyle = 'rgba(0,0,0,0.6)';
  g.lineWidth = 3;
  g.stroke(S.roomPath);
  g.strokeStyle = 'rgba(255,210,150,0.2)';
  g.lineWidth = 1;
  g.beginPath(); pathRoundRect(g, R.x - 2.5, R.y - 2.5, R.w + 5, R.h + 5, S.rc + 2.5); g.stroke();
  g.restore();
}

// ---- procedural moth sprites (units: moth faces +x, wingspan 108 units)
function paintSprite(wu, hu, ox, oy, res, paint) {
  const c = document.createElement('canvas');
  c.width = Math.max(2, Math.ceil(wu * res)); c.height = Math.max(2, Math.ceil(hu * res));
  const g = c.getContext('2d');
  g.scale(c.width / wu, c.height / hu);
  g.translate(-ox, -oy);
  paint(g, res);
  c.ux = ox; c.uy = oy; c.uw = wu; c.uh = hu;
  return c;
}

function paintWings(g, v, res) {
  g.shadowColor = 'rgba(25,12,4,0.5)';
  g.shadowBlur = 1.6 * res;
  // hindwing
  g.beginPath();
  g.moveTo(-3, -2);
  g.bezierCurveTo(-1, -20, -12, -38, -25, -38);
  g.bezierCurveTo(-37, -38, -41, -24, -36, -13);
  g.bezierCurveTo(-31, -4, -18, -1, -9, -1);
  g.closePath();
  const hg = g.createRadialGradient(-6, -4, 1, -14, -18, 34);
  hg.addColorStop(0, v.hindTint); hg.addColorStop(0.55, v.hind); hg.addColorStop(1, v.foreDark);
  g.fillStyle = hg;
  g.fill();
  g.shadowBlur = 0;
  g.save();
  g.clip();
  g.fillStyle = v.spot;
  g.beginPath(); g.arc(-25, -23, 4.3, 0, TAU); g.fill();
  g.fillStyle = v.hindTint;
  g.beginPath(); g.arc(-25, -23, 2.6, 0, TAU); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.8)';
  g.beginPath(); g.arc(-25.6, -23.8, 1, 0, TAU); g.fill();
  g.restore();
  // forewing
  g.shadowBlur = 1.6 * res;
  g.beginPath();
  g.moveTo(6, -2);
  g.bezierCurveTo(10, -18, 8, -40, 0, -54);
  g.bezierCurveTo(-8, -56, -22, -45, -28, -30);
  g.bezierCurveTo(-20, -20, -12, -8, -6, -2);
  g.closePath();
  const fg = g.createLinearGradient(2, -4, -12, -52);
  fg.addColorStop(0, v.fore); fg.addColorStop(0.62, v.fore); fg.addColorStop(1, v.foreDark);
  g.fillStyle = fg;
  g.fill();
  g.shadowBlur = 0;
  g.save();
  g.clip();
  g.strokeStyle = v.band; g.globalAlpha = 0.85; g.lineWidth = 7.5; g.lineCap = 'round';
  g.beginPath(); g.moveTo(9, -24); g.quadraticCurveTo(-6, -38, -24, -33); g.stroke();
  g.globalAlpha = 0.38; g.strokeStyle = v.foreDark; g.lineWidth = 0.7;
  for (const [x, y] of [[-2, -52], [-10, -50], [-17, -45], [-23, -37]]) { g.beginPath(); g.moveTo(1, -4); g.quadraticCurveTo(x * 0.4 + 3, y * 0.6, x, y); g.stroke(); }
  g.globalAlpha = 1;
  g.fillStyle = v.foreDark;
  for (let i = 0; i < 6; i++) { const t = i / 5; g.beginPath(); g.arc(lerp(-3, -25, t), lerp(-51, -33, t) + Math.sin(t * 3) * 1.5, 1, 0, TAU); g.fill(); }
  g.fillStyle = v.spot;
  g.beginPath(); g.arc(-3, -37, 3.4, 0, TAU); g.fill();
  g.fillStyle = v.band;
  g.beginPath(); g.arc(-3, -37, 1.7, 0, TAU); g.fill();
  g.restore();
  g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 1.1;
  g.beginPath(); g.moveTo(6.5, -4); g.bezierCurveTo(10, -18, 8, -40, 0.5, -53); g.stroke();
}

function paintBody(g, v) {
  // feathery antennae
  g.lineCap = 'round';
  for (const sd of [-1, 1]) {
    const x0 = 12, y0 = 1.6 * sd, cx = 21, cy = 2 * sd, x1 = 27, y1 = 12.5 * sd;
    g.strokeStyle = v.bodyDark; g.lineWidth = 1.1;
    g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo(cx, cy, x1, y1); g.stroke();
    g.lineWidth = 0.55;
    for (let i = 1; i <= 8; i++) {
      const t = i / 9, it = 1 - t;
      const px = it * it * x0 + 2 * it * t * cx + t * t * x1, py = it * it * y0 + 2 * it * t * cy + t * t * y1;
      const tx = 2 * it * (cx - x0) + 2 * t * (x1 - cx), ty = 2 * it * (cy - y0) + 2 * t * (y1 - cy);
      const tl = Math.hypot(tx, ty) || 1, nx = -ty / tl, ny = tx / tl, len = 2.6 * (1 - t * 0.55);
      g.beginPath(); g.moveTo(px - nx * len, py - ny * len); g.lineTo(px + nx * len, py + ny * len); g.stroke();
    }
  }
  // abdomen
  const ag = g.createLinearGradient(0, -5.6, 0, 5.6);
  ag.addColorStop(0, v.bodyDark); ag.addColorStop(0.45, v.body); ag.addColorStop(1, v.bodyDark);
  g.fillStyle = ag;
  g.beginPath(); g.ellipse(-12, 0, 14.5, 5.6, 0, 0, TAU); g.fill();
  g.strokeStyle = v.bodyDark; g.globalAlpha = 0.55; g.lineWidth = 0.8;
  for (const x of [-6, -10.5, -15, -19.5, -23.5]) { g.beginPath(); g.ellipse(x, 0, 1.5, 5 - Math.abs(x + 12) * 0.12, 0, -Math.PI / 2, Math.PI / 2); g.stroke(); }
  g.globalAlpha = 1;
  // furry thorax
  const rnd = U.mulberry32(99);
  g.lineWidth = 1.3;
  for (let i = 0; i < 46; i++) {
    const a = rnd() * TAU, r0 = 3 + rnd() * 2, r1 = 6.6 + rnd() * 2.4;
    g.strokeStyle = rnd() < 0.6 ? v.fur : v.body;
    g.beginPath(); g.moveTo(2 + Math.cos(a) * r0, Math.sin(a) * r0); g.lineTo(2 + Math.cos(a) * r1, Math.sin(a) * r1 * 0.95); g.stroke();
  }
  const tg = g.createRadialGradient(3.5, -1.5, 0.5, 2, 0, 7.5);
  tg.addColorStop(0, v.fur); tg.addColorStop(0.65, v.body); tg.addColorStop(1, v.bodyDark);
  g.fillStyle = tg;
  g.beginPath(); g.ellipse(2, 0, 6.8, 6.3, 0, 0, TAU); g.fill();
  // head + big eyes
  g.fillStyle = v.head;
  g.beginPath(); g.arc(10, 0, 4.3, 0, TAU); g.fill();
  for (const sd of [-1, 1]) {
    g.fillStyle = '#1a0f12';
    g.beginPath(); g.arc(11.6, 2.8 * sd, 2, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.9)';
    g.beginPath(); g.arc(12.2, 2.8 * sd - 0.6, 0.7, 0, TAU); g.fill();
  }
}

function buildMothSprites() {
  const res = ((MOTH_WS * S.scale) / 108) * Kit.dpr * 1.25;
  if (Math.abs(res - mothRes) < 0.01 && mothAtlas.width) return;
  mothRes = res;
  // wings + body are painted once per look, then composed into flap frames (wings squashed toward
  // the body) inside one atlas so every moth draw shares a texture
  const cw = Math.ceil(MOTH_CELL.w * res), ch = Math.ceil(MOTH_CELL.h * res);
  mothAtlas.width = cw * FLAP_FRAMES; mothAtlas.height = ch * MOTH_LOOKS.length;
  mothAtlas.cw = cw; mothAtlas.ch = ch;
  const g = mothAtlas.getContext('2d');
  MOTH_LOOKS.forEach((v, row) => {
    const wing = paintSprite(58, 64, -43, -60, res, (wg, r) => paintWings(wg, v, r));
    const body = paintSprite(60, 32, -28, -16, res, (bg) => paintBody(bg, v));
    for (let k = 0; k < FLAP_FRAMES; k++) {
      const f = 0.2 + (0.8 * k) / (FLAP_FRAMES - 1);
      g.setTransform(cw / MOTH_CELL.w, 0, 0, ch / MOTH_CELL.h, k * cw - MOTH_CELL.x * (cw / MOTH_CELL.w), row * ch - MOTH_CELL.y * (ch / MOTH_CELL.h));
      for (const sy of [f, -f]) {
        g.save();
        g.scale(1, sy);
        g.drawImage(wing, wing.ux, wing.uy, wing.uw, wing.uh);
        g.restore();
      }
      g.drawImage(body, body.ux, body.uy, body.uw, body.uh);
    }
  });
}

function polyPath(ctx, pts, rr) {
  const n = pts.length;
  ctx.beginPath();
  if (rr <= 0.5 || n > 8) {
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < n; i++) ctx.lineTo(pts[i].x, pts[i].y);
  } else {
    const a = pts[n - 1], b = pts[0];
    ctx.moveTo((a.x + b.x) / 2, (a.y + b.y) / 2);
    for (let i = 0; i < n; i++) { const p = pts[i], q = pts[(i + 1) % n]; ctx.arcTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2, rr); }
  }
  ctx.closePath();
}

function cornerRadius(o) { return isMirror(o) ? 0 : Math.min(7 * S.scale, o.r * 0.22); }

/** Hover / selection outline: the object itself, or a slim box around a mirror (its own edge is too thin to see). */
const outlinePts = Array.from({ length: 4 }, () => ({ x: 0, y: 0 }));
function outlinePath(ctx, o, abs) {
  if (!isMirror(o)) { polyPath(ctx, o.points, abs ? 0 : cornerRadius(o)); return; }
  const pad = 5 * S.scale, hx = 1.6 * o.r + pad, hy = 0.065 * o.r + pad, c = Math.cos(o.rot), s = Math.sin(o.rot);
  [[-hx, -hy], [hx, -hy], [hx, hy], [-hx, hy]].forEach(([x, y], i) => { outlinePts[i].x = o.bx + x * c - y * s; outlinePts[i].y = o.by + x * s + y * c; });
  polyPath(ctx, outlinePts, abs ? 0 : pad);
}

// ================================================================== rendering: sprites
/** A beam's soft radial falloff from its source; a reflection's source is the lamp's mirror image, so
 *  its light keeps fading along the whole path. Cached until the piece's polygon or the reach change. */
function pieceGradient(p, g) {
  const fx = p.depth ? p : p.lamp.fx, key = reachPx() + p.color;
  if (fx.grad && fx.gradKey === key) return fx.grad;
  const far = p.far, reach = reachPx(), col = LIGHT[p.color];
  const gr = g.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, far);
  const stops = [0, 0.06, 0.3, 1];
  for (const t of stops) {
    const a = Math.min(1, 1.05 / Math.pow(1 + (t * far) / reach, 0.7));
    const c = t < 0.1 ? U.mixHex(col, '#ffffff', (1 - t / 0.1) * 0.55) : col;
    gr.addColorStop(t, U.rgba(c, a * (t === 0 ? 1 : 0.92)));
  }
  fx.grad = gr; fx.gradKey = key;
  return gr;
}

/** Visible brightness of a piece: its lamp's, times the strength left after its bounces. */
const pieceVis = (p) => lampVis(p.lamp) * p.k;
/** How strongly a piece shows in the floor: Sprites as above; Shapes draw a reflection exactly like a direct beam. */
const floorVis = (p) => (Kit.isAbstract ? p.lamp.fx.power : pieceVis(p));

/** Additive fill of one beam piece: a soft gradient (Sprites) or flat translucent color (Shapes). Beam
 *  polygons stop at the room's bounding rectangle, so they are drawn unclipped and
 *  restoreRoomCorners() fixes the rounded corners afterwards (far cheaper than clipping every fill). */
function fillPiece(g, p) {
  const vis = floorVis(p);
  if (!p.path || vis <= 0.01) return;
  if (Kit.isAbstract) { g.globalAlpha = 0.5 * vis; g.fillStyle = BASE[p.color]; } else { g.globalAlpha = clamp(vis, 0, 1); g.fillStyle = pieceGradient(p, g); }
  g.fill(p.path);
}

function pieceChanged(p, key) {
  const q = p.painted;
  return q.path !== p.path || q.vis !== floorVis(p) || q.key !== key;
}

const SETTLE = 0.4;   // s a piece must hold still, while the light keeps changing, before it is baked
/** The floor with every beam piece (and in Sprites every object, lamp mount and mirror hit), painted
 *  into f. Pieces that hold still stay baked in baseLayer (background + those pieces), so aiming,
 *  sliding or switching one lamp or turning one mirror re-rasters only the pieces that change; while
 *  the light keeps changing (`moving`) only pieces that have settled for a moment are baked, so a piece
 *  that changes now and then (a far bounce of a turning mirror) never forces a re-bake every frame. */
function paintLitFloor(f, moving) {
  S.floorDirty = false;
  const dpr = Kit.dpr, W = bgLayer.width, H = bgLayer.height, now = Kit.realTime;
  if (!W || !H) return;
  for (const c of [floorLayer, baseLayer]) if (c.width !== W || c.height !== H) { c.width = W; c.height = H; S.baseValid = false; }
  const key = reachPx() + '';
  const bakeable = (p) => !pieceChanged(p, key) && (!moving || now - p.pathAt >= SETTLE);
  let rebuild = !S.baseValid;
  for (const p of S.basePieces) if (!S.pieces.includes(p) || pieceChanged(p, key)) rebuild = true;   // a baked piece moved or went
  if (moving && !rebuild && now - S.baseAt > 0.3) rebuild = S.pieces.some((p) => !S.basePieces.has(p) && bakeable(p));
  if (rebuild) {
    S.baseAt = now;
    const b = baseLayer.getContext('2d');
    b.setTransform(1, 0, 0, 1, 0, 0);
    b.globalCompositeOperation = 'source-over';
    b.globalAlpha = 1;
    b.drawImage(bgLayer, 0, 0);
    b.setTransform(dpr, 0, 0, dpr, 0, 0);
    b.globalCompositeOperation = 'lighter';
    S.basePieces.clear();
    for (const p of S.pieces) if (bakeable(p)) { fillPiece(b, p); S.basePieces.add(p); }
    S.baseValid = true;
  }
  f.setTransform(1, 0, 0, 1, 0, 0);
  f.globalCompositeOperation = 'source-over';
  f.globalAlpha = 1;
  f.drawImage(baseLayer, 0, 0);
  f.setTransform(dpr, 0, 0, dpr, 0, 0);
  f.globalCompositeOperation = 'lighter';
  for (const p of S.pieces) {
    if (!S.basePieces.has(p)) fillPiece(f, p);
    const q = p.painted;
    q.path = p.path; q.vis = floorVis(p); q.key = key;
  }
  f.globalCompositeOperation = 'source-over';
  f.globalAlpha = 1;
  restoreRoomCorners(f);
  if (Kit.isAbstract) return;
  // objects, lamp mounts and the light on mirrors only change when the lighting does, so they live in this layer too
  paintObstacles(f);
  paintMirrorHits(f);
  for (const l of S.lamps) paintLampMount(f, l, 1);
}

/** Floor of either view: one blit of floorLayer while the light holds still; while it changes every
 *  frame (drags, aiming, turning) it is composed straight onto the screen and baked again once it settles. */
function drawFloor(ctx) {
  const dirty = S.floorDirty, moving = dirty && S.floorWasDirty;
  S.floorWasDirty = dirty;
  if (moving) { paintLitFloor(ctx, true); S.floorStale = true; return; }
  if (dirty || S.floorStale) { paintLitFloor(floorLayer.getContext('2d'), false); S.floorStale = false; }
  ctx.drawImage(floorLayer, 0, 0, Kit.W, Kit.H);
}

/** Copy the background back into the four slivers between the room's rounded corners and its bounding rectangle. */
function restoreRoomCorners(f) {
  const R = S.room, d = Kit.dpr, k = S.rc + 2;
  for (const [x, y] of [[R.x - 1, R.y - 1], [R.x + R.w + 1 - k, R.y - 1], [R.x + R.w + 1 - k, R.y + R.h + 1 - k], [R.x - 1, R.y + R.h + 1 - k]]) {
    f.save();
    f.beginPath();
    f.rect(x, y, k, k);
    f.clip();
    f.clip(S.outsidePath, 'evenodd');
    f.drawImage(bgLayer, x * d, y * d, k * d, k * d, x, y, k, k);
    f.restore();
  }
}

/** Each object's look depends only on its shape, size and rotation, so it is painted once into its own canvas. */
function obstacleSprite(o) {
  const fx = o.fx, dpr = Kit.dpr, s = S.scale;
  const key = `${o.rot.toFixed(4)}|${o.r.toFixed(2)}|${o.glass}|${dpr}|${s}`;
  if (fx.sprite && fx.spriteKey === key) return fx.sprite;
  const c = fx.sprite || document.createElement('canvas');
  const E = o.br + 12 * s + 4;
  c.width = c.height = Math.ceil(2 * E * dpr);
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, dpr * (E - o.bx), dpr * (E - o.by));
  const rr = cornerRadius(o);
  if (o.mat === 'glass') paintGlass(g, o, rr);
  else if (isMirror(o)) paintMirror(g, o);
  else {
    g.save();
    g.translate(4 * s, 6 * s);
    polyPath(g, o.points, rr);
    g.fillStyle = 'rgba(1,2,10,0.42)';
    g.fill();
    g.restore();
    drawSolid(g, o, rr);
  }
  c.E = E;
  // blit only the painted part (shape + bevel + drop shadow), not the transparent margin
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of o.points) { x0 = Math.min(x0, p.x - o.bx); x1 = Math.max(x1, p.x - o.bx); y0 = Math.min(y0, p.y - o.by); y1 = Math.max(y1, p.y - o.by); }
  const pad = 3 * s + 3;
  c.sx = clamp(Math.floor((E + x0 - pad) * dpr), 0, c.width); c.sy = clamp(Math.floor((E + y0 - pad) * dpr), 0, c.height);
  c.sw = clamp(Math.ceil((E + x1 + pad + 4 * s) * dpr), 0, c.width) - c.sx; c.sh = clamp(Math.ceil((E + y1 + pad + 6 * s) * dpr), 0, c.height) - c.sy;
  fx.sprite = c; fx.spriteKey = key;
  return c;
}

function paintObstacles(ctx) {
  const d = Kit.dpr;
  for (const o of S.obstacles) {
    // sprites are painted at device resolution: an unscaled blit at whole device pixels skips resampling
    const c = obstacleSprite(o);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(c, c.sx, c.sy, c.sw, c.sh, Math.round((o.bx - c.E) * d) + c.sx, Math.round((o.by - c.E) * d) + c.sy, c.sw, c.sh);
    ctx.setTransform(d, 0, 0, d, 0, 0);
    if (o.glass && o.glow > 0) glassGlow(ctx, o, cornerRadius(o));
  }
  drawLitRims(ctx);
}

function drawObjectFlashes(ctx) {
  for (const o of S.obstacles) {
    if (o.fx.flash <= 0) continue;
    ctx.globalAlpha = o.fx.flash * (Kit.isAbstract ? 0.5 : 0.6);
    ctx.fillStyle = '#ffffff';
    polyPath(ctx, o.points, Kit.isAbstract ? 0 : cornerRadius(o));
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawSolid(ctx, o, rr) {
  const r = o.r, x = o.bx, y = o.by, wood = o.mat === 'wood';
  polyPath(ctx, o.points, rr);
  const gr = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
  if (wood) { gr.addColorStop(0, '#b98955'); gr.addColorStop(0.5, '#8a5e35'); gr.addColorStop(1, '#4d311b'); } else { gr.addColorStop(0, '#9b98ab'); gr.addColorStop(0.5, '#6c697e'); gr.addColorStop(1, '#3a3848'); }
  ctx.fillStyle = gr;
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.translate(x, y);
  ctx.rotate(o.rot);
  if (wood) {
    ctx.strokeStyle = 'rgba(60,30,10,0.35)';
    ctx.lineWidth = Math.max(0.8, r * 0.035);
    const g0 = o.fx.grain;
    for (let k = -6; k <= 6; k++) {
      const yy = k * r * 0.17;
      ctx.beginPath();
      ctx.moveTo(-r * 1.8, yy);
      ctx.bezierCurveTo(-r * 0.6, yy + Math.sin(g0 + k) * r * 0.08, r * 0.4, yy - Math.cos(g0 + k * 1.7) * r * 0.1, r * 1.8, yy + Math.sin(g0 * 2 + k) * r * 0.05);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(60,30,10,0.4)';
    ctx.beginPath(); ctx.ellipse(Math.sin(g0) * r * 0.3, Math.cos(g0) * r * 0.2, r * 0.13, r * 0.07, 0, 0, TAU); ctx.stroke();
  } else {
    for (const sp of o.fx.specks) {
      ctx.fillStyle = sp.light ? 'rgba(220,220,240,0.22)' : 'rgba(20,18,30,0.3)';
      ctx.beginPath(); ctx.arc(sp.x * r, sp.y * r, sp.r * r, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
  // bevel: light top-left rim, dark bottom-right rim
  const bv = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
  bv.addColorStop(0, wood ? 'rgba(255,225,180,0.6)' : 'rgba(235,235,255,0.55)');
  bv.addColorStop(0.45, 'rgba(255,255,255,0)');
  bv.addColorStop(0.6, 'rgba(0,0,0,0)');
  bv.addColorStop(1, 'rgba(0,0,0,0.55)');
  polyPath(ctx, o.points, rr);
  ctx.strokeStyle = bv;
  ctx.lineWidth = Math.max(2, 3 * S.scale);
  ctx.stroke();
}

/** Glass lit by its own color glows. */
function glassGlow(ctx, o, rr) {
  const col = LIGHT[o.glass], gl = o.glow;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  polyPath(ctx, o.points, rr);
  ctx.fillStyle = U.rgba(col, Math.min(0.55, gl * 0.7));
  ctx.fill();
  ctx.strokeStyle = U.rgba(col, Math.min(0.5, gl * 0.6));
  ctx.lineWidth = 9 * S.scale;
  ctx.stroke();
  ctx.restore();
}

/** Sprites mirror: silver glass in a thin steel frame, a bright edge on both faces (it is double-sided). */
function paintMirror(g, o) {
  const s = S.scale, hx = 1.6 * o.r, hy = 0.065 * o.r;
  g.save();
  g.translate(4 * s, 6 * s);
  polyPath(g, o.points, 0);
  g.fillStyle = 'rgba(1,2,10,0.42)';
  g.fill();
  g.restore();
  g.save();
  g.translate(o.bx, o.by);
  g.rotate(o.rot);
  const fr = g.createLinearGradient(0, -hy, 0, hy);
  fr.addColorStop(0, '#a3acbd'); fr.addColorStop(0.5, '#3a404c'); fr.addColorStop(1, '#8d96a8');
  g.fillStyle = fr;
  U.roundRect(g, -hx, -hy, 2 * hx, 2 * hy, Math.min(hy, 2.5 * s));
  g.fill();
  g.strokeStyle = 'rgba(8,10,18,0.75)';
  g.lineWidth = 1;
  g.stroke();
  const i = Math.max(0.8, hy * 0.3);
  const sv = g.createLinearGradient(-hx, 0, hx, 0);
  sv.addColorStop(0, '#aab5c8'); sv.addColorStop(0.2, '#eef3fb'); sv.addColorStop(0.45, '#c4cddc');
  sv.addColorStop(0.7, '#f7faff'); sv.addColorStop(1, '#a9b3c6');
  g.fillStyle = sv;
  g.fillRect(-hx + 2.2 * i, -hy + i, 2 * hx - 4.4 * i, 2 * hy - 2 * i);
  g.strokeStyle = 'rgba(255,255,255,0.9)';
  g.lineWidth = Math.max(0.6, 0.45 * s);
  g.beginPath();
  g.moveTo(-hx + 2.2 * i, -hy + i); g.lineTo(hx - 2.2 * i, -hy + i);
  g.moveTo(-hx + 2.2 * i, hy - i); g.lineTo(hx - 2.2 * i, hy - i);
  g.stroke();
  g.fillStyle = '#2a2f3a';   // rivets at the ends of the frame
  for (const x of [-hx + 1.1 * i, hx - 1.1 * i]) { g.beginPath(); g.arc(x, 0, Math.max(0.7, hy * 0.35), 0, TAU); g.fill(); }
  g.restore();
}

const LIGHT_HOT = Object.fromEntries(COLORS.map((c) => [c, U.mixHex(LIGHT[c], '#ffffff', 0.5)]));
/** Where a beam meets a mirror (Sprites, baked in the floor): a bright stripe on the lit stretch and, where
 *  light that arrived directly or after one bounce leaves it again, a faint flare in the beam's color (none
 *  past the bounce limit or the cap on reflections: no light leaves there). */
const FLARE_DEPTH = 1;   // the bounces light may have made and still flare (and glint) where it meets a mirror
const flares = (h) => h.reflected && h.depth <= FLARE_DEPTH;
function paintMirrorHits(f) {
  const s = S.scale;
  f.save();
  f.globalCompositeOperation = 'lighter';
  f.lineCap = 'round';
  f.lineWidth = 2.2 * s;
  for (const h of S.mirrorHits) {
    const vis = lampVis(h.lamp) * h.k;
    if (vis < 0.02) continue;
    f.globalAlpha = 0.8 * vis;
    f.strokeStyle = LIGHT_HOT[h.color];
    f.beginPath(); f.moveTo(h.x1, h.y1); f.lineTo(h.x2, h.y2); f.stroke();
    if (!flares(h)) continue;
    const len = Math.hypot(h.x2 - h.x1, h.y2 - h.y1);
    f.globalAlpha = 0.4 * vis;
    drawGlowSized(f, LIGHT[h.color], (h.x1 + h.x2) / 2, (h.y1 + h.y2) / 2, Math.round(clamp(len * 0.8, 40 * s, 100 * s) / 8) * 8);
  }
  f.restore();
}

/** Live mirror effects (Sprites): a soft sheen sliding along each mirror and a twinkling glint where a beam bounces off it. */
function drawMirrorFx(ctx, t) {
  const s = S.scale;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const o of S.obstacles) {
    if (!isMirror(o)) continue;
    const ph = ((t * 0.21 + o.id * 0.37) % 1.7) - 0.35;   // passes along, then rests a moment off the ends
    if (ph <= 0 || ph >= 1) continue;
    const hx = 1.6 * o.r * 0.9, hy = 0.065 * o.r, ux = Math.cos(o.rot), uy = Math.sin(o.rot);
    const c = -hx + 2 * hx * ph, a = Math.max(-hx, c - hx * 0.22), b = Math.min(hx, c + hx * 0.22);
    const a2 = Math.max(-hx, c - hx * 0.09), b2 = Math.min(hx, c + hx * 0.09);
    const fade = Math.sin(ph * Math.PI);
    ctx.beginPath(); ctx.moveTo(o.bx + ux * a, o.by + uy * a); ctx.lineTo(o.bx + ux * b, o.by + uy * b);
    ctx.strokeStyle = `rgba(255,255,255,${0.2 * fade})`; ctx.lineWidth = hy * 1.8; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(o.bx + ux * a2, o.by + uy * a2); ctx.lineTo(o.bx + ux * b2, o.by + uy * b2);
    ctx.strokeStyle = `rgba(255,255,255,${0.5 * fade})`; ctx.lineWidth = hy * 0.9; ctx.stroke();
  }
  const g = Math.round((28 * s) / 4) * 4;
  for (const h of S.mirrorHits) {
    const vis = lampVis(h.lamp) * h.k;
    if (vis < 0.02 || !flares(h)) continue;
    ctx.globalAlpha = vis * (0.7 + 0.3 * Math.sin(t * 6.5 + h.o.id * 1.7));
    drawGlowSized(ctx, '#ffffff', (h.x1 + h.x2) / 2, (h.y1 + h.y2) / 2, g);
  }
  ctx.restore();
}

function paintGlass(ctx, o, rr) {
  const base = BASE[o.glass], s = S.scale;
  polyPath(ctx, o.points, rr);
  ctx.fillStyle = U.rgba(base, 0.22);
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.translate(o.bx, o.by);
  ctx.rotate(o.rot - 0.6);
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.fillRect(-o.r * 0.55, -o.r * 2, o.r * 0.22, o.r * 4);
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(-o.r * 0.18, -o.r * 2, o.r * 0.1, o.r * 4);
  ctx.restore();
  polyPath(ctx, o.points, rr);
  ctx.strokeStyle = U.rgba(U.mixHex(base, '#ffffff', 0.25), 0.9);
  ctx.lineWidth = 2 * s;
  ctx.stroke();
}

function drawLitRims(ctx) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.lineWidth = 2.6 * S.scale;
  for (let c = 0; c < NC; c++) {
    for (let b = 0; b < RIM_BUCKETS; b++) {
      ctx.beginPath();
      let any = false;
      for (const o of S.obstacles) {
        const el = o.fx.edgeLit, pts = o.points, n = pts.length, rr = cornerRadius(o);
        for (let i = 0, j = n - 1; i < n; j = i++) {
          const I = el[j * NC + c];
          if (I <= 0 || Math.min(RIM_BUCKETS - 1, Math.floor(I * 1.5 * RIM_BUCKETS)) !== b) continue;
          const ax = pts[j].x, ay = pts[j].y, bx = pts[i].x, by = pts[i].y, len = Math.hypot(bx - ax, by - ay) || 1;
          const k = n > 8 ? 0 : Math.min(0.45, rr / len);
          ctx.moveTo(lerp(ax, bx, k), lerp(ay, by, k));
          ctx.lineTo(lerp(bx, ax, k), lerp(by, ay, k));
          any = true;
        }
      }
      if (!any) continue;
      ctx.strokeStyle = U.rgba(LIGHT[COLORS[c]], (b + 1) / RIM_BUCKETS);
      ctx.stroke();
    }
  }
  ctx.restore();
}

let motePhase = 0;
function drawMotes(ctx, t) {
  const R = S.room, s = S.scale, pieces = S.pieces, motes = S.motes;
  // the light test is spread over three frames (six with many reflections); a mote drifts about a pixel meanwhile
  const spread = pieces.length > 12 ? 6 : 3;
  motePhase = (motePhase + 1) % spread;
  ctx.fillStyle = 'rgba(190,205,255,0.09)';
  ctx.beginPath();
  for (let k = 0; k < motes.length; k++) {
    const d = motes[k], x = R.x + d.u * R.w, y = R.y + d.v * R.h;
    if (k % spread === motePhase) {
      d.mask = 0; d.lit = 0;
      for (const p of pieces) {
        const vis = lampVis(p.lamp);
        if (vis <= 0.01) continue;
        const I = pieceGlow(x, y, p) * vis;
        if (I <= 0) continue;
        d.lit += I; d.mask |= 1 << CI[p.color];
      }
    }
    if (!d.mask) ctx.rect(x, y, 1.6 * d.sz, 1.6 * d.sz);
  }
  ctx.fill();
  // lit motes sparkle in the additive mix of the beams they float in, brighter where beams overlap
  ctx.globalCompositeOperation = 'lighter';
  for (const d of S.motes) {
    if (!d.mask) continue;
    const x = R.x + d.u * R.w, y = R.y + d.v * R.h;
    const tw2 = 0.45 + 0.55 * Math.pow(0.5 + 0.5 * Math.sin(t * d.f + d.ph), 2);
    const size = (8 + 8 * Math.min(1, d.lit)) * s * d.sz;
    ctx.globalAlpha = Math.min(1, d.lit * 1.8) * tw2;
    drawGlowSized(ctx, MIX[d.mask], x, y, size);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/** Visible brightness of a lamp: switch fade plus the flicker while it warms up (sprites only). */
function lampVis(l) { return l.fx.power * l.fx.flick; }

function flapOf(m) { return 0.2 + 0.8 * Math.pow(0.5 + 0.5 * Math.cos(m.flap), 0.8); }

function drawMothsSprite(ctx) {
  const s = S.scale, dpr = Kit.dpr, moths = S.moths;
  // shadows on the floor (moths fly above it): two batched layers fake a soft edge
  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath();
    for (const m of moths) {
      const ws = MOTH_WS * s * m.size, f = flapOf(m), q = pass ? 0.62 : 1;
      ctx.moveTo(m.x + 7 * s + ws * 0.13 * q, m.y + 12 * s);
      ctx.ellipse(m.x + 7 * s, m.y + 12 * s, ws * 0.13 * q, ws * (0.12 + 0.24 * f) * q, m.h, 0, TAU);
    }
    ctx.fillStyle = 'rgba(0,0,8,0.2)';
    ctx.fill();
  }
  // glowing trails (a faint long tail plus a brighter recent part), batched per mix of light colors
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  maskList.length = 0;
  for (const m of moths) if (m.glow >= 0.3 && m.glowMask && !maskSeen[m.glowMask]) { maskSeen[m.glowMask] = 1; maskList.push(m.glowMask); }
  for (const mk of maskList) {
    maskSeen[mk] = 0;
    for (let part = 0; part < 2; part++) {
      ctx.beginPath();
      for (const m of moths) {
        if (m.glow < 0.3 || m.glowMask !== mk) continue;
        const fx = m.fx, n = fx.tn, i0 = part ? Math.floor(n / 2) : 0;
        for (let i = i0; i < n; i++) {
          const a = (fx.th - n + i + TRAIL * 2) % TRAIL;
          if (i === i0) ctx.moveTo(fx.trail[a * 2], fx.trail[a * 2 + 1]); else ctx.lineTo(fx.trail[a * 2], fx.trail[a * 2 + 1]);
        }
      }
      ctx.strokeStyle = MIX[mk];
      ctx.globalAlpha = part ? 0.4 : 0.18;
      ctx.lineWidth = (part ? 3.2 : 1.6) * s;
      ctx.stroke();
    }
  }
  // halo in the mix of the lamps lighting it, brighter in an overlap. In a dense swarm halos are
  // smaller and dimmer, so they add up to a glow rather than a white blot that hides the moths.
  for (const m of moths) {
    if (m.glow < 0.03 || !m.glowMask) continue;
    const size = MOTH_WS * s * (1.2 + 0.5 * clamp((4 - m.crowd) / 3, 0, 1));
    ctx.globalAlpha = Math.min(1, 0.55 * (1 + 0.4 * m.boost)) * m.glow / (1 + 0.25 * m.crowd);
    drawGlowSized(ctx, MIX[m.glowMask], m.x, m.y, Math.round(size / 4) * 4);   // 4 px steps keep the glow cache small
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  // one pre-composed flap frame per moth, all from the same atlas
  const A = mothAtlas, C = MOTH_CELL;
  for (const m of moths) {
    const fi = clamp(Math.round(((flapOf(m) - 0.2) / 0.8) * (FLAP_FRAMES - 1)), 0, FLAP_FRAMES - 1);
    const k = ((MOTH_WS * s * m.size) / 108) * dpr, sq = 1 + m.squash * 0.25;
    const c = Math.cos(m.h) * k, sn = Math.sin(m.h) * k, kx = 1 / sq, ky = sq;
    ctx.setTransform(c * kx, sn * kx, -sn * ky, c * ky, m.x * dpr, m.y * dpr);
    // crop the frame to its wing span so folded wings sample fewer pixels
    const ext = Math.min(-C.y, 61 * (0.2 + (0.8 * fi) / (FLAP_FRAMES - 1)) + 3), py = A.ch / C.h;
    ctx.drawImage(A, fi * A.cw, m.look * A.ch + (-C.y - ext) * py, A.cw, 2 * ext * py, C.x, -ext, C.w, 2 * ext);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/** Brass clamp on the rail and the arm that holds the spotlight head. */
function paintLampMount(ctx, l, alpha) {
  const s = S.scale, b = S.band;
  const gx = l.x - l.nx * b * 0.5, gy = l.y - l.ny * b * 0.5;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#3d2a10'; ctx.lineWidth = 6 * s;
  ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(l.x, l.y); ctx.stroke();
  ctx.strokeStyle = '#c99a48'; ctx.lineWidth = 3 * s;
  ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(l.x, l.y); ctx.stroke();
  ctx.translate(gx, gy);
  ctx.rotate(Math.atan2(l.ny, l.nx));
  U.roundRect(ctx, -4.5 * s, -9 * s, 9 * s, 18 * s, 3 * s);
  const cg = ctx.createLinearGradient(0, -9 * s, 0, 9 * s);
  cg.addColorStop(0, '#f0cf86'); cg.addColorStop(0.5, '#a97b33'); cg.addColorStop(1, '#5a3e14');
  ctx.fillStyle = cg; ctx.fill();
  ctx.strokeStyle = 'rgba(30,18,4,0.8)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#3a2708';
  ctx.beginPath(); ctx.arc(0, -5 * s, 1.3 * s, 0, TAU); ctx.arc(0, 5 * s, 1.3 * s, 0, TAU); ctx.fill();
  ctx.restore();
}

/** Spotlight head in local units (faces +x, lens at the origin). */
function paintLampHead(g, color, on) {
  const col = LIGHT[color];
  g.beginPath();
  g.moveTo(-19, -6.5);
  g.lineTo(1, -11.5);
  g.quadraticCurveTo(5, 0, 1, 11.5);
  g.lineTo(-19, 6.5);
  g.quadraticCurveTo(-23, 0, -19, -6.5);
  g.closePath();
  const hg = g.createLinearGradient(0, -11, 0, 11);
  hg.addColorStop(0, '#10151f'); hg.addColorStop(0.32, '#46536b'); hg.addColorStop(0.55, '#26303f'); hg.addColorStop(1, '#0c1018');
  g.fillStyle = hg; g.fill();
  g.strokeStyle = '#06080d'; g.lineWidth = 1; g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.12)';
  g.fillRect(-16, -6.8, 14, 1.4);
  g.strokeStyle = '#d8ab55'; g.lineWidth = 2.4;
  g.beginPath(); g.ellipse(2.2, 0, 3.2, 11.6, 0, 0, TAU); g.stroke();
  g.beginPath(); g.ellipse(2.7, 0, 2.3, 9.6, 0, 0, TAU);
  if (on) {
    const lg = g.createRadialGradient(3, 0, 0, 3, 0, 10);
    lg.addColorStop(0, '#ffffff'); lg.addColorStop(0.45, U.mixHex(col, '#ffffff', 0.45)); lg.addColorStop(1, col);
    g.fillStyle = lg;
  } else g.fillStyle = U.mixHex(col, '#1a1f29', 0.78);
  g.fill();
  g.fillStyle = '#b8893c';
  g.beginPath(); g.arc(-20.5, 0, 3, 0, TAU); g.fill();
}

function buildLampSprites() {
  const res = S.scale * 1.3 * 1.35 * Kit.dpr;
  if (Math.abs(res - lampAtlas.res) < 0.01) return;
  const cw = Math.ceil(LAMP_CELL.w * res), ch = Math.ceil(LAMP_CELL.h * res);
  lampAtlas.width = cw * 2; lampAtlas.height = ch * NC;   // a row per color: off, on
  lampAtlas.res = res; lampAtlas.cw = cw; lampAtlas.ch = ch;
  const g = lampAtlas.getContext('2d');
  COLORS.forEach((c, row) => [false, true].forEach((on, col) => {
    g.setTransform(cw / LAMP_CELL.w, 0, 0, ch / LAMP_CELL.h, col * cw - LAMP_CELL.x * (cw / LAMP_CELL.w), row * ch - LAMP_CELL.y * (ch / LAMP_CELL.h));
    paintLampHead(g, c, on);
  }));
}

/** The head (from the atlas, cross-faded off/on while switching) plus its additive halo. */
function drawLampHead(ctx, l, alpha, color, power, t) {
  const s = S.scale, fx = l.fx, dpr = Kit.dpr, A = lampAtlas, C = LAMP_CELL;
  const k = s * 1.3 * (1 + fx.pulse * 0.28);
  const c = Math.cos(l.angle) * k * dpr, sn = Math.sin(l.angle) * k * dpr, row = CI[color];
  ctx.setTransform(c, sn, -sn, c, l.x * dpr, l.y * dpr);
  if (power < 0.98) { ctx.globalAlpha = alpha; ctx.drawImage(A, 0, row * A.ch, A.cw, A.ch, C.x, C.y, C.w, C.h); }
  if (power > 0.02) { ctx.globalAlpha = alpha * power; ctx.drawImage(A, A.cw, row * A.ch, A.cw, A.ch, C.x, C.y, C.w, C.h); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (power > 0.02) {
    const lx = l.x + Math.cos(l.angle) * 3 * k, ly = l.y + Math.sin(l.angle) * 3 * k;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = alpha * power * (0.8 + 0.06 * Math.sin(t * 9 + l.id));
    (fx.pulse > 0 ? drawGlow : drawGlowSized)(ctx, LIGHT[color], lx, ly, 130 * s * (1 + fx.pulse * 0.3));
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.globalAlpha = 1;
}

function drawParticlesSprite(ctx) {
  ctx.save();
  for (let i = 0; i < partN; i++) {
    const p = PARTS[i], k = p.life / p.max;
    if (p.kind === 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = k;
      const sz = p.size * 4 * (0.5 + k * 0.5);
      drawGlow(ctx, p.color, p.x, p.y, sz);
    } else if (p.kind === 1) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = k * 0.8;
      ctx.strokeStyle = p.color; ctx.lineWidth = 2.5 * S.scale * k + 0.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * U.easeOutCubic(1 - k) + 2, 0, TAU); ctx.stroke();
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = k * 0.35;
      ctx.fillStyle = U.mixHex(p.color, '#c8c2d8', 0.5);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.4 - k * 0.6), 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
}

// ================================================================== rendering: shapes
function drawObstaclesShapes(ctx) {
  for (const o of S.obstacles) {
    polyPath(ctx, o.points, 0);
    if (isMirror(o)) {   // a flat white bar with a thin gray edge
      ctx.fillStyle = SH.white;
      ctx.fill();
      ctx.strokeStyle = SH.mid;
      ctx.lineWidth = 1;
      ctx.stroke();
    } else if (o.glass) {
      ctx.fillStyle = U.rgba(BASE[o.glass], 0.35);
      ctx.fill();
      ctx.strokeStyle = BASE[o.glass];
      ctx.lineWidth = 2;
      ctx.stroke();
    } else {
      ctx.fillStyle = SH.obj;
      ctx.fill();
    }
  }
}

/** Agent ring k (0 innermost) in color index ci, with a dark outline that keeps it readable on a light
 *  of its own color. Painted once per size at device resolution (stroking arcs every frame is slow). */
const ringSprites = new Map();
function ringSprite(ci, k) {
  const s = S.scale, d = Kit.dpr, rr = (9 + 4.5 + 4.5 * k) * s, key = `${ci}|${k}|${(rr * d).toFixed(1)}`;
  let c = ringSprites.get(key);
  if (!c) {
    if (ringSprites.size >= 64) ringSprites.clear();
    c = document.createElement('canvas');
    c.half = Math.ceil((rr + 2.5 * s) * d) + 1;
    c.width = c.height = c.half * 2;
    const g = c.getContext('2d');
    g.setTransform(d, 0, 0, d, c.half, c.half);
    g.beginPath(); g.arc(0, 0, rr, 0, TAU);
    g.strokeStyle = SH.bg; g.lineWidth = 4.5 * s; g.stroke();
    g.strokeStyle = BASE[COLORS[ci]]; g.lineWidth = 2.5 * s; g.stroke();
    ringSprites.set(key, c);
  }
  return c;
}

function drawAgentsShapes(ctx) {
  const s = S.scale, r = 9 * s;
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 2 * s;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (const m of S.moths) {
    if (m.glow < 0.05) continue;
    const fx = m.fx, n = fx.tn;
    for (let i = 0; i < n; i++) {
      const a = (fx.th - n + i + TRAIL * 2) % TRAIL;
      if (i === 0) ctx.moveTo(fx.trail[a * 2], fx.trail[a * 2 + 1]); else ctx.lineTo(fx.trail[a * 2], fx.trail[a * 2 + 1]);
    }
  }
  ctx.stroke();
  // a ring in the color of each lamp lighting it (up to three), so an agent in an overlap wears more rings
  const d = Kit.dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const m of S.moths) {
    if (m.glow < 0.3) continue;
    const rings = m.fx.rings;
    for (let k = 0; k < 3; k++) {
      if (rings[k] < 0) continue;
      const c = ringSprite(rings[k], k);
      ctx.drawImage(c, Math.round(m.x * d) - c.half, Math.round(m.y * d) - c.half);
    }
  }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  // direction ticks, then bodies; a dark outline keeps them readable on white overlaps
  ctx.beginPath();
  for (const m of S.moths) {
    const c = Math.cos(m.h), sn = Math.sin(m.h);
    ctx.moveTo(m.x + c * r, m.y + sn * r);
    ctx.lineTo(m.x + c * (r + 8 * s), m.y + sn * (r + 8 * s));
  }
  ctx.strokeStyle = SH.bg;
  ctx.lineWidth = 6 * s;
  ctx.stroke();
  ctx.strokeStyle = SH.white;
  ctx.lineWidth = 3 * s;
  ctx.stroke();
  ctx.beginPath();
  for (const m of S.moths) {
    const q = 1 + m.squash * 0.25;
    ctx.moveTo(m.x + r * q, m.y);
    ctx.arc(m.x, m.y, r * q, 0, TAU);
  }
  ctx.strokeStyle = SH.bg;
  ctx.lineWidth = 3 * s;
  ctx.stroke();
  ctx.fillStyle = SH.white;
  ctx.fill();
}

function drawLampShapes(ctx, l, alpha, color, on) {
  const s = S.scale, k = 1 + l.fx.pulse * 0.3, half = 11 * s * k;
  ctx.globalAlpha = alpha;
  if (on) {
    ctx.fillStyle = BASE[color];
    ctx.fillRect(l.x - half, l.y - half, half * 2, half * 2);
  } else {
    ctx.fillStyle = SH.dark;
    ctx.fillRect(l.x - half, l.y - half, half * 2, half * 2);
    ctx.strokeStyle = BASE[color];
    ctx.lineWidth = 2;
    ctx.strokeRect(l.x - half + 1, l.y - half + 1, half * 2 - 2, half * 2 - 2);
  }
  ctx.globalAlpha = 1;
}

function drawParticlesShapes(ctx) {
  ctx.save();
  for (let i = 0; i < partN; i++) {
    const p = PARTS[i], k = p.life / p.max, col = SHAPE_INK.has(p.color) ? p.color : SH.mid;
    ctx.globalAlpha = p.kind === 2 ? k * 0.4 : k;
    if (p.kind === 1) {
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * U.easeOutCubic(1 - k) + 2, 0, TAU); ctx.stroke();
    } else {
      ctx.fillStyle = p.kind === 2 ? SH.mid : col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.kind === 2 ? p.size * 0.6 : p.size * 0.8, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
}

// ================================================================== rendering: overlays (both views)
function drawOverlays(ctx, t) {
  const s = S.scale, abs = Kit.isAbstract;
  const ui = abs ? SH.white : ACCENT;
  // beam edges
  if (tw('edges')) {
    ctx.save();
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 5]);
    for (const p of S.pieces) {
      if (!p.path || !p.lamp.on) continue;
      ctx.strokeStyle = U.rgba(abs ? BASE[p.color] : U.mixHex(LIGHT[p.color], '#ffffff', 0.4), 0.9);
      ctx.stroke(p.path);
    }
    ctx.restore();
  }
  // objects: hover + selection
  const ho = S.hover.obj, so = S.selObj;
  if (ho && ho !== so) {
    outlinePath(ctx, ho, abs);
    ctx.strokeStyle = abs ? SH.mid : 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2;
    ctx.stroke();
  }
  if (so) {
    ctx.save();
    outlinePath(ctx, so, abs);
    ctx.strokeStyle = ui; ctx.lineWidth = 2.5;
    ctx.setLineDash([8, 6]); ctx.lineDashOffset = -t * 30;
    ctx.stroke();
    ctx.restore();
  }
  // rail highlight + ghost lamp
  const g = S.ghost;
  if (g.on && !S.drag) {
    const full = S.lamps.length >= MAX_LAMPS;
    ctx.save();
    ctx.strokeStyle = full ? 'rgba(154,154,166,0.5)' : abs ? 'rgba(255,255,255,0.4)' : 'rgba(255,220,130,0.8)';
    ctx.lineWidth = Math.max(3, S.band * 0.14);
    ctx.stroke(S.railPath);
    if (!abs && !full) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.8;
      drawGlow(ctx, ACCENT, g.x - g.nx * S.band * 0.5, g.y - g.ny * S.band * 0.5, 90 * s);
    }
    ctx.restore();
    const color = full ? null : S.color;
    if (abs) {
      const half = 11 * s;
      ctx.save();
      ctx.strokeStyle = full ? SH.mid : BASE[color];
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(g.x - half, g.y - half, half * 2, half * 2);
      ctx.restore();
    } else {
      paintLampMount(ctx, g, full ? 0.3 : 0.55);
      drawLampHead(ctx, g, full ? 0.3 : 0.55, color || 'red', 0, t);
    }
    if (!full) {
      // preview of the cone a new lamp would throw
      const w = clamp(tw('width'), 8, 80) * DEG / 2, L = 120 * s;
      ctx.save();
      ctx.strokeStyle = abs ? BASE[color] : U.rgba(LIGHT[color], 0.8);
      ctx.globalAlpha = 0.7;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(g.x + Math.cos(g.angle - w) * L, g.y + Math.sin(g.angle - w) * L);
      ctx.lineTo(g.x, g.y);
      ctx.lineTo(g.x + Math.cos(g.angle + w) * L, g.y + Math.sin(g.angle + w) * L);
      ctx.stroke();
      ctx.restore();
    }
  }
  // lamp hover ring
  const hl = S.hover.lamp;
  if (hl && hl !== S.selLamp) {
    ctx.save();
    ctx.strokeStyle = abs ? SH.mid : 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(hl.x, hl.y, 22 * s, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  // selected lamp: ring, cone guides, aim knob
  const l = S.selLamp;
  if (l) {
    const L = handleLen(), hw = l.width / 2;
    const hx = l.ox + Math.cos(l.angle) * L, hy = l.oy + Math.sin(l.angle) * L;
    ctx.save();
    ctx.strokeStyle = ui; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(l.x, l.y, 22 * s, 0, TAU); ctx.stroke();
    ctx.setLineDash([6, 6]); ctx.lineDashOffset = -t * 24; ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.arc(l.x, l.y, 28 * s, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.55; ctx.lineDashOffset = 0; ctx.setLineDash([4, 5]); ctx.lineWidth = 1.5;
    ctx.strokeStyle = abs ? SH.white : 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.moveTo(l.ox + Math.cos(l.angle - hw) * L * 1.3, l.oy + Math.sin(l.angle - hw) * L * 1.3);
    ctx.lineTo(l.ox, l.oy);
    ctx.lineTo(l.ox + Math.cos(l.angle + hw) * L * 1.3, l.oy + Math.sin(l.angle + hw) * L * 1.3);
    ctx.moveTo(l.ox, l.oy); ctx.lineTo(hx, hy);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    drawKnob(ctx, hx, hy, l.angle, S.hover.handle || (S.drag && S.drag.kind === 'aim'));
    ctx.restore();
  }
  // selected mirror: its turn knob just past one end, joined to it by a thin guide on its axis
  if (so && isMirror(so)) {
    const k = mirrorKnob(so, S.drag && S.drag.kind === 'turn' ? S.drag.end : 0), tip = 1.6 * so.r;
    const ux = Math.cos(so.rot) * k.end, uy = Math.sin(so.rot) * k.end;
    ctx.save();
    ctx.globalAlpha = 0.55; ctx.setLineDash([4, 5]); ctx.lineWidth = 1.5;
    ctx.strokeStyle = abs ? SH.white : 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.moveTo(so.bx + ux * (tip + 4 * s), so.by + uy * (tip + 4 * s)); ctx.lineTo(k.x, k.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    drawKnob(ctx, k.x, k.y, so.rot, S.hover.turn || (S.drag && S.drag.kind === 'turn'));
    ctx.restore();
  }
}

/** A round knob with two little rotate arrows (a lamp's aim, a mirror's turn); `hot` while hovered or dragged. */
function drawKnob(ctx, x, y, ang, hot) {
  const abs = Kit.isAbstract, kr = (hot ? 11 : 9) * S.scale, ink = abs ? SH.bg : '#2a1d00';
  if (hot) { ctx.fillStyle = abs ? 'rgba(255,255,255,0.25)' : 'rgba(255,209,102,0.3)'; ctx.beginPath(); ctx.arc(x, y, kr * 1.8, 0, TAU); ctx.fill(); }
  ctx.fillStyle = abs ? SH.white : ACCENT;
  ctx.strokeStyle = ink;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, kr, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(x, y, kr * 0.5, ang + 0.5, ang + 2.6); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, kr * 0.5, ang + 3.6, ang + 5.7); ctx.stroke();
}

function render(ctx, rdt) {
  if (!S.ready) return;
  const t = Kit.time, rt = Kit.realTime, abs = Kit.isAbstract;
  pollKeys(rdt);
  // wall-clock animations keep feedback alive while paused
  for (const l of S.lamps) {
    const fx = l.fx;
    const target = l.on ? 1 : 0;
    if (fx.power !== target) {
      S.floorDirty = true;
      fx.power = clamp(fx.power + (target ? rdt * 3.2 : -rdt * 5), 0, 1);
      fx.flick = target && fx.power < 1 && !abs ? (Math.random() < 0.35 ? 0.25 : 1) : 1;
    } else fx.flick = 1;
    fx.pulse = Math.max(0, fx.pulse - rdt * 2.6);
  }
  for (const o of S.obstacles) {
    if (o.pop < 1) { o.pop = Math.min(1, o.pop + rdt / 0.45); updateObstacle(o); if (o.pop >= 1) clampObstacle(o); S.dirty = true; }
    if (o.fx.flash > 0) o.fx.flash = Math.max(0, o.fx.flash - rdt * 3.5);
  }
  updateParticles(rdt);
  if (S.dirty) recomputeBeams();

  drawFloor(ctx);
  if (abs) {
    drawObstaclesShapes(ctx);
    drawObjectFlashes(ctx);
    drawAgentsShapes(ctx);
    drawParticlesShapes(ctx);
    for (const l of S.lamps) drawLampShapes(ctx, l, 1, l.color, l.on);
  } else {
    drawObjectFlashes(ctx);
    drawMirrorFx(ctx, rt);
    if (tw('dust')) drawMotes(ctx, rt);
    drawMothsSprite(ctx);
    drawParticlesSprite(ctx);
    for (const l of S.lamps) drawLampHead(ctx, l, 1, l.color, lampVis(l), rt);
  }
  drawOverlays(ctx, rt);
}

// ================================================================== simulation entry points
function update(dt, t) {
  if (!S.ready) return;
  if (S.dirty) recomputeBeams();
  if (S.mapDirty && Kit.realTime - MAP.builtAt >= 0.1) buildMap();   // at most ~10 rebuilds a second while dragging
  updateMoths(dt, t);
  updateMotes(dt, t);
}

function updateCounts() {
  const n = S.lamps.length;
  Kit.setStat('lamps', `${n}/${MAX_LAMPS}`, { neutral: true });
  if (S.ui.readout) S.ui.readout.textContent = `${Kit.pick('Lamps', 'Lights')} ${n}/${MAX_LAMPS}`;
  if (S.ui.addLampBtn) S.ui.addLampBtn.disabled = n >= MAX_LAMPS;
  if (S.ui.clearBtn) S.ui.clearBtn.disabled = n === 0;
  S.litCount = S.moths.filter((m) => m.n > 0).length;
  Kit.setStat('lit', `${S.litCount}/${S.moths.length}`, { neutral: true });
  showLevel();
}

/** "Brightest": how many beams make the light the swarm roams in. */
function showLevel() {
  const k = S.level;
  Kit.setStat('level', k > 0 ? `${k} ${Kit.pick(k === 1 ? 'beam' : 'beams', k === 1 ? 'light' : 'lights')}` : '—', { neutral: true });
}

function refreshHint() {
  if (S.selLamp) Kit.setHint('Drag the knob or press ← → to aim. ↑ ↓ width, 1–6 color, O on or off.');
  else if (S.selObj && isMirror(S.selObj)) Kit.setHint('Turn the mirror by its knob, the wheel or Q E; Shift for 1° steps.');
  else if (S.selObj) Kit.setHint('Drag to move it. Wheel or Q E rotates, Shift for 1° steps. Delete removes it.');
  else Kit.setHint(null);
}

/** Default scene: a red lamp on the left and a blue one on top cross their beams in the open middle;
 *  one moth, already in the red beam, is on its way to the brighter overlap. */
function buildDefaultScene() {
  const R = S.room, s = S.scale;
  S.lamps = []; S.obstacles = []; S.moths = [];
  S.selLamp = null; S.selObj = null; S.drag = null;
  S.hover.lamp = null; S.hover.obj = null; S.hover.handle = false; S.hover.turn = false;
  S.level = -1;
  partN = 0;
  for (const [kind, cx, cy, size, rot, glass] of DEFAULT_OBJECTS) {
    const o = makeObstacle(kind, cx, cy, size, rot * DEG, glass);
    clampObstacle(o);
    S.obstacles.push(o);
  }
  const at = (u, v) => ({ x: R.x + R.w * u, y: R.y + R.h * v });
  const red = addLampAt(R.x, R.y + R.h * 0.5, 'red', { silent: true, aimAt: at(0.55, 0.6) });
  addLampAt(R.x + R.w * 0.56, R.y, 'blue', { silent: true, aimAt: at(0.44, 0.62) });
  recomputeBeams();
  buildMap();
  // the hero moth starts lit, partway along the red beam
  let start = null;
  for (let d = 150 * s; d < 420 * s && !start; d += 10 * s) {
    const x = red.ox + Math.cos(red.angle - 0.05) * d, y = red.oy + Math.sin(red.angle - 0.05) * d;
    if (sampleLight(x, y).n === 1 && openSpot(x, y, 26 * s)) start = { x, y };
  }
  start = start || randomFreePoint(30 * s);
  const hero = makeMoth(start.x, start.y, 1);
  hero.size = 1.08;
  S.moths.push(hero);
  const pr = sampleLight(hero.x, hero.y);
  if (pr.n) {
    feelLight(hero, pr);
    hero.state = 'seek'; hero.glow = 1; hero.lastLit = Kit.time;
    if (plan(hero, false)) {
      hero.h = hero.wh = Math.atan2(hero.dest.y - hero.y, hero.dest.x - hero.x);
      hero.vx = Math.cos(hero.h) * 60 * s; hero.vy = Math.sin(hero.h) * 60 * s;
    }
  }
  S.ready = true;
  setCreatureCount(tw('count'));
  updateCounts();
  refreshHint();
  if (Kit.mouse.inside) updateHover(Kit.mouse.x, Kit.mouse.y);
}

// ================================================================== UI wiring
const svgIcon = (body) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
// a tinted pane with glints; Shapes gets a plain tinted square
const GLASS_ICON = {
  sprite: svgIcon('<rect x="5" y="4" width="14" height="16" rx="1.5" fill="currentColor" fill-opacity="0.3"/><path d="M9 8.5l-1.6 2.8M13 8.5l-4.2 7.2"/>'),
  abstract: svgIcon('<rect x="5" y="5" width="14" height="14" fill="currentColor" fill-opacity="0.35"/>'),
};
// the textbook mirror symbol (a line hatched on its back) with a ray bouncing off it: a mechanic, so the same in both views
const MIRROR_ICON = svgIcon('<path d="M3 16.5h18"/><path d="M6.5 16.5l-2 3.5M10.5 16.5l-2 3.5M14.5 16.5l-2 3.5M18.5 16.5l-2 3.5" stroke-width="1.4"/><path d="M4.5 4L12 14l7.5-10M16 4.3l3.5-.3.3 3.4" stroke-width="1.8"/>');

// Toy-local styles (kit.css stays shared), more specific than the kit's own rules: the color bar (six
// round swatches in one pill), a slightly tighter toolbar, and a help card whose "How to play" column
// is wide enough for the objects row on one line (the "Everywhere" column keeps room to spare).
const TOY_CSS = `
@media (min-width: 861px) { .kit-help-cols { grid-template-columns: 1.7fr 1fr; } }
.bm-swatches { display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 999px;
  background: rgba(0, 0, 0, 0.3); box-shadow: inset 0 0 0 1px var(--line); }
.bm-swatches .kit-tool.is-swatch { width: 38px; height: 40px; padding: 0; justify-content: center;
  border-radius: 50%; background: transparent; }
.kit-toolbar .bm-tight .kit-tool.is-icon { width: 40px; }   /* room for the mirror button on one row at 1280 */
.bm-swatches .kit-tool.is-swatch:hover { background: rgba(255, 255, 255, 0.1); }
.bm-swatches .kit-swatch { width: 30px; height: 30px; display: grid; place-items: center;
  font: 600 13px/1 var(--font-mono); color: rgba(0, 0, 0, 0.62);
  box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.2), 0 0 0 1.5px rgba(0, 0, 0, 0.4); transition: transform .15s, box-shadow .15s; }
.bm-swatches .kit-tool.is-swatch.is-active { border-color: transparent; background: rgba(255, 255, 255, 0.12);
  box-shadow: 0 0 0 2px var(--sw), 0 0 20px color-mix(in srgb, var(--sw) 60%, transparent); }
.bm-swatches .kit-tool.is-active .kit-swatch { transform: scale(1.12); color: rgba(0, 0, 0, 0.88);
  box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.2), 0 0 0 2px rgba(255, 255, 255, 0.92); }
`;

function setup() {
  document.head.append(Object.assign(document.createElement('style'), { textContent: TOY_CSS }));
  S.ui.swatch = {};
  const gColor = Kit.ui.group({ sprite: 'Lamp color', abstract: 'Light color' });
  const bar = document.createElement('div');
  bar.className = 'bm-swatches';
  gColor.append(bar);
  COLORS.forEach((c, i) => {
    const b = Kit.ui.button({
      parent: bar, swatch: BASE[c], iconOnly: true, key: String(i + 1),
      tip: { sprite: `${NAME[c]} light for new lamps and the selected one`, abstract: `${NAME[c]} for new lights and the selected one` },
      onClick: () => setColor(c, true),
    });
    b.querySelector('.kit-swatch').textContent = String(i + 1);
    S.ui.swatch[c] = b;
  });
  const gLamps = Kit.ui.group(null);
  gLamps.classList.add('bm-tight');
  S.ui.readout = Kit.ui.readout(gLamps);
  S.ui.addLampBtn = Kit.ui.button({ parent: gLamps, icon: 'plus', iconOnly: true, key: 'L', tip: { sprite: 'Hang a lamp in a free spot', abstract: 'Add a light in a free spot' }, onClick: () => addLampFree() });
  S.ui.clearBtn = Kit.ui.button({ parent: gLamps, icon: 'trash', iconOnly: true, tip: { sprite: 'Take down all lamps', abstract: 'Remove all lights' }, onClick: clearLamps });
  const gObj = Kit.ui.group('Add object');
  gObj.classList.add('bm-tight');
  const objTips = {
    square: { sprite: 'Add a wooden block', abstract: 'Add a square' },
    triangle: { sprite: 'Add a wooden wedge', abstract: 'Add a triangle' },
    circle: { sprite: 'Add a round stone', abstract: 'Add a circle' },
    bar: { sprite: 'Add a plank', abstract: 'Add a bar' },
  };
  for (const [key, k] of OBJECT_KEYS) {
    if (k !== 'glass') Kit.ui.button({ parent: gObj, icon: k, iconOnly: true, key, tip: objTips[k], onClick: () => addObject(k) });
  }
  S.ui.glassBtn = Kit.ui.button({
    parent: gObj, icon: Kit.t(GLASS_ICON), iconOnly: true, key: 'G',
    tip: { sprite: 'Add colored glass: only its own color shines through', abstract: 'Add a colored object: only its own color passes' },
    onClick: () => addObject('glass'),
  });
  S.ui.mirrorBtn = Kit.ui.button({
    parent: gObj, icon: MIRROR_ICON, iconOnly: true, key: '−',
    tip: 'Add a mirror: it bounces the light (turn it by its knob or the wheel)',
    onClick: () => addObject('mirror'),
  });
  setColor(S.color, false);
}

function viewChanged() {
  buildBackground();
  updateCounts();
  const icon = S.ui.glassBtn && S.ui.glassBtn.querySelector('svg');
  if (icon) icon.outerHTML = Kit.t(GLASS_ICON);
}

Kit.init({
  id: 'beam',
  number: '01',
  accent: '#ffd166',
  accentInk: '#2a1d00',
  title: { sprite: 'Moths & Lamps', abstract: 'Beam' },
  hint: {
    sprite: 'Click the frame to hang a lamp. Moths gather where beams overlap.',
    abstract: 'Click the frame to add a light. Agents gather where lights overlap.',
  },
  about: {
    sprite: 'Moths fly to the brightest light. Where beams overlap the light is stronger, and the swarm roams inside it. Move stones, glass and mirrors to shape the light.',
    abstract: 'Agents move to the brightest light. Where lights overlap the light is stronger, and the agents roam inside it. Move objects and mirrors to shape the light.',
  },
  // one line per row (key chips fit the help card's key column), so the card fits a 640 px tall screen
  controls: [
    { keys: ['Click frame', 'L'], label: { sprite: 'Hang a lamp (up to five)', abstract: 'Add a light (up to five)' } },
    { keys: ['1–6'], label: { sprite: 'Lamp color, from red to purple', abstract: 'Light color, from red to purple' } },
    { keys: ['Drag'], label: { sprite: 'Slide a lamp or move an object', abstract: 'Slide a light or move an object' } },
    { keys: ['Knob', '← →'], label: { sprite: 'Aim a lamp, or turn a mirror by its knob', abstract: 'Aim a light, or turn a mirror by its knob' } },
    { keys: ['Wheel'], label: { sprite: 'Aim a lamp or turn an object', abstract: 'Aim a light or turn an object' } },
    { keys: ['Shift+wheel'], label: 'Beam width (or ↑ ↓); turns an object 1°' },
    { keys: ['Double-click'], label: { sprite: 'Switch a lamp on or off (or press O)', abstract: 'Switch a light on or off (or press O)' } },
    { keys: ['Tab', 'Esc'], label: { sprite: 'Select the next lamp, or deselect', abstract: 'Select the next light, or deselect' } },
    { keys: ['7 8 9 0', 'G', '−'], label: { sprite: 'Add a block, wedge, stone, plank, glass or mirror', abstract: 'Add an object; G a colored one, − a mirror' } },
    { keys: ['Q E', 'Arrows'], label: 'Turn or nudge it; with Shift in 1° steps' },
    { keys: ['Right-click'], label: { sprite: 'Remove a lamp or object (or press Delete)', abstract: 'Remove a light or object (or press Delete)' } },
  ],
  stats: [
    { id: 'lamps', label: { sprite: 'Lamps', abstract: 'Lights' }, value: '0/5' },
    { id: 'lit', label: { sprite: 'Moths lit', abstract: 'Agents in light' }, value: '0/1' },
    { id: 'level', label: 'Brightest', value: '—' },
  ],
  tweaks: [
    { type: 'section', label: { sprite: 'Moths', abstract: 'Agents' } },
    { type: 'range', id: 'count', label: 'How many', min: 1, max: MAX_MOTHS, step: 1, value: DEFAULTS.count, onInput: (v) => setCreatureCount(v) },
    { type: 'range', id: 'speed', label: { sprite: 'Flying speed', abstract: 'Agent speed' }, min: 0.4, max: 2, step: 0.1, value: DEFAULTS.speed, format: (v) => v.toFixed(1) + '×' },
    { type: 'range', id: 'pull', label: 'Attraction', min: 0.3, max: 2.5, step: 0.1, value: DEFAULTS.pull, format: (v) => v.toFixed(1) + '×', note: { sprite: 'How fast moths rush to the brightest light.', abstract: 'How fast agents rush to the brightest light.' } },
    { type: 'range', id: 'roam', label: 'Roaming', min: 0.3, max: 2, step: 0.1, value: DEFAULTS.roam, format: (v) => v.toFixed(1) + '×', note: { sprite: 'How restless moths are inside the bright area.', abstract: 'How restless agents are inside the bright area.' } },
    { type: 'button', label: { sprite: 'Scatter moths', abstract: 'Scatter agents' }, onClick: scatter },
    { type: 'section', label: { sprite: 'Lamps', abstract: 'Lights' } },
    { type: 'range', id: 'reach', label: 'Beam reach', min: 200, max: 1200, step: 50, value: DEFAULTS.reach, format: (v) => v + ' px', onInput: () => { S.dirty = true; }, note: 'How far the light stays strong.' },
    { type: 'range', id: 'width', label: 'Beam width', min: 8, max: 80, step: 1, value: DEFAULTS.width, format: (v) => v + '°', onInput: (v) => { if (S.selLamp) setWidth(S.selLamp, v * DEG); }, note: { sprite: 'For new lamps and the selected one.', abstract: 'For new lights and the selected one.' } },
    { type: 'toggle', id: 'edges', label: 'Show beam edges', value: DEFAULTS.edges },
    { type: 'toggle', id: 'dust', label: 'Dust in the air', value: DEFAULTS.dust, when: () => !Kit.isAbstract },
    { type: 'section', label: 'Mirrors' },
    { type: 'range', id: 'bounces', label: 'Mirror bounces', min: 0, max: 4, step: 1, value: DEFAULTS.bounces, onInput: () => { S.dirty = true; }, note: 'How many times light can bounce on its way.' },
    { type: 'range', id: 'mirrorK', label: 'Mirror strength', min: 0.5, max: 1, step: 0.05, value: DEFAULTS.mirrorK, format: (v) => Math.round(v * 100) + ' %', onInput: () => { S.dirty = true; }, note: 'How much light is left after each bounce.' },
  ],
  setup,
  reset: buildDefaultScene,
  update,
  render,
  resize: () => layout(),
  viewChanged,
  pointerDown,
  pointerMove,
  pointerUp,
  pointerLeave: () => { S.hover.lamp = null; S.hover.obj = null; S.hover.handle = false; S.hover.turn = false; S.hover.frame = false; S.ghost.on = false; },
  wheel,
  dblclick,
  keydown,
  keyup,
  escape: deselect,
});

// ================================================================== test API
window.__toy = {
  get lamps() { return S.lamps; },
  get creatures() { return S.moths; },
  get obstacles() { return S.obstacles; },
  get room() { return Object.assign({}, S.room); },
  get frameBand() { return S.band; },
  COLORS,
  addLamp: (x, y, color) => addLampAt(x, y, color || S.color),
  removeLamp,
  litBy: (c) => (c ? sampleLight(c.x, c.y).lamp : null),   // the lamp lighting it most
  isLitPoint,
  lightAt: (x, y) => lightAt(x, y),
  lightMax: () => { syncMap(); return MAP.max; },
  setCreatureCount: (n) => Kit.setTweak('count', clamp(Math.round(n), 1, MAX_MOTHS)),
  // extras for tests and debugging
  get selectedLamp() { return S.selLamp; },
  get selectedObject() { return S.selObj; },
  get color() { return S.color; },
  setColor: (c) => setColor(c, true),
  selectLamp: (l) => selectLamp(l),
  addObject: (type, x, y) => addObject(type, x != null ? { x, y } : null),
  removeObstacle,
  beamPolygon: (l) => l.fx.poly.slice(),
  refresh: () => { for (const l of S.lamps) placeLamp(l); for (const o of S.obstacles) updateObstacle(o); recomputeBeams(); buildMap(); },
  /** The light map's regions, brightest first: [{peak, band (false: a slope of a brighter one), cells,
   *  floor (the lowest light inside it: below BAND·peak when it grew to fit its moths)}], plus the band threshold. */
  bands: () => {
    syncMap();
    const out = MAP.peak.map((peak, i) => ({ peak, band: MAP.isBand[i], cells: MAP.cells[i], floor: floorOf(i) }));
    return { max: MAP.max, threshold: BAND * MAP.max, beat: BEAT, regions: out };
  },
  /** Region index of the light-map cell at (x, y), -1 outside every region. */
  regionAt: (x, y) => { syncMap(); return MAP.n ? MAP.reg[cellIndex(x, y)] : -1; },
  railPoint: (s) => Object.assign({}, railAt(s)),
  get railLength() { return S.railLen; },
  /** Every beam piece: [{lamp, depth (0 = direct), poly (flat [x0, y0, x1, y1, …]), color, strength (its
   *  factor), source {x, y} (the lamp or its mirror image), mirror (index of the obstacle it leaves, or -1)}]. */
  beamPieces: () => {
    if (S.dirty) recomputeBeams();
    return S.pieces.map((p) => ({ lamp: p.lamp, depth: p.depth, poly: p.poly.slice(), color: p.color, strength: p.k, source: { x: p.sx, y: p.sy }, mirror: S.obstacles.indexOf(p.mirror) }));
  },
  reflectRay,
  /** The selected mirror's turn knob {x, y, end (±1: the end it sits past)}, or null when no mirror is selected. */
  mirrorKnob: () => (S.selObj && isMirror(S.selObj) ? Object.assign({}, mirrorKnob(S.selObj, S.drag && S.drag.kind === 'turn' ? S.drag.end : 0)) : null),
  /** How many times the beams (with their reflections) and the light map have been rebuilt. */
  get counters() { return Object.assign({}, S.counts); },
  /** Where light meets a mirror face: [{mirror (obstacle index), x1, y1, x2, y2 (the lit stretch), color,
   *  strength, depth (the bounces the light made before it got here), reflected (a reflection leaves there)}]. */
  mirrorHits: () => {
    if (S.dirty) recomputeBeams();
    return S.mirrorHits.map((h) => ({ mirror: S.obstacles.indexOf(h.o), x1: h.x1, y1: h.y1, x2: h.x2, y2: h.y2, color: h.color, strength: h.k, depth: h.depth, reflected: h.reflected }));
  },
};
</script>

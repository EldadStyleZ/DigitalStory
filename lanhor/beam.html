  ctx.setTransform(c, sn, -sn, c, l.x * dpr, l.y * dpr);
  if (power < 0.98) { ctx.globalAlpha = alpha; ctx.drawImage(A, 0, row * A.ch, A.cw, A.ch, C.x, C.y, C.w, C.h); }
  if (power > 0.02) { ctx.globalAlpha = alpha * power; ctx.drawImage(A, A.cw, row * A.ch, A.cw, A.ch, C.x, C.y, C.w, C.h); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (power > 0.02) {
    const lx = l.x + Math.cos(l.angle) * 3 * k, ly = l.y + Math.sin(l.angle) * 3 * k;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = alpha * power * (0.8 + 0.06 * Math.sin(t * 9 + l.id));
    (fx.pulse > 0 ? drawGlow : drawGlowSized)(ctx, LIGHT[color], lx, ly, 130 * s * (1 + fx.pulse * 0.3));
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.globalAlpha = 1;
}

function drawParticlesSprite(ctx) {
  ctx.save();
  for (let i = 0; i < partN; i++) {
    const p = PARTS[i], k = p.life / p.max;
    if (p.kind === 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = k;
      const sz = p.size * 4 * (0.5 + k * 0.5);
      drawGlow(ctx, p.color, p.x, p.y, sz);
    } else if (p.kind === 1) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = k * 0.8;
      ctx.strokeStyle = p.color; ctx.lineWidth = 2.5 * S.scale * k + 0.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * U.easeOutCubic(1 - k) + 2, 0, TAU); ctx.stroke();
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = k * 0.35;
      ctx.fillStyle = U.mixHex(p.color, '#c8c2d8', 0.5);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.4 - k * 0.6), 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
}

// ================================================================== rendering: shapes
function drawBeamsShapes(ctx) {
  ctx.save();
  ctx.clip(S.roomPath);
  ctx.globalCompositeOperation = 'lighter';
  for (const l of S.lamps) {
    if (!l.fx.path || l.fx.power <= 0.01) continue;
    ctx.globalAlpha = 0.5 * l.fx.power;
    ctx.fillStyle = BASE[l.color];
    ctx.fill(l.fx.path);
  }
  ctx.restore();
}

function drawObstaclesShapes(ctx) {
  for (const o of S.obstacles) {
    polyPath(ctx, o.points, 0);
    if (o.glass) {
      ctx.fillStyle = U.rgba(BASE[o.glass], 0.35);
      ctx.fill();
      ctx.strokeStyle = BASE[o.glass];
      ctx.lineWidth = 2;
      ctx.stroke();
    } else {
      ctx.fillStyle = SH.obj;
      ctx.fill();
    }
  }
}

function drawAgentsShapes(ctx) {
  const s = S.scale, r = 9 * s;
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 2 * s;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (const m of S.moths) {
    if (m.glow < 0.05) continue;
    const fx = m.fx, n = fx.tn;
    for (let i = 0; i < n; i++) {
      const a = (fx.th - n + i + TRAIL * 2) % TRAIL;
      if (i === 0) ctx.moveTo(fx.trail[a * 2], fx.trail[a * 2 + 1]); else ctx.lineTo(fx.trail[a * 2], fx.trail[a * 2 + 1]);
    }
  }
  ctx.stroke();
  for (const c of COLORS) {
    ctx.strokeStyle = BASE[c];
    ctx.lineWidth = 2.5 * s;
    ctx.beginPath();
    for (const m of S.moths) {
      if (m.glow < 0.3 || m.glowColor !== c) continue;
      ctx.moveTo(m.x + r + 4.5 * s, m.y);
      ctx.arc(m.x, m.y, r + 4.5 * s, 0, TAU);
    }
    ctx.stroke();
  }
  // direction ticks, then bodies; a dark outline keeps them readable on white overlaps
  ctx.beginPath();
  for (const m of S.moths) {
    const c = Math.cos(m.h), sn = Math.sin(m.h);
    ctx.moveTo(m.x + c * r, m.y + sn * r);
    ctx.lineTo(m.x + c * (r + 8 * s), m.y + sn * (r + 8 * s));
  }
  ctx.strokeStyle = SH.bg;
  ctx.lineWidth = 6 * s;
  ctx.stroke();
  ctx.strokeStyle = SH.white;
  ctx.lineWidth = 3 * s;
  ctx.stroke();
  ctx.beginPath();
  for (const m of S.moths) {
    const q = 1 + m.squash * 0.25;
    ctx.moveTo(m.x + r * q, m.y);
    ctx.arc(m.x, m.y, r * q, 0, TAU);
  }
  ctx.strokeStyle = SH.bg;
  ctx.lineWidth = 3 * s;
  ctx.stroke();
  ctx.fillStyle = SH.white;
  ctx.fill();
}

function drawLampShapes(ctx, l, alpha, color, on) {
  const s = S.scale, k = 1 + l.fx.pulse * 0.3, half = 11 * s * k;
  ctx.globalAlpha = alpha;
  if (on) {
    ctx.fillStyle = BASE[color];
    ctx.fillRect(l.x - half, l.y - half, half * 2, half * 2);
  } else {
    ctx.fillStyle = SH.dark;
    ctx.fillRect(l.x - half, l.y - half, half * 2, half * 2);
    ctx.strokeStyle = BASE[color];
    ctx.lineWidth = 2;
    ctx.strokeRect(l.x - half + 1, l.y - half + 1, half * 2 - 2, half * 2 - 2);
  }
  ctx.globalAlpha = 1;
}

function drawParticlesShapes(ctx) {
  ctx.save();
  for (let i = 0; i < partN; i++) {
    const p = PARTS[i], k = p.life / p.max;
    ctx.globalAlpha = p.kind === 2 ? k * 0.4 : k;
    if (p.kind === 1) {
      ctx.strokeStyle = p.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * U.easeOutCubic(1 - k) + 2, 0, TAU); ctx.stroke();
    } else {
      ctx.fillStyle = p.kind === 2 ? SH.mid : p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.kind === 2 ? p.size * 0.6 : p.size * 0.8, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
}

// ================================================================== rendering: overlays (both views)
function drawOverlays(ctx, t) {
  const s = S.scale, abs = Kit.isAbstract;
  const ui = abs ? SH.white : ACCENT;
  // beam edges
  if (tw('edges')) {
    ctx.save();
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 5]);
    for (const l of S.lamps) {
      if (!l.fx.path || !l.on) continue;
      ctx.strokeStyle = U.rgba(abs ? BASE[l.color] : U.mixHex(LIGHT[l.color], '#ffffff', 0.4), 0.9);
      ctx.stroke(l.fx.path);
    }
    ctx.restore();
  }
  // objects: hover + selection
  const ho = S.hover.obj, so = S.selObj;
  if (ho && ho !== so) {
    polyPath(ctx, ho.points, abs ? 0 : cornerRadius(ho));
    ctx.strokeStyle = abs ? SH.mid : 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2;
    ctx.stroke();
  }
  if (so) {
    ctx.save();
    polyPath(ctx, so.points, abs ? 0 : cornerRadius(so));
    ctx.strokeStyle = ui; ctx.lineWidth = 2.5;
    ctx.setLineDash([8, 6]); ctx.lineDashOffset = -t * 30;
    ctx.stroke();
    ctx.restore();
  }
  // rail highlight + ghost lamp
  const g = S.ghost;
  if (g.on && !S.drag) {
    const full = S.lamps.length >= MAX_LAMPS;
    ctx.save();
    ctx.strokeStyle = full ? 'rgba(154,154,166,0.5)' : abs ? 'rgba(255,255,255,0.4)' : 'rgba(255,220,130,0.8)';
    ctx.lineWidth = Math.max(3, S.band * 0.14);
    ctx.stroke(S.railPath);
    if (!abs && !full) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.8;
      drawGlow(ctx, ACCENT, g.x - g.nx * S.band * 0.5, g.y - g.ny * S.band * 0.5, 90 * s);
    }
    ctx.restore();
    const color = full ? null : S.color;
    if (abs) {
      const half = 11 * s;
      ctx.save();
      ctx.strokeStyle = full ? SH.mid : BASE[color];
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(g.x - half, g.y - half, half * 2, half * 2);
      ctx.restore();
    } else {
      paintLampMount(ctx, g, full ? 0.3 : 0.55);
      drawLampHead(ctx, g, full ? 0.3 : 0.55, color || 'red', 0, t);
    }
    if (!full) {
      // preview of the cone a new lamp would throw
      const w = clamp(tw('width'), 8, 80) * DEG / 2, L = 120 * s;
      ctx.save();
      ctx.strokeStyle = abs ? BASE[color] : U.rgba(LIGHT[color], 0.8);
      ctx.globalAlpha = 0.7;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(g.x + Math.cos(g.angle - w) * L, g.y + Math.sin(g.angle - w) * L);
      ctx.lineTo(g.x, g.y);
      ctx.lineTo(g.x + Math.cos(g.angle + w) * L, g.y + Math.sin(g.angle + w) * L);
      ctx.stroke();
      ctx.restore();
    }
  }
  // lamp hover ring
  const hl = S.hover.lamp;
  if (hl && hl !== S.selLamp) {
    ctx.save();
    ctx.strokeStyle = abs ? SH.mid : 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(hl.x, hl.y, 22 * s, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  // selected lamp: ring, cone guides, aim knob
  const l = S.selLamp;
  if (l) {
    const L = handleLen(), hw = l.width / 2;
    const hx = l.ox + Math.cos(l.angle) * L, hy = l.oy + Math.sin(l.angle) * L;
    ctx.save();
    ctx.strokeStyle = ui; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(l.x, l.y, 22 * s, 0, TAU); ctx.stroke();
    ctx.setLineDash([6, 6]); ctx.lineDashOffset = -t * 24; ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.arc(l.x, l.y, 28 * s, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.55; ctx.lineDashOffset = 0; ctx.setLineDash([4, 5]); ctx.lineWidth = 1.5;
    ctx.strokeStyle = abs ? SH.white : 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.moveTo(l.ox + Math.cos(l.angle - hw) * L * 1.3, l.oy + Math.sin(l.angle - hw) * L * 1.3);
    ctx.lineTo(l.ox, l.oy);
    ctx.lineTo(l.ox + Math.cos(l.angle + hw) * L * 1.3, l.oy + Math.sin(l.angle + hw) * L * 1.3);
    ctx.moveTo(l.ox, l.oy); ctx.lineTo(hx, hy);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    const hot = S.hover.handle || (S.drag && S.drag.kind === 'aim');
    const kr = (hot ? 11 : 9) * s;
    if (hot) { ctx.fillStyle = abs ? 'rgba(255,255,255,0.25)' : 'rgba(255,209,102,0.3)'; ctx.beginPath(); ctx.arc(hx, hy, kr * 1.8, 0, TAU); ctx.fill(); }
    ctx.fillStyle = ui;
    ctx.strokeStyle = abs ? SH.bg : '#2a1d00';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(hx, hy, kr, 0, TAU); ctx.fill(); ctx.stroke();
    // little rotate arrows on the knob
    ctx.strokeStyle = abs ? SH.bg : '#2a1d00'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(hx, hy, kr * 0.5, l.angle + 0.5, l.angle + 2.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx, hy, kr * 0.5, l.angle + 3.6, l.angle + 5.7); ctx.stroke();
    ctx.restore();
  }
}

function render(ctx, rdt) {
  if (!S.ready) return;
  const t = Kit.time, rt = Kit.realTime, abs = Kit.isAbstract;
  pollKeys(rdt);
  // wall-clock animations keep feedback alive while paused
  for (const l of S.lamps) {
    const fx = l.fx;
    const target = l.on ? 1 : 0;
    if (fx.power !== target) {
      S.floorDirty = true;
      fx.power = clamp(fx.power + (target ? rdt * 3.2 : -rdt * 5), 0, 1);
      fx.flick = target && fx.power < 1 && !abs ? (Math.random() < 0.35 ? 0.25 : 1) : 1;
    } else fx.flick = 1;
    fx.pulse = Math.max(0, fx.pulse - rdt * 2.6);
    fx.jolt = Math.max(0, fx.jolt - rdt * 5);
  }
  for (const o of S.obstacles) {
    if (o.pop < 1) { o.pop = Math.min(1, o.pop + rdt / 0.45); updateObstacle(o); if (o.pop >= 1) clampObstacle(o); S.dirty = true; }
    if (o.fx.flash > 0) o.fx.flash = Math.max(0, o.fx.flash - rdt * 3.5);
  }
  updateParticles(rdt);
  if (S.dirty) recomputeBeams();

  if (abs) {
    ctx.drawImage(bgLayer, 0, 0, Kit.W, Kit.H);
    drawBeamsShapes(ctx);
    drawObstaclesShapes(ctx);
    drawObjectFlashes(ctx);
    drawAgentsShapes(ctx);
    drawParticlesShapes(ctx);
    for (const l of S.lamps) drawLampShapes(ctx, l, 1, l.color, l.on);
  } else {
    if (S.floorDirty) paintLitFloor();
    ctx.drawImage(floorLayer, 0, 0, Kit.W, Kit.H);
    drawObjectFlashes(ctx);
    if (tw('dust')) drawMotes(ctx, rt);
    drawMothsSprite(ctx);
    drawParticlesSprite(ctx);
    for (const l of S.lamps) drawLampHead(ctx, l, 1, l.color, lampVis(l), rt);
  }
  drawOverlays(ctx, rt);
}

// ================================================================== simulation entry points
function update(dt, t) {
  if (!S.ready) return;
  if (S.dirty) recomputeBeams();
  updateMoths(dt, t);
  updateMotes(dt, t);
}

function updateCounts() {
  const n = S.lamps.length;
  Kit.setStat('lamps', `${n}/${MAX_LAMPS}`, { neutral: true });
  if (S.ui.readout) S.ui.readout.textContent = `${Kit.pick('Lamps', 'Lights')} ${n}/${MAX_LAMPS}`;
  if (S.ui.addLampBtn) S.ui.addLampBtn.disabled = n >= MAX_LAMPS;
  if (S.ui.clearBtn) S.ui.clearBtn.disabled = n === 0;
  S.litCount = S.moths.filter((m) => m.target).length;
  Kit.setStat('lit', `${S.litCount}/${S.moths.length}`, { neutral: true });
}

function refreshHint() {
  if (S.selLamp) Kit.setHint('Drag the knob or press ← → to aim. ↑ ↓ width, O on or off.');
  else if (S.selObj) Kit.setHint('Drag to move it. Wheel or Q E rotates. Delete removes it.');
  else Kit.setHint(null);
}

/** Default scene: a red lamp on the left, a blue one top-right, one moth drifting in the dark middle. */
function buildDefaultScene() {
  const R = S.room;
  S.lamps = []; S.obstacles = []; S.moths = [];
  S.selLamp = null; S.selObj = null; S.drag = null;
  partN = 0;
  for (const [kind, cx, cy, size, rot, glass] of DEFAULT_OBJECTS) {
    const o = makeObstacle(kind, cx, cy, size, rot * DEG, glass);
    clampObstacle(o);
    S.obstacles.push(o);
  }
  addLampAt(R.x, R.y + R.h * 0.52, 'red', { silent: true });
  addLampAt(R.x + R.w * 0.8, R.y, 'blue', { silent: true, aimAt: { x: R.x + R.w * 0.42, y: R.y + R.h * 0.64 } });
  recomputeBeams();
  // the hero moth starts in a dark patch near the middle, heading for the nearest beam
  const cx = R.x + R.w * 0.5, cy = R.y + R.h * 0.5, s = S.scale;
  let start = { x: cx, y: cy, a: rand(0, TAU) }, found = false;
  for (let rr = 0; rr <= 200 * s && !found; rr += 25 * s) {
    for (let i = 0; i < 16 && !found; i++) {
      const a = (i / 16) * TAU, x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      if (isLitPoint(x, y) || S.obstacles.some((o) => U.dist(x, y, o.bx, o.by) < o.br + 20 * s)) continue;
      for (let j = 0; j < 24; j++) {
        const b = (j / 24) * TAU, d = 110 * s;
        if (isLitPoint(x + Math.cos(b) * d, y + Math.sin(b) * d)) { start = { x, y, a: b }; found = true; break; }
      }
    }
  }
  const hero = makeMoth(start.x, start.y, 1);
  hero.size = 1.08;
  hero.h = hero.wh = start.a;
  hero.p1 = -Kit.time * 0.53; hero.p2 = -Kit.time * 1.37;
  hero.vx = Math.cos(start.a) * 40 * s; hero.vy = Math.sin(start.a) * 40 * s;
  S.moths.push(hero);
  S.ready = true;
  setCreatureCount(tw('count'));
  updateCounts();
  refreshHint();
}

// ================================================================== UI wiring

  const gColor = Kit.ui.group({ sprite: 'Lamp color', abstract: 'Light color' });

    });

  const gLamps = Kit.ui.group(null);
  S.ui.readout = Kit.ui.readout(gLamps);
  S.ui.addLampBtn = Kit.ui.button({ parent: gLamps, icon: 'plus', iconOnly: true, key: 'L', tip: { sprite: 'Hang a lamp in a free spot', abstract: 'Add a light in a free spot' }, onClick: () => addLampFree() });
  S.ui.clearBtn = Kit.ui.button({ parent: gLamps, icon: 'trash', iconOnly: true, tip: { sprite: 'Take down all lamps', abstract: 'Remove all lights' }, onClick: clearLamps });
  const gObj = Kit.ui.group('Add object');

    square: { sprite: 'Add a wooden block', abstract: 'Add a square' },
    triangle: { sprite: 'Add a wooden wedge', abstract: 'Add a triangle' },
    circle: { sprite: 'Add a round stone', abstract: 'Add a circle' },
    bar: { sprite: 'Add a plank', abstract: 'Add a bar' },
  };
  ['square', 'triangle', 'circle', 'bar'].forEach((k, i) => {
    Kit.ui.button({ parent: gObj, icon: k, iconOnly: true, key: String(4 + i), tip: objTips[k], onClick: () => addObject(k) });
  });
  S.ui.glassBtn = Kit.ui.button({
    parent: gObj, icon: GLASS_ICON, iconOnly: true, key: '8',
    tip: { sprite: 'Add colored glass: only its own color shines through', abstract: 'Add a colored object: only its own color passes' },
    onClick: () => addObject('glass'),
  });
  setColor(S.color, false);
}

function viewChanged() {
  buildBackground();
  updateCounts();
}

    { type: 'range', id: 'width', label: 'Beam width', min: 8, max: 80, step: 1, value: DEFAULTS.width, format: (v) => v + '°', onInput: (v) => { if (S.selLamp) setWidth(S.selLamp, v * DEG); }, note: { sprite: 'For new lamps and the selected one.', abstract: 'For new lights and the selected one.' } },
    { type: 'toggle', id: 'edges', label: 'Show beam edges', value: DEFAULTS.edges },

});

// ================================================================== test API
window.__toy = {
  get lamps() { return S.lamps; },
  get creatures() { return S.moths; },
  get obstacles() { return S.obstacles; },
  get room() { return Object.assign({}, S.room); },
  get frameBand() { return S.band; },
  addLamp: (x, y, color) => addLampAt(x, y, color || S.color),
  removeLamp,
  litBy: (c) => (c && c.target) || null,
  isLitPoint,
  setCreatureCount: (n) => Kit.setTweak('count', clamp(Math.round(n), 1, MAX_MOTHS)),
  // extras for tests and debugging
  get selectedLamp() { return S.selLamp; },
  get selectedObject() { return S.selObj; },
  get color() { return S.color; },
  setColor: (c) => setColor(c, true),
  selectLamp: (l) => selectLamp(l),
  addObject: (type, x, y) => addObject(type, x != null ? { x, y } : null),
  removeObstacle,
  beamPolygon: (l) => l.fx.poly.slice(),
  refresh: () => { for (const l of S.lamps) placeLamp(l); for (const o of S.obstacles) updateObstacle(o); recomputeBeams(); },
  railPoint: (s) => Object.assign({}, railAt(s)),
  get railLength() { return S.railLen; },
};

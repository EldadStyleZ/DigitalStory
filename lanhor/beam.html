<script>
'use strict';
/* Toy 01 — Beam (Sprites: Moths & Lamps).
 * Up to five lamps in six colors hang on the frame. Each beam is a visibility polygon, blocked by
 * objects (glass passes its own color). Mirrors bounce it on: each reflected piece is a beam from the
 * lamp's mirror image, starting at the lit part of the mirror. Light adds up where beams overlap; a moth
 * that any beam reaches flies to the brightest band of light in the room and roams inside it.
 */

// ================================================================== config
const U = Kit.util;
const { TAU, clamp, lerp, rand, angleDiff } = U;
const DEG = Math.PI / 180;

const MAX_LAMPS = 5;
const MAX_OBJECTS = 16;
const MAX_MOTHS = 40;
const COLORS = ['red', 'orange', 'yellow', 'green', 'blue', 'purple'];
const NC = COLORS.length;
const CI = Object.fromEntries(COLORS.map((c, i) => [c, i]));   // color → index (its bit in a light mask)
// swatches + Shapes view: the Apple system palette
const BASE = { red: '#ff3b30', orange: '#ff9500', yellow: '#ffd60a', green: '#34c759', blue: '#0a84ff', purple: '#af52de' };
// sprite light: saturated versions that still mix cleanly when added
const LIGHT = { red: '#ff3a1e', orange: '#ff8a1a', yellow: '#ffd21e', green: '#36e64a', blue: '#2466ff', purple: '#a33dff' };
const NAME = { red: 'Red', orange: 'Orange', yellow: 'Yellow', green: 'Green', blue: 'Blue', purple: 'Purple' };
const pitchOf = (c) => 0.84 + CI[c] * 0.07;   // each color has its own note
const SH = { bg: '#0d0d10', dark: '#1c1c22', band: '#2c2c34', obj: '#5a5a66', mid: '#9a9aa6', white: '#ffffff' };
const SHAPE_INK = new Set([...Object.values(BASE), SH.white]);   // particle colors Shapes keeps; others turn gray
const ACCENT = '#ffd166';
const AIM_LIMIT = 80 * DEG;
const WIDTH_MIN = 8 * DEG, WIDTH_MAX = 80 * DEG;
const RAY_STEP = 1.5 * DEG;
const EPS_ANG = 1e-4;
const NEEDLE_PX = 2;          // light gaps narrower than this even at their far end are closed
const FALLOFF = 0.35;         // a beam is worth 1 at its lamp and 0.65 from `reach` on, so two beams always beat one
const BAND = 0.85;            // the brightest band: light within this fraction of the strongest
const BEAT = 1.25;            // a band this much stronger pulls committed moths away from theirs
// A band too small for the moths roaming in it (or for one moth to travel, not hover) grows into the
// brightest light around it, down to GROW_FLOOR of its peak, so a swarm never jams into a frozen ball
const BAND_MIN_CELLS = 6;
const CELLS_PER_MOTH = 0.9;
const GROW_FLOOR = 0.55;      // two-beam light (≥ 1.3) still counts round a triple overlap
const GROW_RINGS = 4;         // and it stays within this many cells of the band, never snaking along a beam
const DARK_GRACE = 1.5;       // s a moth keeps flying through shadow before it is lost
const TRAIL = 14;
const MOTH_WS = 62;           // moth wingspan (px at scale 1)
const MAX_REFLECTIONS = 32;   // reflected beam pieces, all lamps together (5 lamps × many mirrors stays bounded)
const MIRROR_FACES = [0, 2];  // the two long faces of a mirror (edges 0→1 and 2→3): both reflect; its thin ends do not
const DEFAULTS = { count: 1, speed: 1, pull: 1, roam: 1, reach: 500, width: 28, edges: false, dust: true, bounces: 3, mirrorK: 0.85 };
const tw = (id) => (Kit.tweaks[id] !== undefined ? Kit.tweaks[id] : DEFAULTS[id]);

const ngon = (n, r, a0) => Array.from({ length: n }, (_, i) => ({ x: Math.cos(a0 + (i * TAU) / n) * r, y: Math.sin(a0 + (i * TAU) / n) * r }));
const box = (hx, hy) => [{ x: -hx, y: -hy }, { x: hx, y: -hy }, { x: hx, y: hy }, { x: -hx, y: hy }];
const KINDS = {
  square: { verts: box(0.8, 0.8), mat: 'wood' },
  rect: { verts: box(1.15, 0.62), mat: 'wood' },
  bar: { verts: box(1.6, 0.27), mat: 'wood' },
  triangle: { verts: ngon(3, 1.08, -Math.PI / 2), mat: 'wood' },
  hex: { verts: ngon(6, 1, 0), mat: 'stone' },
  circle: { verts: ngon(16, 0.95, 0), mat: 'stone' },
  mirror: { verts: box(1.6, 0.065), mat: 'mirror' },   // a plank's length, about a fifth of its thickness
};
for (const k of Object.values(KINDS)) k.rmax = Math.max(...k.verts.map((v) => Math.hypot(v.x, v.y)));
// kind, cx, cy (room fractions), size (fraction of the room's short side), rotation (deg), glass color.
// A loose ring around the open middle, where the red and the blue beam cross.
const DEFAULT_OBJECTS = [
  ['hex', 0.27, 0.26, 0.075, 8, null],
  ['circle', 0.42, 0.13, 0.06, 0, null],
  ['rect', 0.555, 0.25, 0.058, 20, 'blue'],    // in the blue beam: blue shines through
  ['triangle', 0.75, 0.3, 0.078, 12, null],
  ['bar', 0.82, 0.66, 0.075, 78, null],
  ['square', 0.67, 0.6, 0.058, -14, 'green'],  // in the red beam past the overlap: casts a red shadow
  // in the blue beam below the overlap: bounces it left along the floor into the dark corner, clear of
  // the overlap and of the red beam (with the blue lamp off the red beam is a plain single beam again)
  ['mirror', 0.33, 0.9, 0.075, 156, null],
  ['triangle', 0.21, 0.67, 0.07, -24, 'red'],  // in the red beam: red shines through
  ['circle', 0.12, 0.17, 0.045, 0, null],
];
const OBJECT_KEYS = [['7', 'square'], ['8', 'triangle'], ['9', 'circle'], ['0', 'bar'], ['G', 'glass']];   // keys 1–6 pick colors
const OBJECT_OF_KEY = Object.fromEntries(OBJECT_KEYS);
const NEW_OBJECT = {
  square: { kind: 'square', size: 0.06 },
  triangle: { kind: 'triangle', size: 0.068 },
  circle: { kind: 'circle', size: 0.06 },
  bar: { kind: 'bar', size: 0.07 },
  glass: { kind: 'rect', size: 0.06 },
  mirror: { kind: 'mirror', size: 0.07 },
};
const isMirror = (o) => o.kind === 'mirror';
const MOTH_LOOKS = [
  { fore: '#d3b285', foreDark: '#7d5c3a', band: '#a47b50', hind: '#e6c497', hindTint: '#eaa47e', body: '#a98257', bodyDark: '#5a4029', head: '#6b4c31', spot: '#3e2a1a', fur: '#e2c9a0' }, // tan
  { fore: '#f390b4', foreDark: '#b9557e', band: '#f8dc78', hind: '#fdeeb5', hindTint: '#f7b9cd', body: '#f6d86f', bodyDark: '#c49a32', head: '#e9b94c', spot: '#a8406b', fur: '#fff3b8' }, // rosy maple
  { fore: '#c4c1d2', foreDark: '#686479', band: '#9894ad', hind: '#e2dfeb', hindTint: '#cfc6e2', body: '#a19bb4', bodyDark: '#565169', head: '#5f5a72', spot: '#37344a', fur: '#ebe8f3' }, // silver
];

// ================================================================== state
const S = {
  ready: false,
  scale: 1, band: 30, rc: 39, minDim: 600,
  room: { x: 0, y: 0, w: 1, h: 1 },
  rail: [], railLen: 1, roomPath: null, outsidePath: null, railPath: null, roomCorners: [],
  lamps: [], obstacles: [], moths: [], motes: [],
  pieces: [],          // every lit beam piece: each lamp's direct beam, then its reflections (breadth first)
  pieceByKey: new Map(), mirrorHits: [],   // reflected pieces by their path of faces (kept while unchanged); where light meets a mirror
  color: 'red',
  selLamp: null, selObj: null,
  hover: { lamp: null, obj: null, handle: false, turn: false, frame: false },   // handle: a lamp's aim knob; turn: a mirror's knob
  ghost: { x: 0, y: 0, nx: 0, ny: 1, angle: 0, on: false, id: 0, fx: { pulse: 0 } },   // doubles as a lamp for drawing
  drag: null,
  dirty: true,
  mapDirty: true,     // the light map is behind the beams
  floorDirty: true,
  obsRev: 0,          // bumped whenever object geometry or the room changes
  basePieces: new Set(), baseValid: false, baseAt: -9,
  floorWasDirty: false, floorStale: false,
  nextId: 1,
  lampPlacedAt: -9,
  litToastShown: false, overlapToastShown: false, mirrorToastShown: false,
  litCount: 0, level: -1, levelNext: -1, levelT: 0,   // level: beams making the light the swarm roams in
  cursor: '',
  ui: {},
  counts: { beams: 0, maps: 0 },   // how often the beams and the light map were rebuilt (test API)
};
const hash = new Kit.SpatialHash(48);
const railOut = { x: 0, y: 0, nx: 0, ny: 1 };
const keyHold = new Map();
const angBuf = [], tBuf = [], hoBuf = [], hfBuf = [], tsBuf = [], eBuf = [];
let polyBuf = [];
const copyInto = (dst, src) => { dst.length = src.length; for (let i = 0; i < src.length; i++) dst[i] = src[i]; };
const byNumber = (a, b) => a - b;
const reachPx = () => tw('reach') * S.scale;
const handleLen = () => clamp(72 * S.scale, 58, 110);

// ================================================================== geometry: room, rail, paths
function pathRoundRect(p, x, y, w, h, r) {
  const rr = Math.max(0, Math.min(r, w / 2, h / 2));
  p.moveTo(x + rr, y);
  p.arcTo(x + w, y, x + w, y + h, rr);
  p.arcTo(x + w, y + h, x, y + h, rr);
  p.arcTo(x, y + h, x, y, rr);
  p.arcTo(x, y, x + w, y, rr);
  p.closePath();
}

/** The lamp rail follows the room's inner edge: four straights joined by quarter arcs. */
function buildRail() {
  const { x, y, w, h } = S.room, r = S.rc, q = (Math.PI / 2) * r;
  const P = [];
  let len = 0;
  const add = (p) => { p.s0 = len; len += p.len; P.push(p); };
  add({ arc: false, ax: x + r, ay: y, bx: x + w - r, by: y, nx: 0, ny: 1, len: w - 2 * r });
  add({ arc: true, cx: x + w - r, cy: y + r, a0: -Math.PI / 2, len: q });
  add({ arc: false, ax: x + w, ay: y + r, bx: x + w, by: y + h - r, nx: -1, ny: 0, len: h - 2 * r });
  add({ arc: true, cx: x + w - r, cy: y + h - r, a0: 0, len: q });
  add({ arc: false, ax: x + w - r, ay: y + h, bx: x + r, by: y + h, nx: 0, ny: -1, len: w - 2 * r });
  add({ arc: true, cx: x + r, cy: y + h - r, a0: Math.PI / 2, len: q });
  add({ arc: false, ax: x, ay: y + h - r, bx: x, by: y + r, nx: 1, ny: 0, len: h - 2 * r });
  add({ arc: true, cx: x + r, cy: y + r, a0: Math.PI, len: q });
  S.rail = P;
  S.railLen = len;
}

/** Point + inward normal at rail distance s. */
function railAt(s, out = railOut) {
  const L = S.railLen;
  s = ((s % L) + L) % L;
  let p = S.rail[S.rail.length - 1];
  for (let i = 0; i < S.rail.length; i++) if (s <= S.rail[i].s0 + S.rail[i].len) { p = S.rail[i]; break; }
  const k = s - p.s0;
  if (!p.arc) {
    const t = p.len > 0 ? k / p.len : 0;
    out.x = p.ax + (p.bx - p.ax) * t; out.y = p.ay + (p.by - p.ay) * t;
    out.nx = p.nx; out.ny = p.ny;
  } else {
    const a = p.a0 + k / S.rc, c = Math.cos(a), sn = Math.sin(a);
    out.x = p.cx + c * S.rc; out.y = p.cy + sn * S.rc;
    out.nx = -c; out.ny = -sn;
  }
  return out;
}

/** Rail distance of the rail point nearest to (px, py). */
function railNearest(px, py) {
  let best = Infinity, bs = 0;
  for (const p of S.rail) {
    let qx, qy, s;
    if (!p.arc) {
      const ex = p.bx - p.ax, ey = p.by - p.ay;
      const t = p.len > 0 ? clamp(((px - p.ax) * ex + (py - p.ay) * ey) / (p.len * p.len), 0, 1) : 0;
      qx = p.ax + ex * t; qy = p.ay + ey * t; s = p.s0 + t * p.len;
    } else {
      let a = (((Math.atan2(py - p.cy, px - p.cx) - p.a0) % TAU) + TAU) % TAU;
      if (a > Math.PI / 2) a = a > Math.PI * 1.25 ? 0 : Math.PI / 2;
      qx = p.cx + Math.cos(p.a0 + a) * S.rc; qy = p.cy + Math.sin(p.a0 + a) * S.rc;
      s = p.s0 + a * S.rc;
    }
    const d = (qx - px) * (qx - px) + (qy - py) * (qy - py);
    if (d < best) { best = d; bs = s; }
  }
  return bs;
}

function inRoomRect(x, y) {
  const R = S.room;
  return x >= R.x && x <= R.x + R.w && y >= R.y && y <= R.y + R.h;
}

/** Point inside the rounded room shrunk by m. */
function inRoom(x, y, m = 0) {
  const R = S.room, rr = Math.max(0, S.rc - m);
  const x0 = R.x + m, x1 = R.x + R.w - m, y0 = R.y + m, y1 = R.y + R.h - m;
  if (x < x0 || x > x1 || y < y0 || y > y1) return false;
  const cx = clamp(x, x0 + rr, x1 - rr), cy = clamp(y, y0 + rr, y1 - rr);
  return (x - cx) * (x - cx) + (y - cy) * (y - cy) <= rr * rr;
}

/** Keep a circle (radius m) inside the rounded room; reflects velocity on contact. */
function keepInRoom(b, m) {
  const R = S.room, rr = Math.max(0, S.rc - m);
  const x0 = R.x + m, x1 = R.x + R.w - m, y0 = R.y + m, y1 = R.y + R.h - m;
  if (b.x < x0) { b.x = x0; if (b.vx < 0) b.vx *= -0.6; }
  if (b.x > x1) { b.x = x1; if (b.vx > 0) b.vx *= -0.6; }
  if (b.y < y0) { b.y = y0; if (b.vy < 0) b.vy *= -0.6; }
  if (b.y > y1) { b.y = y1; if (b.vy > 0) b.vy *= -0.6; }
  const cx = clamp(b.x, x0 + rr, x1 - rr), cy = clamp(b.y, y0 + rr, y1 - rr);
  const dx = b.x - cx, dy = b.y - cy, d = Math.hypot(dx, dy);
  if (d > rr && d > 0) {
    const nx = dx / d, ny = dy / d;
    b.x = cx + nx * rr; b.y = cy + ny * rr;
    const vn = b.vx * nx + b.vy * ny;
    if (vn > 0) { b.vx -= 1.6 * vn * nx; b.vy -= 1.6 * vn * ny; }
  }
}

function inFrame(x, y) {
  const pr = Kit.playRect;
  if (x < pr.x || x > pr.x + pr.w || y < pr.y || y > pr.y + pr.h) return false;
  return !inRoom(x, y, 5);
}

function layout() {
  const pr = Kit.playRect;
  const prev = S.room.w > 1 ? Object.assign({}, S.room) : null;
  S.scale = clamp(Math.sqrt(pr.w * pr.h) / 1010, 0.7, 1.7);
  S.band = clamp(Math.round(30 * S.scale), 26, 34);
  const b = S.band;
  S.room = { x: pr.x + b, y: pr.y + b, w: Math.max(60, pr.w - 2 * b), h: Math.max(60, pr.h - 2 * b) };
  const R = S.room;
  S.minDim = Math.min(R.w, R.h);
  S.rc = Math.round(Math.min(b * 1.3, S.minDim / 4));
  S.roomCorners = [R.x, R.y, R.x + R.w, R.y, R.x + R.w, R.y + R.h, R.x, R.y + R.h];
  buildRail();
  S.obsRev++;
  S.roomPath = new Path2D(); pathRoundRect(S.roomPath, R.x, R.y, R.w, R.h, S.rc);
  S.outsidePath = new Path2D(); S.outsidePath.rect(0, 0, Kit.W, Kit.H); S.outsidePath.addPath(S.roomPath);
  S.railPath = new Path2D(); pathRoundRect(S.railPath, R.x - b / 2, R.y - b / 2, R.w + b, R.h + b, S.rc + b / 2);
  for (const l of S.lamps) placeLamp(l);
  for (const o of S.obstacles) { updateObstacle(o); clampObstacle(o); }
  if (prev) {
    const remap = (p) => { p.x = R.x + ((p.x - prev.x) / prev.w) * R.w; p.y = R.y + ((p.y - prev.y) / prev.h) * R.h; };
    for (const m of S.moths) {
      remap(m);
      if (m.dest) remap(m.dest);
      m.fx.tn = 0;
    }
  }
  const moteN = clamp(Math.round((R.w * R.h) / 6500), 60, 240);
  if (S.motes.length !== moteN) makeMotes(moteN);
  buildMothSprites();
  buildLampSprites();
  buildBackground();
  S.dirty = true;
}

// ================================================================== world: obstacles
function popScale(o) { return o.pop >= 1 ? 1 : Math.max(0.02, U.easeOutBack(o.pop)); }
/** Bounding radius of an object once its pop-in has settled. */
const fullRadius = (kind, size) => size * S.minDim * KINDS[kind].rmax;

function makeObstacle(kind, cx, cy, size, rot, glass) {
  const def = KINDS[kind];
  const rnd = U.mulberry32(S.nextId * 7919 + 13);
  const o = {
    id: S.nextId++, kind, glass: glass || null, mat: glass ? 'glass' : def.mat,
    cx, cy, size, rot, pop: 1,
    points: def.verts.map(() => ({ x: 0, y: 0 })),
    bx: 0, by: 0, br: 0, r: 0, glow: 0,
  };
  // render-only data stays non-enumerable so the test API serialises cleanly
  Object.defineProperty(o, 'fx', {
    value: {
      edgeLit: new Float32Array(def.verts.length * NC),   // per edge, light of each color on it
      specks: Array.from({ length: 16 }, () => ({ x: rnd() * 1.6 - 0.8, y: rnd() * 1.6 - 0.8, r: 0.03 + rnd() * 0.06, light: rnd() < 0.5 })),
      grain: rnd() * 10,
      flash: 0,
    },
    enumerable: false,
  });
  updateObstacle(o);
  return o;
}

function updateObstacle(o) {
  S.obsRev++;
  const R = S.room, verts = KINDS[o.kind].verts;
  const r = o.size * S.minDim * popScale(o);
  const c = Math.cos(o.rot), s = Math.sin(o.rot);
  const X = R.x + o.cx * R.w, Y = R.y + o.cy * R.h;
  let br = 0;
  for (let i = 0; i < verts.length; i++) {
    const v = verts[i], px = (v.x * c - v.y * s) * r, py = (v.x * s + v.y * c) * r;
    o.points[i].x = X + px; o.points[i].y = Y + py;
    br = Math.max(br, Math.hypot(px, py));
  }
  o.bx = X; o.by = Y; o.br = br; o.r = r;
}

/** Shift an obstacle so it stays fully inside the room, clear of the frame. */
function clampObstacle(o) {
  const R = S.room, m = 10;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of o.points) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
  let dx = 0, dy = 0;
  if (x0 < R.x + m) dx = R.x + m - x0; else if (x1 > R.x + R.w - m) dx = R.x + R.w - m - x1;
  if (y0 < R.y + m) dy = R.y + m - y0; else if (y1 > R.y + R.h - m) dy = R.y + R.h - m - y1;
  if (dx || dy) { o.cx += dx / R.w; o.cy += dy / R.h; updateObstacle(o); }
}

/** Nearest spot to (x, y) where a new object of bounding radius r clears every other object
 *  (judged at full size, so objects still popping in count); else the spot with the most room. */
function findFreeSpot(x, y, r) {
  let best = null, bestGap = -Infinity;
  for (let ring = 0; ring < 14; ring++) {
    const n = ring === 0 ? 1 : 10;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + ring * 0.7, d = ring * r * 0.9;
      const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d;
      if (!inRoom(px, py, r + 14)) continue;
      let gap = Infinity;
      for (const o of S.obstacles) gap = Math.min(gap, U.dist(px, py, o.bx, o.by) - fullRadius(o.kind, o.size) - r);
      if (gap >= 8) return { x: px, y: py };
      if (gap > bestGap) { bestGap = gap; best = { x: px, y: py }; }
    }
  }
  return best || { x, y };
}

function addObject(type, at) {
  if (S.obstacles.length >= MAX_OBJECTS) {
    Kit.sfx('buzz');
    Kit.toast('Sixteen objects max — remove one first', { tone: 'bad' });
    return null;
  }
  const spec = NEW_OBJECT[type] || NEW_OBJECT.square;
  const R = S.room, r = spec.size * S.minDim;
  let x = R.x + R.w / 2, y = R.y + R.h / 2;
  if (at) { x = at.x; y = at.y; } else if (Kit.mouse.inside && inRoom(Kit.mouse.x, Kit.mouse.y, 30)) { x = Kit.mouse.x; y = Kit.mouse.y; }
  const spot = findFreeSpot(x, y, fullRadius(spec.kind, spec.size));
  const o = makeObstacle(spec.kind, (spot.x - R.x) / R.w, (spot.y - R.y) / R.h, spec.size, rand(-0.4, 0.4), type === 'glass' ? S.color : null);
  o.pop = 0;
  updateObstacle(o);
  S.obstacles.push(o);
  selectObj(o);
  burst(o.bx, o.by, o.glass ? BASE[o.glass] : '#ffffff', 12, 160);
  ring(o.bx, o.by, o.glass ? BASE[o.glass] : '#ffffff', r * 2.2);
  Kit.sfx('pop', { pitch: isMirror(o) ? 1.3 : rand(0.9, 1.1) });
  if (isMirror(o) && !S.mirrorToastShown) {
    S.mirrorToastShown = true;
    Kit.toast('A mirror bounces the light. Turn it by its knob or the wheel.', { tone: 'info', ms: 2600 });
  }
  S.dirty = true;
  return o;
}

/** Face j→j+1 of a mirror: its line (a point on it) and its outward unit normal. */
const faceOut = { ax: 0, ay: 0, bx: 0, by: 0, nx: 0, ny: 0 };
function mirrorFace(o, j, out = faceOut) {
  const a = o.points[j], b = o.points[(j + 1) % o.points.length];
  let nx = b.y - a.y, ny = a.x - b.x;
  const nl = Math.hypot(nx, ny) || 1;
  nx /= nl; ny /= nl;
  if (nx * ((a.x + b.x) / 2 - o.bx) + ny * ((a.y + b.y) / 2 - o.by) < 0) { nx = -nx; ny = -ny; }
  out.ax = a.x; out.ay = a.y; out.bx = b.x; out.by = b.y; out.nx = nx; out.ny = ny;
  return out;
}

/** The turn knob of a selected mirror: on its axis just past one end (the +end, unless only the other end's
 *  knob stays in the room). `end` (±1) pins the end, so a knob being dragged never jumps to the other one. */
const knobOut = { x: 0, y: 0, end: 1 };
function mirrorKnob(o, end, out = knobOut) {
  const d = 1.6 * o.r + clamp(26 * S.scale, 22, 40), c = Math.cos(o.rot), s = Math.sin(o.rot);
  if (!end) end = inRoom(o.bx + c * d, o.by + s * d, 12) || !inRoom(o.bx - c * d, o.by - s * d, 12) ? 1 : -1;
  out.x = o.bx + c * d * end; out.y = o.by + s * d * end; out.end = end;
  return out;
}
const knobHitR = () => Math.max(14, 13 * S.scale);

/** Pointer over an object; a mirror is thin, so it also counts within a few pixels of it. */
function overObject(o, x, y) {
  if (U.dist(x, y, o.bx, o.by) > o.br + 12) return false;
  if (U.pointInPoly(x, y, o.points)) return true;
  if (!isMirror(o)) return false;
  const ux = Math.cos(o.rot), uy = Math.sin(o.rot), dx = x - o.bx, dy = y - o.by;
  const along = Math.abs(dx * ux + dy * uy), across = Math.abs(-dx * uy + dy * ux);
  return along <= 1.6 * o.r + 4 && across <= 0.065 * o.r + Math.max(9, 8 * S.scale);
}

function removeObstacle(o) {
  const i = S.obstacles.indexOf(o);
  if (i < 0) return;
  S.obstacles.splice(i, 1);
  S.obsRev++;
  if (S.selObj === o) S.selObj = null;
  if (S.hover.obj === o) S.hover.obj = null;
  if (S.drag && S.drag.obj === o) S.drag = null;
  poof(o.bx, o.by, o.r, o.glass ? BASE[o.glass] : '#b9b2c9');
  Kit.sfx('remove', { pitch: 0.9 });
  S.dirty = true;
  refreshHint();
}

function rotateObstacle(o, da) {
  o.rot += da;
  updateObstacle(o); clampObstacle(o);
  S.dirty = true;
  Kit.sfx('click', { gap: 70, vol: 0.35, pitch: 0.8 + (((o.rot % TAU) + TAU) % TAU) / TAU * 0.6 });
}

function moveObstacleTo(o, x, y) {
  const R = S.room;
  o.cx = (x - R.x) / R.w; o.cy = (y - R.y) / R.h;
  updateObstacle(o); clampObstacle(o);
  S.dirty = true;
}

const blocks = (o, color) => o.glass !== color;

// ================================================================== lamps
function makeLamp(s, color) {
  const l = {
    id: S.nextId++, color, on: true,
    u: s / S.railLen, aim: 0, width: clamp(tw('width') * DEG, WIDTH_MIN, WIDTH_MAX), widthDeg: 0,
    x: 0, y: 0, nx: 0, ny: 1, ox: 0, oy: 0, angle: 0,
  };
  Object.defineProperty(l, 'fx', {
    value: {
      inKey: [0, 0, 0, 0, '', -1],                 // inputs of the last computeBeam
      poly: [], polyColor: '', path: null, far: 40, grad: null, gradKey: '', power: 1, pulse: 0, flick: 1,
      piece: null,                                 // its direct beam as a beam piece
    },
    enumerable: false,
  });
  l.fx.piece = makePiece(l, 0, 'L' + l.id);
  placeLamp(l);
  return l;
}

/** A beam piece: a lamp's direct beam (depth 0) or one of its reflections. Light in it comes from
 *  (sx, sy): the lamp, or its mirror image across every mirror on the way, so distance from there is
 *  the length of the whole path. A reflection starts on the lit stretch of the mirror face it leaves. */
function makePiece(lamp, depth, key) {
  return {
    lamp, depth, key, color: lamp.color, k: 1,   // k: strength factor (Mirror strength per bounce)
    sx: 0, sy: 0, c: 0, hw: 0,                   // source, and the window of its rays (center, half width)
    mirror: null, ax: 0, ay: 0, nx: 0, ny: 0,    // reflections: the mirror it leaves, a point on that face, its outward normal
    ang: [], t: [], ho: [], hf: [],              // rays: relative angle, length, the mirror and face each one ends on
    poly: [], path: null, pathColor: '', pathAt: Kit.realTime, far: 40, grad: null, gradKey: '',   // pathAt: when its polygon last changed
    x0: 0, y0: 0, x1: 0, y1: 0,                  // bounding box of the polygon
    painted: { path: null, vis: -1, key: '' },   // what the sprite floor currently shows for this piece
  };
}

/** Recompute the lamp's world position, origin and absolute aim from its rail position and offsets. */
function placeLamp(l) {
  const p = railAt(l.u * S.railLen);
  l.x = p.x; l.y = p.y; l.nx = p.nx; l.ny = p.ny;
  l.ox = p.x + p.nx * 1.5; l.oy = p.y + p.ny * 1.5;
  l.angle = Math.atan2(p.ny, p.nx) + l.aim;
  l.widthDeg = Math.round((l.width / DEG) * 10) / 10;
  S.dirty = true;
}

function setAim(l, a) {
  const na = clamp(a, -AIM_LIMIT, AIM_LIMIT);
  if (na === l.aim) return;
  l.aim = na; placeLamp(l);
  Kit.sfx('click', { gap: 60, vol: 0.28, pitch: 1 + l.aim * 0.35 });
}

function setWidth(l, w) {
  const nw = clamp(w, WIDTH_MIN, WIDTH_MAX);
  if (nw === l.width) return;
  l.width = nw; placeLamp(l);
  Kit.sfx('click', { gap: 60, vol: 0.28, pitch: 0.7 + (nw / WIDTH_MAX) * 0.8 });
}

function addLampAt(x, y, color, opts = {}) {
  if (S.lamps.length >= MAX_LAMPS) {
    Kit.sfx('buzz');
    Kit.toast(Kit.pick('Five lamps max — remove one first', 'Five lights max — remove one first'), { tone: 'bad' });
    return null;
  }
  const l = makeLamp(railNearest(x, y), COLORS.includes(color) ? color : S.color);
  if (opts.aimAt) l.aim = clamp(angleDiff(Math.atan2(l.ny, l.nx), Math.atan2(opts.aimAt.y - l.oy, opts.aimAt.x - l.ox)), -AIM_LIMIT, AIM_LIMIT);
  placeLamp(l);
  S.lamps.push(l);
  if (!opts.silent) {
    l.fx.pulse = 1; l.fx.power = 0;
    ring(l.x, l.y, BASE[l.color], 60 * S.scale);
    burst(l.x + l.nx * 8, l.y + l.ny * 8, BASE[l.color], 10, 140);
    Kit.sfx('place', { pitch: pitchOf(l.color) });
    selectLamp(l);
    S.lampPlacedAt = Kit.realTime;
  }
  S.dirty = true;
  updateCounts();
  return l;
}

/** Place a lamp in the biggest free stretch of the rail. */
function addLampFree() {
  if (S.lamps.length >= MAX_LAMPS) return addLampAt(0, 0, S.color);
  const L = S.railLen;
  let best = 0, bestD = -1;
  for (let i = 0; i < 96; i++) {
    const s = (i / 96) * L;
    let d = L;
    for (const l of S.lamps) { const ds = Math.abs(s - l.u * L); d = Math.min(d, ds, L - ds); }
    // prefer the middle of the long sides over corners
    const p = railAt(s);
    const corner = p.nx !== 0 && p.ny !== 0 && Math.abs(p.nx) !== 1 && Math.abs(p.ny) !== 1 ? 0.6 : 1;
    if (d * corner > bestD) { bestD = d * corner; best = s; }
  }
  const p = railAt(best);
  return addLampAt(p.x, p.y, S.color);
}

function removeLamp(l) {
  const i = S.lamps.indexOf(l);
  if (i < 0) return;
  S.lamps.splice(i, 1);
  if (S.selLamp === l) S.selLamp = null;
  if (S.hover.lamp === l) S.hover.lamp = null;
  if (S.drag && S.drag.lamp === l) S.drag = null;
  poof(l.x, l.y, 16 * S.scale, BASE[l.color]);
  Kit.sfx('remove');
  S.dirty = true;
  updateCounts();
  refreshHint();
}

function clearLamps() {
  if (!S.lamps.length) return;
  for (const l of S.lamps.slice()) removeLamp(l);
  Kit.sfx('whoosh', { pitch: 0.7 });
}

function toggleLamp(l) {
  l.on = !l.on;
  l.fx.pulse = 0.6;
  Kit.sfx('toggle', { pitch: l.on ? 1.25 : 0.75 });
  S.dirty = true;
}

function setColor(c, fromUser) {
  if (!COLORS.includes(c)) return;
  S.color = c;
  for (const k of COLORS) Kit.ui.setActive(S.ui.swatch[k], k === c);
  if (S.ui.glassBtn) S.ui.glassBtn.style.color = BASE[c];
  const l = S.selLamp;
  if (l && l.color !== c) {
    l.color = c; l.fx.pulse = 0.7;
    burst(l.x + l.nx * 10, l.y + l.ny * 10, BASE[c], 8, 120);
    S.dirty = true;
  }
  if (fromUser) Kit.sfx('bloop', { pitch: pitchOf(c) });
}

// ================================================================== beams (visibility polygons)
/** Distance along (dx, dy) to the first wall or object that blocks `color` (skip: the mirror a
 *  reflected ray leaves). Also leaves in rayHit / rayFace the mirror and face it ended on (else null / -1),
 *  and in rayEdge which edge stopped it (a wall: -1 … -4; an object edge: id·64 + edge). */
let rayHit = null, rayFace = -1, rayEdge = 0;
function castRay(ox, oy, dx, dy, color, skip) {
  const R = S.room;
  let t = Infinity, hit = null, edge = -1, wall = 0;
  if (dx > 1e-9) { t = (R.x + R.w - ox) / dx; wall = -1; } else if (dx < -1e-9) { t = (R.x - ox) / dx; wall = -2; }
  if (dy > 1e-9) { const ty = (R.y + R.h - oy) / dy; if (ty < t) { t = ty; wall = -3; } } else if (dy < -1e-9) { const ty = (R.y - oy) / dy; if (ty < t) { t = ty; wall = -4; } }
  const obs = S.obstacles;
  for (let k = 0; k < obs.length; k++) {
    const o = obs[k];
    if (o.glass === color || o === skip) continue;
    const px = o.bx - ox, py = o.by - oy, tc = px * dx + py * dy, br2 = o.br * o.br;
    if (tc < -o.br) continue;
    const perp2 = px * px + py * py - tc * tc;
    if (perp2 > br2 || tc - Math.sqrt(br2 - perp2) > t) continue;
    const pts = o.points, n = pts.length;
    for (let i = 0, j = n - 1; i < n; j = i++) {
      const ax = pts[j].x, ay = pts[j].y, ex = pts[i].x - ax, ey = pts[i].y - ay;
      const den = dx * ey - dy * ex;
      if (den > -1e-12 && den < 1e-12) continue;
      const qx = ax - ox, qy = ay - oy;
      const tt = (qx * ey - qy * ex) / den;
      if (tt <= 1e-6 || tt >= t) continue;
      const u = (qx * dy - qy * dx) / den;
      if (u >= 0 && u <= 1) { t = tt; hit = o; edge = j; }
    }
  }
  const face = hit && isMirror(hit) && (edge === MIRROR_FACES[0] || edge === MIRROR_FACES[1]);
  rayHit = face ? hit : null; rayFace = face ? edge : -1;
  rayEdge = hit ? hit.id * 64 + edge : wall;
  return t;
}

/** Far ends of a fan of rays as polygon points, leaving out every end whose neighbours stop on the same
 *  edge (it lies on the straight line between them). Exact, and it keeps a beam's polygon the same when
 *  only an object it cannot see moves (whose corners still add rays), so that beam stays baked. */
function pushFarEnds(poly, ox, oy, c, ang, t, eid) {
  const n = ang.length;
  for (let i = 0; i < n; i++) {
    if (i > 0 && i < n - 1 && eid[i] === eid[i - 1] && eid[i] === eid[i + 1]) continue;
    const a = c + ang[i];
    poly.push(ox + Math.cos(a) * t[i], oy + Math.sin(a) * t[i]);
  }
}

/** Where two shadow edges almost line up (or a ray grazes the vertex between two edges), a run of
 *  rays slips through a gap thinner than a couple of pixels even at its far end, which draws a stray
 *  hairline across the room. Such a gap is closed: each of its rays stops where its nearer flanking
 *  neighbour does (and so ends on what that neighbour hit: ho / hf the mirror and face, eid the edge).
 *  Wider gaps stay open as real thin rays of light. */
function closeNeedles(ang, t, ho, hf, eid) {
  const n = t.length, M = 8;   // a gap counts once its rays reach M px past both flanking hits
  for (let i = 1; i < n - 1; i++) {
    const left = t[i - 1];
    if (t[i] <= left + M) continue;
    let low = t[i], high = t[i];   // nearest and furthest hit inside the run so far
    for (let j = i; j + 1 < n && (ang[j + 1] - ang[i - 1]) * left < NEEDLE_PX; j++) {
      const right = t[j + 1];
      if (right + M < low) {
        if ((ang[j + 1] - ang[i - 1]) * high < NEEDLE_PX) {
          for (let k = i; k <= j; k++) {
            const from = k - i < j - k ? i - 1 : j + 1;
            t[k] = t[from]; ho[k] = ho[from]; hf[k] = hf[from]; eid[k] = eid[from];
          }
          i = j;
        }
        break;
      }
      low = Math.min(low, right); high = Math.max(high, right);
      if (low <= left + M) break;
    }
  }
}

function samePoly(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}

function computeBeam(l) {
  const fx = l.fx, poly = polyBuf, ox = l.ox, oy = l.oy, a0 = l.angle, hw = l.width / 2, k = fx.inKey;
  if (fx.path && k[0] === ox && k[1] === oy && k[2] === a0 && k[3] === l.width && k[4] === l.color && k[5] === S.obsRev) return;
  k[0] = ox; k[1] = oy; k[2] = a0; k[3] = l.width; k[4] = l.color; k[5] = S.obsRev;
  angBuf.length = 0;
  const n = Math.max(2, Math.ceil(l.width / RAY_STEP));
  for (let i = 0; i <= n; i++) angBuf.push(-hw + (l.width * i) / n);
  const addVert = (vx, vy) => {
    const d = angleDiff(a0, Math.atan2(vy - oy, vx - ox));
    if (d > -hw && d < hw) angBuf.push(Math.max(-hw, d - EPS_ANG), d, Math.min(hw, d + EPS_ANG));
  };
  for (const o of S.obstacles) if (blocks(o, l.color)) for (const p of o.points) addVert(p.x, p.y);
  const c = S.roomCorners;
  for (let i = 0; i < 8; i += 2) addVert(c[i], c[i + 1]);
  angBuf.sort(byNumber);
  tBuf.length = 0; hoBuf.length = 0; hfBuf.length = 0; eBuf.length = 0;
  for (let i = 0; i < angBuf.length; i++) {
    const a = a0 + angBuf[i];
    tBuf.push(castRay(ox, oy, Math.cos(a), Math.sin(a), l.color));
    hoBuf.push(rayHit); hfBuf.push(rayFace); eBuf.push(rayEdge);
  }
  closeNeedles(angBuf, tBuf, hoBuf, hfBuf, eBuf);
  // the rays themselves (relative angle, length, mirror face hit): reflections start where they meet a mirror
  const P = fx.piece;
  copyInto(P.ang, angBuf); copyInto(P.t, tBuf); copyInto(P.ho, hoBuf); copyInto(P.hf, hfBuf);
  P.c = a0; P.hw = hw;
  poly.length = 0;
  poly.push(ox, oy);
  pushFarEnds(poly, ox, oy, a0, angBuf, tBuf, eBuf);
  let far = 0;
  for (let i = 0; i < tBuf.length; i++) if (tBuf[i] > far) far = tBuf[i];
  // an unchanged beam keeps its path, so the sprite floor can leave it baked
  if (fx.path && fx.polyColor === l.color && samePoly(poly, fx.poly)) return;
  polyBuf = fx.poly; fx.poly = poly; fx.polyColor = l.color;
  fx.path = polyPath2D(poly);
  fx.far = Math.max(far, 40);
  fx.grad = null;
}

function polyPath2D(poly) {
  const path = new Path2D();
  path.moveTo(poly[0], poly[1]);
  for (let i = 2; i < poly.length; i += 2) path.lineTo(poly[i], poly[i + 1]);
  path.closePath();
  return path;
}

function polyBounds(p) {
  const q = p.poly;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let i = 0; i < q.length; i += 2) { x0 = Math.min(x0, q[i]); x1 = Math.max(x1, q[i]); y0 = Math.min(y0, q[i + 1]); y1 = Math.max(y1, q[i + 1]); }
  p.x0 = x0 - 1; p.y0 = y0 - 1; p.x1 = x1 + 1; p.y1 = y1 + 1;
}

/** Every beam piece: each lamp's direct beam, then (breadth first, so every lamp gets its first bounces
 *  before anyone's third) the reflections off each lit stretch of a mirror face, up to the bounce limit
 *  and MAX_REFLECTIONS in all. Lamps that are on get the whole budget first; lamps switched off (whose
 *  light still fades out) only what is left, so switching one off never takes bounces from the others.
 *  Also lists where light meets a mirror (S.mirrorHits, for the glints). */
function buildPieces() {
  const out = S.pieces, prev = S.pieceByKey, next = new Map();
  out.length = 0; S.mirrorHits.length = 0;
  const limit = Math.round(tw('bounces')), K = tw('mirrorK');
  let made = 0;
  for (const on of [true, false]) {
    const q0 = out.length;
    for (const l of S.lamps) {
      if (l.on !== on || !l.fx.path) continue;
      const P = l.fx.piece, fx = l.fx;
      if (P.path !== fx.path) P.pathAt = Kit.realTime;
      P.color = l.color; P.sx = l.ox; P.sy = l.oy; P.poly = fx.poly; P.path = fx.path; P.far = fx.far;
      polyBounds(P);
      out.push(P);
    }
    made = reflectAll(out, q0, prev, next, limit, K, made);
  }
  S.pieceByKey = next;
}

/** Breadth-first reflections of the pieces out[q0…] (and of their own reflections), adding at most
 *  MAX_REFLECTIONS − made pieces; returns the new count. */
function reflectAll(out, q0, prev, next, limit, K, made) {
  for (let q = q0; q < out.length; q++) {
    const P = out[q], n = P.t.length, h0 = S.mirrorHits.length;
    // runs of neighbouring rays that end on the same mirror face: each is a lit stretch of that face
    for (let a = 0; a < n; a++) {
      const o = P.ho[a];
      if (!o) continue;
      let b = a;
      while (b + 1 < n && P.ho[b + 1] === o && P.hf[b + 1] === P.hf[a]) b++;
      const face = P.hf[a];
      let ord = 0;   // which lit stretch of this face (a shadow can split one): keeps the key stable
      for (let h = h0; h < S.mirrorHits.length; h++) if (S.mirrorHits[h].o === o && S.mirrorHits[h].face === face) ord++;
      const run = `${o.id}.${face}.${ord}`;
      const ca = P.c + P.ang[a], cb = P.c + P.ang[b];
      const x1 = P.sx + Math.cos(ca) * P.t[a], y1 = P.sy + Math.sin(ca) * P.t[a];
      const x2 = P.sx + Math.cos(cb) * P.t[b], y2 = P.sy + Math.sin(cb) * P.t[b];
      a = b;
      if (Math.hypot(x2 - x1, y2 - y1) < 1) continue;
      const hit = { o, face, x1, y1, x2, y2, color: P.color, k: P.k, depth: P.depth, lamp: P.lamp, reflected: false };
      S.mirrorHits.push(hit);
      if (P.depth >= limit || made >= MAX_REFLECTIONS) continue;
      const key = P.key + '>' + run;
      const C = prev.get(key) || makePiece(P.lamp, P.depth + 1, key);
      if (reflectPiece(C, P, o, face, x1, y1, x2, y2)) { C.k = P.k * K; out.push(C); next.set(key, C); made++; hit.reflected = true; }
    }
  }
  return made;
}

/** Reflection of parent piece P off the stretch (x1, y1)–(x2, y2) of mirror o's face: rays from P's
 *  source mirrored across that face, through the stretch and on until something stops them.
 *  False when the stretch is seen edge-on. */
function reflectPiece(C, P, o, face, x1, y1, x2, y2) {
  const F = mirrorFace(o, face), nx = F.nx, ny = F.ny;
  const ds = (P.sx - F.ax) * nx + (P.sy - F.ay) * ny;   // the source is in front of the face
  const sx = P.sx - 2 * ds * nx, sy = P.sy - 2 * ds * ny;   // its mirror image, behind it
  const t1 = Math.atan2(y1 - sy, x1 - sx), span = angleDiff(t1, Math.atan2(y2 - sy, x2 - sx));
  const hw = Math.abs(span) / 2, c = t1 + span / 2;
  if (hw < 2e-5) return false;
  C.color = P.color; C.sx = sx; C.sy = sy; C.c = c; C.hw = hw;
  C.mirror = o; C.ax = F.ax; C.ay = F.ay; C.nx = nx; C.ny = ny;
  const color = P.color, ang = angBuf;
  ang.length = 0;
  const m = Math.max(1, Math.ceil((2 * hw) / RAY_STEP));
  for (let i = 0; i <= m; i++) ang.push(-hw + (2 * hw * i) / m);
  const addVert = (vx, vy) => {
    const d = angleDiff(c, Math.atan2(vy - sy, vx - sx));
    if (d > -hw && d < hw) ang.push(Math.max(-hw, d - EPS_ANG), d, Math.min(hw, d + EPS_ANG));
  };
  for (const ob of S.obstacles) if (ob !== o && blocks(ob, color)) for (const p of ob.points) addVert(p.x, p.y);
  const rc = S.roomCorners;
  for (let i = 0; i < 8; i += 2) addVert(rc[i], rc[i + 1]);
  ang.sort(byNumber);
  tBuf.length = 0; hoBuf.length = 0; hfBuf.length = 0; tsBuf.length = 0; eBuf.length = 0;
  const base = (F.ax - sx) * nx + (F.ay - sy) * ny;   // how far the image sits behind the face line
  for (let i = 0; i < ang.length; i++) {
    const a = c + ang[i], dx = Math.cos(a), dy = Math.sin(a), dn = dx * nx + dy * ny;
    const ts = dn > 1e-9 ? base / dn : 0;   // where the ray crosses the face: the light starts there
    tsBuf.push(ts);
    tBuf.push(ts + castRay(sx + dx * ts, sy + dy * ts, dx, dy, color, o));
    hoBuf.push(rayHit); hfBuf.push(rayFace); eBuf.push(rayEdge);
  }
  closeNeedles(ang, tBuf, hoBuf, hfBuf, eBuf);
  copyInto(C.ang, ang); copyInto(C.t, tBuf); copyInto(C.ho, hoBuf); copyInto(C.hf, hfBuf);
  // polygon: the lit stretch of the face, then the far ends of the rays
  const poly = polyBuf, last = ang.length - 1;

  pushFarEnds(poly, sx, sy, c, ang, tBuf, eBuf);

  for (let i = 0; i <= last; i++) if (tBuf[i] > far) far = tBuf[i];
  poly.push(sx + Math.cos(c + ang[last]) * tsBuf[last], sy + Math.sin(c + ang[last]) * tsBuf[last]);
  C.far = Math.max(far, 40);

    polyBuf = C.poly; C.poly = poly;

}

// ================================================================== light strength
/** Lit test: distance from lamp l to (px, py) when l lights that point, else -1. */
function litDist(px, py, l) {
  if (!l.on || !inRoomRect(px, py)) return -1;
  const dx = px - l.ox, dy = py - l.oy, d = Math.hypot(dx, dy);
  if (d < 1) return 0;
  if (Math.abs(angleDiff(l.angle, Math.atan2(dy, dx))) > l.width / 2) return -1;
  if (segBlocked(l.ox, l.oy, px, py, l.color)) return -1;
  return d;
}
/** Lit test for any beam piece: the length of the light's path from its lamp to (px, py) when the
 *  piece lights that point, else -1. A reflection lights a point in front of its mirror face whose
 *  line to the lamp's image crosses the lit stretch of the face, with nothing in between that blocks
 *  its color (the same rule its polygon is cast with). */
function pieceDist(px, py, p) {
  if (!p.depth) return litDist(px, py, p.lamp);
  if (!p.lamp.on || px < p.x0 || px > p.x1 || py < p.y0 || py > p.y1 || !inRoomRect(px, py)) return -1;
  const front = (px - p.ax) * p.nx + (py - p.ay) * p.ny;

  const dx = px - p.sx, dy = py - p.sy;
  if (Math.abs(angleDiff(p.c, Math.atan2(dy, dx))) > p.hw) return -1;
  const behind = (p.ax - p.sx) * p.nx + (p.ay - p.sy) * p.ny, f = behind / (behind + front);
  if (segBlocked(p.sx + dx * f, p.sy + dy * f, px, py, p.color, p.mirror)) return -1;
  return Math.hypot(dx, dy);
}
/** What one beam adds to the light strength L at distance d: 1 at the lamp, 0.65 from `reach` on. */
const strengthAt = (d) => 1 - FALLOFF * Math.min(1, d / reachPx());
/** Visible brightness of piece p at (x, y), 0 when dark (rim light, glass glow, dust). */
function pieceGlow(x, y, p) {
  const d = pieceDist(x, y, p);
  return d < 0 ? 0 : p.k / (1 + d / reachPx());
}

/** Light at a point: L sums every beam piece that lights it (a reflection at its strength factor,
 *  falling off along its whole path), whatever its color, so overlaps are stronger. Also reports how
 *  many pieces light it, their colors as a bit mask, the colors of the first three (rings) and the
 *  lamp that gives the most. */
const probe = { L: 0, n: 0, mask: 0, lamp: null, rings: new Int8Array(3) };
function sampleLight(x, y, out = probe) {
  out.L = 0; out.n = 0; out.mask = 0; out.lamp = null;
  let top = 0;
  for (const p of S.pieces) {
    const d = pieceDist(x, y, p);
    if (d < 0) continue;
    const f = p.k * strengthAt(d);
    if (out.n < 3) out.rings[out.n] = CI[p.color];
    out.L += f; out.n++; out.mask |= 1 << CI[p.color];

}
const lightAt = (x, y) => sampleLight(x, y).L;

function segBlocked(ax, ay, bx, by, color, skip) {
  const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy || 1;
  const obs = S.obstacles;
  for (let k = 0; k < obs.length; k++) {
    const o = obs[k];
    if (o.glass === color || o === skip) continue;
    const t = clamp(((o.bx - ax) * dx + (o.by - ay) * dy) / len2, 0, 1);
    const cx = ax + dx * t - o.bx, cy = ay + dy * t - o.by;

    const pts = o.points, n = pts.length;
    for (let i = 0, j = n - 1; i < n; j = i++) {
      if (U.segIntersect(ax, ay, bx, by, pts[j].x, pts[j].y, pts[i].x, pts[i].y) >= 0) return true;
    }
  }
  return false;
}

/** Is (x, y) lit by lamp (directly or by any of its reflections); without a lamp, by any light. */
function isLitPoint(x, y, lamp) {
  if (lamp) return S.pieces.some((p) => p.lamp === lamp && pieceDist(x, y, p) >= 0);
  return sampleLight(x, y).n > 0;
}

/** Recompute every beam and its reflections, plus the derived lighting on object edges and glass. */
function recomputeBeams() {
  S.dirty = false;
  S.floorDirty = true;
  S.mapDirty = true;
  S.counts.beams++;
  for (const l of S.lamps) computeBeam(l);
  buildPieces();
  for (const o of S.obstacles) {
    const el = o.fx.edgeLit, pts = o.points, n = pts.length;
    el.fill(0);
    if (isMirror(o)) { o.glow = 0; continue; }   // a mirror shows its hits as glints instead
    for (let i = 0, j = n - 1; i < n; j = i++) {
      const ax = pts[j].x, ay = pts[j].y, bx = pts[i].x, by = pts[i].y;
      const mx = (ax + bx) / 2, my = (ay + by) / 2;
      let nx = by - ay, ny = -(bx - ax);
      const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
      if (nx * (mx - o.bx) + ny * (my - o.by) < 0) { nx = -nx; ny = -ny; }
      for (const p of S.pieces) {   // an edge facing where the piece's light comes from
        if (!p.lamp.on || nx * (p.sx - mx) + ny * (p.sy - my) <= 0) continue;
        el[j * NC + CI[p.color]] += pieceGlow(mx + nx * 2, my + ny * 2, p);
      }
    }
    let g = 0;
    if (o.glass) {
      for (const p of S.pieces) {
        if (p.color !== o.glass) continue;
        g = Math.max(g, pieceGlow(o.bx, o.by, p));
        for (const q of pts) g = Math.max(g, pieceGlow(lerp(q.x, o.bx, 0.35), lerp(q.y, o.by, 0.35), p));
      }
    }
    o.glow = g;
  }
}

// ================================================================== light map (moths plan from it)
/* A coarse grid of L over the room, rebuilt (at most ~10 times a second) whenever the beams change.
 * Each cell keeps one open sample point (clear of objects and lamp heads) and its exact L. Bright cells
 * are grouped into regions, grown from the brightest cell down: a region holds the connected cells
 * within BAND of its own peak. A region whose peak sits next to a brighter region is only that
 * region's slope; the others are bands. A moth commits to one band and roams inside it. A band too
 * small for its moths then grows into the brightest light around it (growBands). */
const MAP = {
  cols: 0, rows: 0, n: 0, cw: 1, ch: 1, max: 0, builtAt: -9, active: 0,
  L: new Float32Array(0), sx: new Float32Array(0), sy: new Float32Array(0), ok: new Uint8Array(0),
  reg: new Int16Array(0), crowd: new Float32Array(0), w: new Float32Array(0),
  mark: new Uint8Array(0), ring: new Uint8Array(0),   // growBands scratch; ring: how far out a grown cell lies
  peak: [], isBand: [], floor: [], cells: [],   // per region: brightest L, real band or slope, lowest L it holds, size
};
const mapOrder = [], mapStack = [], mapLoad = [];
const byMapL = (a, b) => MAP.L[b] - MAP.L[a];
const SPOT_TRIES = [0, 0, -0.3, 0, 0.3, 0, 0, -0.3, 0, 0.3, -0.3, -0.3, 0.3, -0.3, -0.3, 0.3, 0.3, 0.3];
const spotClear = () => 18 * S.scale;   // a moth's body plus a little air

function cellIndex(x, y) {
  const M = MAP, R = S.room;
  const i = clamp(Math.floor((x - R.x) / M.cw), 0, M.cols - 1), j = clamp(Math.floor((y - R.y) / M.ch), 0, M.rows - 1);
  return j * M.cols + i;
}

/** A spot a moth can hold: inside the room, clear of every object and at least ~50 px from every lamp head. */
function openSpot(x, y, clear) {
  if (!inRoom(x, y, clear)) return false;
  const lr = 50 * S.scale;
  for (const l of S.lamps) if ((x - l.x) * (x - l.x) + (y - l.y) * (y - l.y) < lr * lr) return false;
  for (const o of S.obstacles) {
    const dx = x - o.bx, dy = y - o.by;
    if (dx * dx + dy * dy > (o.br + clear) * (o.br + clear)) continue;
    if (U.pointInPoly(x, y, o.points)) return false;
    const pts = o.points, n = pts.length;
    for (let i = 0, j = n - 1; i < n; j = i++) {
      const ax = pts[j].x, ay = pts[j].y, ex = pts[i].x - ax, ey = pts[i].y - ay;
      const t = clamp(((x - ax) * ex + (y - ay) * ey) / (ex * ex + ey * ey || 1), 0, 1);
      const qx = ax + ex * t - x, qy = ay + ey * t - y;
      if (qx * qx + qy * qy < clear * clear) return false;
    }

  return true;
}

function buildMap() {
  S.mapDirty = false;
  S.counts.maps++;
  const M = MAP, R = S.room, s = S.scale, clear = spotClear();
  const size = clamp(44 * s, 36, 60);
  const cols = Math.max(1, Math.round(R.w / size)), rows = Math.max(1, Math.round(R.h / size)), n = cols * rows;
  if (n !== M.n) {
    M.n = n;
    for (const k of ['L', 'sx', 'sy', 'crowd', 'w']) M[k] = new Float32Array(n);
    M.ok = new Uint8Array(n); M.mark = new Uint8Array(n); M.ring = new Uint8Array(n); M.reg = new Int16Array(n);
  }
  M.cols = cols; M.rows = rows; M.cw = R.w / cols; M.ch = R.h / rows;

    for (let i = 0; i < cols; i++, c++) {
      const cx = R.x + (i + 0.5) * M.cw, cy = R.y + (j + 0.5) * M.ch;
      M.ok[c] = 0; M.L[c] = 0;
      for (let k = 0; k < SPOT_TRIES.length; k += 2) {
        const x = cx + SPOT_TRIES[k] * M.cw, y = cy + SPOT_TRIES[k + 1] * M.ch;
        if (!openSpot(x, y, clear)) continue;
        M.ok[c] = 1; M.sx[c] = x; M.sy[c] = y; M.L[c] = lightAt(x, y);
        break;
      }
    }
  }
  // a narrow beam can slip between the sample points: sample along every beam's axis too (a
  // reflection's axis starts on its mirror; one wider than a cell at its far end is caught anyway)
  for (const p of S.pieces) {
    if (!p.lamp.on || (p.depth && 2 * p.hw * p.far > size)) continue;
    const ca = Math.cos(p.c), sa = Math.sin(p.c);
    let x0 = p.sx, y0 = p.sy, d0 = 52 * s;
    if (p.depth) {
      const dn = ca * p.nx + sa * p.ny;
      if (dn <= 1e-6) continue;
      const ts = ((p.ax - p.sx) * p.nx + (p.ay - p.sy) * p.ny) / dn;
      x0 += ca * ts; y0 += sa * ts; d0 = spotClear();
    }
    const far = castRay(x0, y0, ca, sa, p.color, p.mirror);
    for (let d = d0; d < far; d += size / 2) {
      const x = x0 + ca * d, y = y0 + sa * d;

      const c = cellIndex(x, y), L = lightAt(x, y);

  for (let c = 0; c < n; c++) if (M.ok[c] && M.L[c] > max) max = M.L[c];

  mapOrder.sort(byMapL);

    const ci = c % cols, cj = (c - ci) / cols;
    for (let j = Math.max(0, cj - 1); j <= Math.min(rows - 1, cj + 1); j++) {
      for (let i = Math.max(0, ci - 1); i <= Math.min(cols - 1, ci + 1); i++) if (M.reg[j * cols + i] >= 0) return true;
    }

          const q = j * cols + i;

/** Two bands whose cells touch and neither of which beats the other (BEAT) are one bright patch with
 *  two crests (e.g. a triple overlap split by a beam edge, or its tip by the lamps): the dimmer one joins
 *  the brighter, so neither is left too small to roam in. Bands apart from each other stay apart (no
 *  flip-flop between them). */

    const ci = c % cols, cj = (c - ci) / cols;
    for (let j = Math.max(0, cj - 1); j <= Math.min(rows - 1, cj + 1); j++) {
      for (let i = Math.max(0, ci - 1); i <= Math.min(cols - 1, ci + 1); i++) {
        const b = M.reg[j * cols + i];
        if (b <= a || !M.isBand[b] || BEAT * M.peak[b] <= M.peak[a]) continue;
        for (let q = 0; q < M.n; q++) if (M.reg[q] === b) M.reg[q] = a;

/** A band smaller than the moths that will roam in it need (CELLS_PER_MOTH each, BAND_MIN_CELLS at
 *  least) takes in the cells around it ring by ring (brightest first within a ring), down to GROW_FLOOR
 *  of its peak and at most GROW_RINGS out, so it stays centred on its brightest spot. It may take
 *  slopes, unclaimed cells, bands the brightest one beats (their moths leave them) and bands no moth is
 *  in, never a band that still holds moths, so no moth changes band. A tiny triple overlap thus becomes
 *  the triple spot plus the two-beam light right around it: the swarm crowds round it and keeps moving. */
const mapRing = [];
function growBands() {
  const M = MAP, nr = M.peak.length, cols = M.cols, rows = M.rows;
  M.floor.length = nr; M.cells.length = nr; mapLoad.length = nr;
  M.ring.fill(0);   // for a grown cell: how many rings out from its band it was taken (merged crests: 1)
  for (let r = 0; r < nr; r++) { M.floor[r] = BAND * M.peak[r]; M.cells[r] = 0; mapLoad[r] = 0; }
  for (let c = 0; c < M.n; c++) {
    const r = M.reg[c];
    if (r < 0) continue;
    M.cells[r]++;

    if (M.L[c] < M.floor[r]) M.floor[r] = M.L[c];

  if (!nr) { M.active = 0; return; }
  // the moths each band will hold: its committed ones; the rest (new, or leaving a beaten band) go to the brightest
  const beaten = (r) => BEAT * M.peak[r] <= M.max;
  let active = 0;
  for (const m of S.moths) {
    if (m.state !== 'seek' && m.state !== 'roam') continue;
    active++;
    // a moth in light its band grew over at the last rebuild still belongs to that band
    let r = m.dest ? regionNear(m.dest.x, m.dest.y) : -1;
    if (r < 0 || M.peak[r] < 0.98 * m.bandL) { const o = ownBand(m); if (o >= 0) r = o; }
    if (r < 0 || beaten(r)) r = 0;

    const o = M.reg[q];

  };

      const ci = c % cols, cj = (c - ci) / cols;
      for (let j = Math.max(0, cj - 1); j <= Math.min(rows - 1, cj + 1); j++) {
        for (let i = Math.max(0, ci - 1); i <= Math.min(cols - 1, ci + 1); i++) {
          const q = j * cols + i;
          if (!M.mark[q] && M.L[q] >= lo && open(q, r)) { M.mark[q] = 1; front.push(q); }
        }
      }

    M.mark.fill(0);

      mapRing.length = 0;
      for (const q of front) mapRing.push(q);
      front.length = 0;
      mapRing.sort(byMapL);
      for (const q of mapRing) {
        if (M.cells[r] >= need) break;
        if (!open(q, r)) continue;
        if (M.reg[q] >= 0) M.cells[M.reg[q]]--;

/** The band a moth is committed to, found again after a rebuild: a band with (about) the peak it
 *  committed to, right by its destination (so two equal bands stay apart, and a band that changed its
 *  strength is not mistaken for another one across the room); -1 once it is gone. */
function ownBand(m) {
  const M = MAP, x = m.dest ? m.dest.x : m.x, y = m.dest ? m.dest.y : m.y;
  const lim = (GROW_RINGS + 1) * Math.max(M.cw, M.ch);

    const d = (M.sx[c] - x) * (M.sx[c] - x) + (M.sy[c] - y) * (M.sy[c] - y);
    if (d < bd) { bd = d; best = r; }

/** The lowest light that still counts as inside band r (a grown band reaches below BAND of its peak). */
const floorOf = (r) => {

};
/** One ray of `color` from (x, y) along (dx, dy), bounced by mirrors up to the bounce limit (test API):
 *  {points: [{x, y}, …] (start, then every hit), hits: [{mirror (obstacle index), x, y, nx, ny (outward
 *  face normal), inDeg, outDeg (angles to the normal)}]}. */
function reflectRay(x, y, dx, dy, color = S.color, bounces = Math.round(tw('bounces'))) {

/** Bring the beams and the map up to date now (test API; the loop throttles its own rebuilds). */
function syncMap() {
  if (S.dirty) recomputeBeams();
  if (S.mapDirty) buildMap();
}

// ================================================================== creatures (moths)
function makeMoth(x, y, look) {
  const m = {
    x, y, vx: 0, vy: 0, h: rand(0, TAU), wh: rand(0, TAU),
    state: 'wander', dest: null,   // dest: where it flies while the light draws it
    L: 0, n: 0,                    // light strength at its position, and how many lamps make it
    region: -1, bandL: 0, floorL: 0,   // the bright band it is committed to: light-map region, its peak, its lowest light
    size: rand(0.9, 1.1), look: look != null ? look : U.randi(0, MOTH_LOOKS.length - 1),
    p1: rand(0, TAU), p2: rand(0, TAU), p3: rand(0, TAU), flap: rand(0, TAU),
    darkT: 0, outT: 0, lostT: 0, dazeT: 0, spin: 1,
    nextT: 0, holdT: 0, stuckT: 0, bestD: Infinity, loopT: 0, loopA: 0, arrive: 35,   // arrive: px (at scale 1) that count as there
    glow: 0, glowMask: 0, boost: 0, crowd: 0, squash: 0, lastLit: -9, cueAt: -9,
  };
  Object.defineProperty(m, 'fx', { value: { trail: new Float32Array(TRAIL * 2), tn: 0, th: 0, rings: new Int8Array([-1, -1, -1]) }, enumerable: false });
  return m;
}

function randomFreePoint(margin) {
  const R = S.room;
  for (let i = 0; i < 60; i++) {
    const x = rand(R.x + margin, R.x + R.w - margin), y = rand(R.y + margin, R.y + R.h - margin);
    if (!inRoom(x, y, margin)) continue;
    let ok = true;
    for (const o of S.obstacles) if (U.dist(x, y, o.bx, o.by) < o.br + margin) { ok = false; break; }
    if (ok) return { x, y };
  }
  return { x: R.x + R.w / 2, y: R.y + R.h / 2 };
}

function setCreatureCount(n) {
  n = clamp(Math.round(n), 1, MAX_MOTHS);
  if (!S.ready) return;
  let changed = false;
  while (S.moths.length < n) {
    const p = randomFreePoint(30 * S.scale);
    const m = makeMoth(p.x, p.y);
    m.squash = 1;
    S.moths.push(m);
    burst(p.x, p.y, '#ffffff', 6, 90);
    changed = true;
  }
  while (S.moths.length > n) {
    const m = S.moths.pop();
    poof(m.x, m.y, 10 * S.scale, '#d8d0e8');
    changed = true;
  }
  if (changed) Kit.sfx('bloop', { gap: 70, vol: 0.5, pitch: rand(1.1, 1.4) });
  updateCounts();
}

function scatter() {
  for (const m of S.moths) {
    let ax = rand(-1, 1), ay = rand(-1, 1);
    if (m.dest) { ax += (m.x - m.dest.x) * 0.02; ay += (m.y - m.dest.y) * 0.02; }
    const d = Math.hypot(ax, ay) || 1, sp = rand(260, 380) * S.scale;
    loseLight(m);
    m.dazeT = rand(0.9, 1.4); m.lostT = m.dazeT + 0.2;
    m.vx = (ax / d) * sp; m.vy = (ay / d) * sp;
  }
  Kit.sfx('whoosh', { pitch: 1.2 });
}

/** A beam reached a moth: it starts for the brightest band. */
function startSeek(m, pr) {
  if (Kit.time - m.lastLit > 1.2) {
    burst(m.x, m.y, BASE[pr.lamp.color], 9, 120);
    Kit.sfx('chirp', { gap: 220, vol: 0.55, pitch: rand(0.9, 1.15) });
    if (!S.litToastShown) {
      S.litToastShown = true;
      Kit.toast(Kit.pick('A moth spotted the light', 'An agent entered the light'), { tone: 'good' });
    }
  }
  m.state = 'seek'; m.darkT = 0; m.lastLit = Kit.time;
  plan(m, false);
}

function loseLight(m) {
  m.state = 'lost'; m.dest = null; m.region = -1;
  m.lostT = rand(0.6, 1); m.dazeT = 0.35; m.spin = Math.random() < 0.5 ? -1 : 1;
}

function setDest(m, x, y, region, bandL, tight) {
  if (m.dest) { m.dest.x = x; m.dest.y = y; } else m.dest = { x, y };
  m.arrive = tight ? 14 : 35;   // the bright spot of a grown band is small: fly right into it
  m.region = region; m.bandL = bandL; m.floorL = region >= 0 ? floorOf(region) : BAND * bandL;
  m.nextT = rand(2, 4) / tw('roam');
  m.stuckT = 0; m.bestD = Infinity; m.holdT = 0.4;   // in a tiny band every spot is "arrived": hold each a moment
}

/** Pick a destination from the light map. Across the room (inRegion false): a cell of the brightest
 *  band, nearer ones first. Inside the moth's own band (inRegion true): any cell of its region but the
 *  ones right next to it, so it keeps travelling all over the band (nearFirst: nearer ones first, for a
 *  moth whose spot just went dark). Cells that other moths head for or
 *  sit in count less, so a swarm spreads out; the cells a band grew by count less the further out they
 *  are and its own cells count more, so the swarm stays densest on and round its brightest spot. */
function pickDest(m, inRegion, nearFirst) {
  const M = MAP, n = M.n, s = S.scale;
  if (!(M.max > 0) || (inRegion && !(m.region >= 0 && m.region < M.peak.length))) return false;
  M.crowd.fill(0);
  for (const o of S.moths) {
    if (o === m) continue;
    if (o.dest) M.crowd[cellIndex(o.dest.x, o.dest.y)] += 1;
    M.crowd[cellIndex(o.x, o.y)] += 0.4;
  }
  const thr = BAND * M.max, cur = m.dest ? cellIndex(m.dest.x, m.dest.y) : -1;
  let total = 0;
  for (let c = 0; c < n; c++) {
    let w = 0;
    const r = M.reg[c], grown = M.ring[c] > 0;   // grown: a cell the band took in to fit its moths
    if (M.ok[c] && (inRegion ? r === m.region : M.L[c] >= thr || (grown && M.peak[r] >= thr))) {
      const d = Math.hypot(M.sx[c] - m.x, M.sy[c] - m.y);
      const near = inRegion && !nearFirst ? (d < 70 * s || c === cur ? 0.08 : 1) : 1 / (1 + d / (220 * s));
      w = near / (1 + 1.5 * M.crowd[c]);
      if (grown) w *= Math.pow(0.6, M.ring[c]);
      else if (r >= 0 && M.floor[r] < BAND * M.peak[r]) w *= 3;   // the brightest spot of a grown band: a few moths always on it
    }
    M.w[c] = w; total += w;
  }
  if (total <= 0) return false;
  let r = Math.random() * total, pick = -1;
  for (let c = 0; c < n; c++) {
    if (M.w[c] <= 0) continue;
    pick = c; r -= M.w[c];
    if (r <= 0) break;
  }
  const reg = M.reg[pick], bandL = reg >= 0 ? M.peak[reg] : M.L[pick];
  // a random open spot in that cell still in the band, a little inside its far edge and its beams' side
  // edges (so the path there stays in the light), else the cell's sample point
  const R = S.room, ci = pick % M.cols, cj = (pick - ci) / M.cols, clear = spotClear(), e = 14 * s;
  const core = BAND * bandL, need = Math.min(M.L[pick], (M.L[pick] >= core || reg < 0 ? core : floorOf(reg)) * 1.03);
  let x = M.sx[pick], y = M.sy[pick], found = false;
  for (let k = 0; k < 6 && !found; k++) {
    const px = R.x + (ci + Math.random()) * M.cw, py = R.y + (cj + Math.random()) * M.ch;
    if (openSpot(px, py, clear) && lightAt(px, py) >= need &&
      lightAt(px - e, py) >= need && lightAt(px + e, py) >= need && lightAt(px, py - e) >= need && lightAt(px, py + e) >= need) { x = px; y = py; found = true; }
  }
  // a sliver of light thinner than that margin: a spot a few pixels off the sample point, so moths
  // sent to the same sliver do not pile up on one point
  for (let k = 0; k < 4 && !found; k++) {
    const px = M.sx[pick] + rand(-8, 8) * s, py = M.sy[pick] + rand(-8, 8) * s;
    if (cellIndex(px, py) === pick && openSpot(px, py, clear) && lightAt(px, py) >= need) { x = px; y = py; found = true; }
  }
  setDest(m, x, y, reg, bandL, reg >= 0 && !M.ring[pick] && M.floor[reg] < BAND * M.peak[reg]);
  return true;
}

/** The map missed this moth's beam (too narrow to sample): an open spot nearby that is about as bright. */
function pickNear(m) {
  const s = S.scale, own = lightAt(m.x, m.y), clear = spotClear();
  if (own <= 0) return false;
  for (let k = 0; k < 12; k++) {
    const a = rand(0, TAU), d = rand(30, 140) * s, x = m.x + Math.cos(a) * d, y = m.y + Math.sin(a) * d;
    if (openSpot(x, y, clear) && lightAt(x, y) >= own * 0.95) { setDest(m, x, y, -1, own); return true; }
  }
  return false;
}

/** A new destination inside the moth's own band, or across the room in the brightest band. nearFirst:
 *  its spot just went dark or left the band, so it hurries to the nearest part of the band. */
function plan(m, inRegion, nearFirst) {
  const prev = m.region;
  const ok = (inRegion && pickDest(m, true, nearFirst)) || pickDest(m, false) || pickNear(m);
  if (ok && (nearFirst || (!inRegion && m.region !== prev))) m.state = 'seek';   // hurry (back) to the light
  return ok;
}

/** The band at (x, y), or the brightest one next to it (the spot itself may have just been covered);
 *  -1 on a slope or in the dark. */
function regionNear(x, y) {
  const M = MAP;
  if (!M.n) return -1;
  const c = cellIndex(x, y), own = M.reg[c];
  if (own >= 0) return M.isBand[own] ? own : -1;
  const ci = c % M.cols, cj = (c - ci) / M.cols;
  let best = -1;
  for (let j = Math.max(0, cj - 1); j <= Math.min(M.rows - 1, cj + 1); j++) {
    for (let i = Math.max(0, ci - 1); i <= Math.min(M.cols - 1, ci + 1); i++) {
      const r = M.reg[j * M.cols + i];
      if (r >= 0 && M.isBand[r] && (best < 0 || M.peak[r] > M.peak[best])) best = r;
    }
  }
  return best;
}

/** After the map changes: follow a band that moved, leave one that went dark, and stream to a band
 *  that clearly beats the committed one (BEAT). An equal band elsewhere never steals a moth: a moth
 *  whose spot went dark or fell out of its band picks a new one inside its own band first. One left in
 *  the dark re-plans too: the shadow grace in think() decides whether it reaches the light in time (a
 *  swung beam keeps its swarm); with no light anywhere it is lost at once. */
function replanAll() {
  const M = MAP;
  for (const m of S.moths) {
    if (!m.dest) continue;
    let r = regionNear(m.dest.x, m.dest.y);
    const destL = lightAt(m.dest.x, m.dest.y);
    // its spot is no longer in its band (the beam swung, a grown band shrank back): it stays with its band
    let outside = false;
    if (r < 0 || M.peak[r] < 0.98 * m.bandL) { const o = ownBand(m); if (o >= 0) { r = o; outside = true; } }
    if (r >= 0) { m.region = r; m.bandL = M.peak[r]; m.floorL = floorOf(r); } else m.region = -1;
    const dark = destL <= 0 && lightAt(m.x, m.y) <= 0;
    let ok = true;
    if (r < 0 || M.max >= BEAT * m.bandL) ok = plan(m, false);   // its band is gone or clearly beaten
    else if (destL <= 0 || outside) ok = plan(m, true, true);   // its spot went dark or out of the band: the nearest part of it
    else if (destL < m.floorL || !openSpot(m.dest.x, m.dest.y, spotClear())) ok = plan(m, true);
    if (!ok && dark) loseLight(m);   // no light anywhere
  }
}

/** Take in the light at the moth's position (pr); entering an overlap gets a small cue. */
function feelLight(m, pr) {
  if (pr.n >= 2 && m.n < 2 && (m.state === 'seek' || m.state === 'roam') && Kit.time - m.cueAt > 2.5) {
    m.cueAt = Kit.time; m.squash = 0.8;
    burst(m.x, m.y, SH.white, 6, 110);
    Kit.sfx('chime', { gap: 320, vol: 0.22, pitch: 1.1 + 0.12 * (pr.n - 2) });
    if (!S.overlapToastShown) {
      S.overlapToastShown = true;
      Kit.toast(Kit.pick('Two beams shine brighter than one', 'Two lights add up to a stronger one'), { tone: 'good' });
    }
  }
  m.L = pr.L; m.n = pr.n;
  if (pr.n) {   // while it crosses a shadow it keeps the colors of its last light
    m.glowMask = pr.mask;
    const r = m.fx.rings;
    for (let k = 0; k < 3; k++) r[k] = k < pr.n ? pr.rings[k] : -1;
  }
}

/** One moth's decisions for this step. */
function think(m, pr, dt) {
  if (m.dazeT > 0) { m.dazeT -= dt; return; }
  const lit = pr.n > 0;
  if (m.state === 'wander' || m.state === 'lost') {
    if (lit) startSeek(m, pr);
    return;
  }
  // a short grace carries it across a thin shadow
  if (lit) { m.darkT = 0; m.lastLit = Kit.time; } else if ((m.darkT += dt) > DARK_GRACE) { loseLight(m); return; }
  if (!m.dest && !plan(m, false)) return;
  const inBand = m.L >= m.floorL;
  if (m.state === 'seek') { if (inBand) { m.state = 'roam'; m.outT = 0; } } else if (inBand) m.outT = 0;
  else if ((m.outT += dt) > 1.2) m.state = 'seek';   // drifted out of its band: hurry back in
  const d = Math.hypot(m.dest.x - m.x, m.dest.y - m.y);
  if (d < m.bestD - 6 * S.scale) { m.bestD = d; m.stuckT = 0; } else m.stuckT += dt;
  m.nextT -= dt; m.holdT -= dt;
  // never hover: a new spot in the band on arrival, every few seconds while roaming, or when blocked
  if ((d < m.arrive * S.scale && m.holdT <= 0) || m.stuckT > 1.6 || (m.state === 'roam' && m.nextT <= 0)) plan(m, m.region >= 0);
}

// neighbour separation (module-level scratch keeps the hot loop allocation-free)
let sepM = null, sepAx = 0, sepAy = 0, sepR = 0, sepN = 0;
function sepVisit(o) {
  if (o === sepM) return;
  const dx = sepM.x - o.x, dy = sepM.y - o.y, d2 = dx * dx + dy * dy;
  if (d2 < 4 * sepR * sepR) sepN++;   // close enough for their halos to pile up
  if (d2 >= sepR * sepR || d2 < 1e-6) return;
  const d = Math.sqrt(d2), f = (1 - d / sepR) / d;
  sepAx += dx * f; sepAy += dy * f;
}

function avoidObstacles(m, look, strength, out) {
  const sp = Math.hypot(m.vx, m.vy);
  if (sp < 1) return;
  const dx = m.vx / sp, dy = m.vy / sp, rad = 12 * S.scale;
  for (const o of S.obstacles) {
    const px = o.bx - m.x, py = o.by - m.y, along = px * dx + py * dy;
    if (along < 0 || along > look + o.br) continue;
    const side = -px * dy + py * dx;
    if (Math.abs(side) > o.br + rad) continue;
    const push = (1 - along / (look + o.br)) * strength * (side > 0 ? -1 : 1);
    out.ax += -dy * push; out.ay += dx * push;
  }
}

function insideObstacle(x, y) {
  for (const o of S.obstacles) {
    if ((x - o.bx) * (x - o.bx) + (y - o.by) * (y - o.by) <= o.br * o.br && U.pointInPoly(x, y, o.points)) return true;
  }
  return false;
}

/** Move a moth by its velocity without ever leaving it inside an object: fast moths move in
 *  sub-steps shorter than their radius, so they cannot skip through a thin object in one frame. */
function moveMoth(m, dt, rad) {
  const px = m.x, py = m.y;
  const n = Math.min(8, Math.ceil((Math.hypot(m.vx, m.vy) * dt) / (rad * 0.6)) || 1);
  for (let k = 0; k < n; k++) {
    m.x += (m.vx * dt) / n; m.y += (m.vy * dt) / n;
    pushOutOfObstacles(m, rad);
    keepInRoom(m, rad);
  }
  // pushed out of one object into another, or against the wall: settle, else step back
  for (let k = 0; k < 2 && insideObstacle(m.x, m.y); k++) { pushOutOfObstacles(m, rad); keepInRoom(m, rad); }
  if (insideObstacle(m.x, m.y) && !insideObstacle(px, py)) { m.x = px; m.y = py; m.vx *= -0.4; m.vy *= -0.4; }
  if (insideObstacle(m.x, m.y)) escapeObjects(m, rad);
}

/** Last resort for a moth caught where objects overlap (one dragged onto another over it): hop to the nearest open spot. */
function escapeObjects(m, rad) {
  for (let d = rad; d < 20 * rad; d += rad) {
    for (let k = 0; k < 16; k++) {
      const a = (k / 16) * TAU, x = m.x + Math.cos(a) * d, y = m.y + Math.sin(a) * d;
      if (inRoom(x, y, rad) && !insideObstacle(x, y)) { m.x = x; m.y = y; return; }
    }
  }
}

function pushOutOfObstacles(m, rad) {
  for (const o of S.obstacles) {
    const ddx = m.x - o.bx, ddy = m.y - o.by;
    if (ddx * ddx + ddy * ddy > (o.br + rad) * (o.br + rad)) continue;
    const pts = o.points, n = pts.length;
    let best = Infinity, qx = 0, qy = 0;
    for (let i = 0, j = n - 1; i < n; j = i++) {
      const ax = pts[j].x, ay = pts[j].y, ex = pts[i].x - ax, ey = pts[i].y - ay;
      const t = clamp(((m.x - ax) * ex + (m.y - ay) * ey) / (ex * ex + ey * ey || 1), 0, 1);
      const cx = ax + ex * t, cy = ay + ey * t, d2 = (m.x - cx) * (m.x - cx) + (m.y - cy) * (m.y - cy);
      if (d2 < best) { best = d2; qx = cx; qy = cy; }
    }
    const inside = U.pointInPoly(m.x, m.y, pts);
    const d = Math.sqrt(best);
    let nx, ny, pen;
    if (inside) {
      if (d < 1e-6) { nx = ddx; ny = ddy; } else { nx = qx - m.x; ny = qy - m.y; }
      const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl; pen = d + rad;
    } else if (d < rad) {
      nx = (m.x - qx) / (d || 1); ny = (m.y - qy) / (d || 1); pen = rad - d;
    } else continue;
    m.x += nx * pen; m.y += ny * pen;
    const vn = m.vx * nx + m.vy * ny;
    if (vn < 0) { m.vx -= 1.5 * vn * nx; m.vy -= 1.5 * vn * ny; }
  }
}

const steer = { ax: 0, ay: 0 };
function updateMoths(dt, t) {
  const s = S.scale, spd = tw('speed'), pull = tw('pull'), restless = tw('roam');
  // roam is set at ~78 % of seek: turning from spot to spot costs about a fifth of it, so a roaming
  // moth's mean speed lands at ~60–70 % of its seek speed
  const wanderV = 45 * s * spd, seekV = 170 * s * spd * Math.sqrt(pull), roamV = 132 * s * spd * (0.65 + 0.35 * restless), rad = 12 * s;
  const R = S.room, rcx = R.x + R.w / 2, rcy = R.y + R.h / 2;
  sepR = 30 * s;
  hash.cell = Math.max(24, sepR);
  hash.clear();
  for (const m of S.moths) hash.insert(m, m.x, m.y);
  let lit = 0, level = 0, roamLevel = 0, active = 0;
  for (const m of S.moths) {
    const pr = sampleLight(m.x, m.y);
    feelLight(m, pr);
    think(m, pr, dt);
    steer.ax = 0; steer.ay = 0;
    const roaming = m.state === 'roam';
    if (roaming || m.state === 'seek') active++;
    if (m.dest && (roaming || m.state === 'seek')) {
      let dx = m.dest.x - m.x, dy = m.dest.y - m.y;
      const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
      // a roaming moth flutters freely inside its band; one that slipped out heads straight back in
      const free = roaming && m.L >= m.floorL;
      // now and then a free moth throws a quick, curious loop: a curl that keeps its speed and still
      // drifts on toward its spot (steered hard enough to follow the turn, so it never stalls in place)
      if (free && m.loopT <= 0 && Math.random() < dt * 0.25 * restless) { m.loopT = rand(0.7, 0.95); m.loopA = 0; m.spin = Math.random() < 0.5 ? -1 : 1; }
      const looping = m.loopT > 0;
      if (looping) {
        m.loopT -= dt; m.loopA += m.spin * dt * 8;
        const c = Math.cos(m.loopA), sn = Math.sin(m.loopA), rx = dx * c - dy * sn + dx * 0.6;
        dy = dx * sn + dy * c + dy * 0.6; dx = rx;
      }
      const wob = (Math.sin(t * 9.3 + m.p1) * 0.6 + Math.sin(t * 23.7 + m.p2) * 0.4) * (free ? 0.9 : roaming ? 0.4 : 0.75 * clamp(d / (170 * s), 0.25, 1));
      const v = (roaming ? roamV : seekV * clamp(d / (70 * s), 0.55, 1)) * (0.88 + 0.24 * Math.sin(t * 3.1 + m.p3));
      const tx = dx * v - dy * wob * v, ty = dy * v + dx * wob * v;
      const k = looping ? 12 : free ? 3.2 : roaming ? 5.5 : 4.5 * pull;
      steer.ax += (tx - m.vx) * k; steer.ay += (ty - m.vy) * k;
      avoidObstacles(m, 55 * s, (roaming ? 520 : 700) * s, steer);
      if (Math.random() < dt * (free ? 1.6 : roaming ? 0 : 1.2)) { const j = rand(-1, 1) * (free ? 85 : 70) * s; m.vx += -dy * j; m.vy += dx * j; }
    } else if (m.state === 'lost') {
      m.lostT -= dt;

      m.vx *= damp; m.vy *= damp;
      m.h += m.spin * 7 * dt;
      if (m.lostT <= 0) { m.state = 'wander'; m.wh = m.h; }
    } else {
      m.wh += (Math.sin(t * 0.53 + m.p1) * 1.1 + Math.sin(t * 1.37 + m.p2) * 0.7) * dt;
      const ex = (m.x - rcx) / (R.w / 2), ey = (m.y - rcy) / (R.h / 2);
      if (ex * ex + ey * ey > 0.42) m.wh = U.angleLerp(m.wh, Math.atan2(rcy - m.y, rcx - m.x), 1 - Math.exp(-dt * 1.3));
      const v = wanderV * (0.85 + 0.3 * Math.sin(t * 0.9 + m.p3));
      steer.ax += (Math.cos(m.wh) * v - m.vx) * 2.5; steer.ay += (Math.sin(m.wh) * v - m.vy) * 2.5;
      avoidObstacles(m, 50 * s, 220 * s, steer);
    }
    // separation spreads a swarm over its band instead of collapsing it into one dot
    sepM = m; sepAx = 0; sepAy = 0; sepN = 0;
    hash.query(m.x, m.y, 2 * sepR, sepVisit);
    m.crowd += (sepN - m.crowd) * (1 - Math.exp(-dt * 3));
    const sepK = (roaming ? 1300 : 900) * s;
    steer.ax += sepAx * sepK; steer.ay += sepAy * sepK;

    m.vx += steer.ax * dt; m.vy += steer.ay * dt;
    const maxV = roaming ? roamV * 1.9 : m.state === 'seek' ? seekV * 1.6 : 260 * s * spd;
    const sp = Math.hypot(m.vx, m.vy);
    if (sp > maxV) { m.vx *= maxV / sp; m.vy *= maxV / sp; }
    moveMoth(m, dt, rad);

    if (m.state !== 'lost' && sp > 4) m.h = U.angleLerp(m.h, Math.atan2(m.vy, m.vx), 1 - Math.exp(-dt * 11));
    // in an overlap it glows brighter and flaps faster
    m.boost += (clamp(m.n - 1, 0, 2) - m.boost) * (1 - Math.exp(-dt * 4));
    const rate = roaming ? 13 + 3.5 * m.boost : m.state === 'seek' ? 16 + 2 * m.boost : m.state === 'lost' ? 4.5 : 7.5;
    m.flap += dt * TAU * rate * (0.9 + 0.2 * Math.sin(m.p3));
    m.glow += ((roaming || m.state === 'seek' ? 1 : 0) - m.glow) * (1 - Math.exp(-dt * 5));
    m.squash = Math.max(0, m.squash - dt * 4);
    const f = m.fx;
    f.trail[f.th * 2] = m.x; f.trail[f.th * 2 + 1] = m.y;
    f.th = (f.th + 1) % TRAIL; f.tn = Math.min(TRAIL, f.tn + 1);
    if (m.n) {
      lit++;
      level = Math.max(level, m.n);
      if (roaming) roamLevel = Math.max(roamLevel, m.n);
    }
  }
  if (lit !== S.litCount) { S.litCount = lit; updateCounts(); }
  // band sizes follow the swarm: rebuild the map once the number of active moths has moved on
  if (Math.abs(active - MAP.active) > Math.max(2, 0.15 * MAP.active)) S.mapDirty = true;
  // the "Brightest" stat follows a level once it has held for a moment, so it does not flicker at band edges
  const lv = roamLevel || level;
  if (lv !== S.levelNext) { S.levelNext = lv; S.levelT = 0; } else S.levelT += dt;
  if (lv !== S.level && (S.levelT > 0.4 || S.level < 0)) { S.level = lv; showLevel(); }
}

// ================================================================== particles + dust
const PARTS = Array.from({ length: 700 }, () => ({ kind: 0, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 1, color: '#fff' }));
let partN = 0;
function emit(kind, x, y, vx, vy, life, size, color) {
  if (partN >= PARTS.length) return;
  const p = PARTS[partN++];
  p.kind = kind; p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = p.max = life; p.size = size; p.color = color;
}
function burst(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(0.35, 1) * speed * S.scale;
    emit(0, x, y, Math.cos(a) * v, Math.sin(a) * v, rand(0.35, 0.7), rand(2, 3.6) * S.scale, color);
  }
}
function ring(x, y, color, radius) { emit(1, x, y, 0, 0, 0.55, radius, color); }
function poof(x, y, r, color) {
  for (let i = 0; i < 10; i++) {
    const a = rand(0, TAU), v = rand(30, 90) * S.scale;
    emit(2, x + Math.cos(a) * r * 0.5, y + Math.sin(a) * r * 0.5, Math.cos(a) * v, Math.sin(a) * v, rand(0.4, 0.7), rand(0.4, 0.75) * r, color);
  }
  ring(x, y, color, r * 2);
}
function updateParticles(dt) {
  for (let i = 0; i < partN; i++) {
    const p = PARTS[i];
    p.life -= dt;
    if (p.life <= 0) { PARTS[i] = PARTS[partN - 1]; PARTS[partN - 1] = p; partN--; i--; continue; }
    const drag = Math.exp(-dt * (p.kind === 2 ? 4 : 3));
    p.vx *= drag; p.vy *= drag;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function makeMotes(n) {
  S.motes = Array.from({ length: n }, () => ({
    u: Math.random(), v: Math.random(), du: rand(-1, 1) * 0.006, dv: rand(-1, 1) * 0.006,
    ph: rand(0, TAU), f: rand(1.5, 4.5), sz: rand(0.6, 1.4), mask: 0, lit: 0,
  }));
}
function updateMotes(dt, t) {
  for (const d of S.motes) {
    d.u += (d.du + Math.sin(t * 0.31 + d.ph) * 0.003) * dt;
    d.v += (d.dv + Math.cos(t * 0.27 + d.ph * 1.3) * 0.003) * dt;
    if (d.u < 0) d.u += 1; else if (d.u > 1) d.u -= 1;
    if (d.v < 0) d.v += 1; else if (d.v > 1) d.v -= 1;
  }
}

// ================================================================== input
function updateHover(x, y) {
  const h = S.hover;
  h.handle = false; h.turn = false; h.lamp = null; h.obj = null; h.frame = false;
  const sl = S.selLamp, so = S.selObj;
  if (sl) {
    const L = handleLen();
    const hx = sl.ox + Math.cos(sl.angle) * L, hy = sl.oy + Math.sin(sl.angle) * L;
    if (U.dist(x, y, hx, hy) < knobHitR()) h.handle = true;
  } else if (so && isMirror(so)) {
    const k = mirrorKnob(so, S.drag && S.drag.kind === 'turn' ? S.drag.end : 0);
    if (U.dist(x, y, k.x, k.y) < knobHitR()) h.turn = true;
  }
  if (!h.handle && !h.turn) {
    const hitR = Math.max(18, S.band * 0.75);
    let bd = hitR;
    for (const l of S.lamps) { const d = U.dist(x, y, l.x, l.y); if (d < bd) { bd = d; h.lamp = l; } }
  }
  if (!h.handle && !h.turn && !h.lamp) {
    for (let i = S.obstacles.length - 1; i >= 0; i--) {
      if (overObject(S.obstacles[i], x, y)) { h.obj = S.obstacles[i]; break; }
    }
    if (!h.obj && inFrame(x, y)) {
      h.frame = true;
      const p = railAt(railNearest(x, y));
      const g = S.ghost;
      g.x = p.x; g.y = p.y; g.nx = p.nx; g.ny = p.ny; g.angle = Math.atan2(p.ny, p.nx);
    }
  }
  S.ghost.on = h.frame;
  let cur = 'default';
  if (S.drag) cur = 'grabbing';
  else if (h.handle || h.turn || h.lamp || h.obj) cur = 'grab';
  else if (h.frame) cur = S.lamps.length >= MAX_LAMPS ? 'not-allowed' : 'copy';
  if (cur !== S.cursor) { S.cursor = cur; Kit.canvas.style.cursor = cur; }
}

function selectLamp(l) {
  if (S.selLamp === l && !S.selObj) return;
  S.selLamp = l; S.selObj = null;
  if (l) { l.fx.pulse = Math.max(l.fx.pulse, 0.35); }
  refreshHint();
}
function selectObj(o) {
  S.selObj = o; S.selLamp = null;
  if (o) o.fx.flash = 1;
  refreshHint();
}
function deselect() {
  if (!S.selLamp && !S.selObj) return;
  S.selLamp = null; S.selObj = null;
  refreshHint();
}
function cycleLamp(dir) {
  if (!S.lamps.length) return;
  const i = S.lamps.indexOf(S.selLamp);
  const n = S.lamps.length;
  const next = S.lamps[i < 0 ? (dir > 0 ? 0 : n - 1) : (i + dir + n) % n];
  selectLamp(next);
  next.fx.pulse = 0.6;
  Kit.sfx('click', { pitch: 1.3 });
}
function deleteSelected() {
  if (S.selLamp) removeLamp(S.selLamp);
  else if (S.selObj) removeObstacle(S.selObj);
}

function pointerDown(p) {
  updateHover(p.x, p.y);
  const h = S.hover;
  if (p.button === 2) {
    if (h.lamp) removeLamp(h.lamp);
    else if (h.obj) removeObstacle(h.obj);
    updateHover(p.x, p.y);
    return;
  }
  if (p.button !== 0) return;
  if (h.handle) {
    S.drag = { kind: 'aim', lamp: S.selLamp };
  } else if (h.turn) {
    S.drag = { kind: 'turn', obj: S.selObj, end: mirrorKnob(S.selObj).end };
    Kit.sfx('click', { pitch: 1.1 });
  } else if (h.lamp) {
    selectLamp(h.lamp);
    S.drag = { kind: 'lamp', lamp: h.lamp, sx: p.x, sy: p.y, moved: false };
    Kit.sfx('click', { pitch: 1.2 });
  } else if (h.obj) {
    const o = h.obj;
    selectObj(o);
    S.drag = { kind: 'obj', obj: o, offx: o.bx - p.x, offy: o.by - p.y, sx: p.x, sy: p.y, moved: false };
    Kit.sfx('click', { pitch: 0.7 });
  } else if (h.frame) {
    addLampAt(p.x, p.y, S.color);
  } else {
    deselect();
  }
  updateHover(p.x, p.y);
}

function pointerMove(p) {
  const d = S.drag;
  // the button came up where the canvas never heard it (focus lost mid-drag): drop the drag
  if (d && !(p.buttons & 1)) { pointerUp(p); return; }
  if (d) {
    if (d.kind === 'aim') {
      const l = d.lamp;
      setAim(l, angleDiff(Math.atan2(l.ny, l.nx), Math.atan2(p.y - l.oy, p.x - l.ox)));
    } else if (d.kind === 'turn') {
      // the grabbed end follows the pointer round the mirror's centre (whole degrees with Shift)
      const o = d.obj;
      let a = Math.atan2(p.y - o.by, p.x - o.bx) + (d.end < 0 ? Math.PI : 0);
      if (p.shift) a = Math.round(a / DEG) * DEG;
      const da = angleDiff(o.rot, a);
      if (Math.abs(da) > 1e-5) rotateObstacle(o, da);
    } else if (d.kind === 'lamp') {
      if (!d.moved && U.dist(p.x, p.y, d.sx, d.sy) < 4) return;
      d.moved = true;
      const l = d.lamp, before = l.u;
      l.u = railNearest(p.x, p.y) / S.railLen;
      placeLamp(l);
      if (Math.abs(before - l.u) > 0.002) Kit.sfx('click', { gap: 90, vol: 0.22, pitch: 0.8 + l.u * 0.6 });
    } else if (d.kind === 'obj') {
      if (!d.moved && U.dist(p.x, p.y, d.sx, d.sy) < 3) return;
      d.moved = true;
      moveObstacleTo(d.obj, p.x + d.offx, p.y + d.offy);
    }
    return;
  }
  updateHover(p.x, p.y);
}

function pointerUp(p) {
  const d = S.drag;
  if (d && d.moved) Kit.sfx('place', { pitch: d.kind === 'obj' ? 0.65 : 0.8, vol: 0.5 });
  S.drag = null;
  updateHover(p.x, p.y);
}

function wheel(p, e) {
  updateHover(p.x, p.y);
  let d = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if (e.deltaMode === 1) d *= 33;
  const steps = clamp(d / 100, -3, 3);
  if (!steps) return;
  const h = S.hover;
  const l = h.lamp || h.handle ? (h.lamp || S.selLamp) : (!h.obj ? S.selLamp : null);

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toy</title>
<link rel="stylesheet" href="kit.css">
</head>
<body>
<script src="kit.js"></script>
<script>
'use strict';
(function () {
  const U = Kit.util;
  const TAU = U.TAU;

  // ================================================================ config
  const PITCH = 4;                    // maze cell pitch in tiles: 1 wall + 3 corridor
  const COLONY = ['#ff3b30', '#0a84ff', '#ffd60a', '#34c759', '#af52de'];
  const COLONY_NAME = ['Red', 'Blue', 'Yellow', 'Green', 'Purple'];
  const NUM = ['no', 'one', 'two', 'three', 'four', 'five'];
  const DEF = { nests: 3, perNest: 25, speed: 3, vision: 14, bites: 20, trail: true, sight: false };
  const MAX_FLAGS = 3;
  const ANT_R = 0.22;                 // collision radius, tiles
  const TOUCH_R = 0.6;                // ant to cube centre distance that counts as a touch
  const HOME_R = 0.9;                 // ant to nest centre distance that counts as home
  const FLAG_R = 1.8;                 // flag counting radius
  const MILL_R = 2.4;                 // how far idle ants wander from the nest
  const SEP_R = 0.62, LANE_R = 1.0, WALL_FEEL = 0.55;
  const CUBE_MARGIN = 0.42;           // cubes keep this far from walls
  const CUBE_SPR = 1.5;               // cube sprite box, tiles
  const PAINT_STEP = 2;               // tiles between painted cubes
  const TRAIL_CAP = 6000, TRAIL_LIFE = 4, TRAIL_BUCKETS = 3;
  const TRAIL_ALPHA = [0.5, 0.3, 0.14];
  const PART_CAP = 600;
  const SHAPE = { bg: '#1c1c22', floor: '#0d0d10', wall: '#2c2c34', mid: '#5a5a66', light: '#9a9aa6', white: '#ffffff', red: '#ff3b30', yellow: '#ffd60a' };
  const ANT_DARK = '#2e170b';
  const ICON_CUBE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l7.5 4.2v8.6L12 20.5l-7.5-4.2V7.7z"/><path d="M4.5 7.7L12 12l7.5-4.3M12 12v8.5"/></svg>';
  const ICON_DIAMOND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l8.5 8.5-8.5 8.5L3.5 12z"/></svg>';
  const tw = (id) => (id in Kit.tweaks ? Kit.tweaks[id] : DEF[id]);
  const word = (sprite, abstract) => Kit.pick(sprite, abstract);

  // ================================================================ state
  let ready = false, firstReset = true, silent = false;
  let seed = 0, cols = 0, rows = 0;
  let grid = null;                    // Uint8Array, 1 = wall
  let kind = null;                    // per tile: 0 open, 1 hedge, 2 pebble
  let plazas = [];
  let fields = [];                    // per base: { dist, wp } for the way home
  let T = 20, OX = 0, OY = 0;         // tile size (px) and map origin
  const bases = [], ants = [], cubes = [], flags = [];
  let simTime = 0, totalBites = 0, nextCubeId = 1;
  let fxTime = 0;                     // real-time clock for feedback, so it plays even while paused
  let tool = 'sugar';
  const seenOnce = { wall: false, eaten: false, flagHit: false, flagFull: false };
  let ui = {};

  // ================================================================ map generation
  function hash(i, k) {
    let h = (Math.imul(i, 374761393) + Math.imul(k, 668265263) + Math.imul(seed, 1274126177)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  /** Coarse recursive-backtracker maze with loops, plazas, bulges and pebbles; returns tile grids. */
  function genMaze(sd, nCx, nCy) {
    const rnd = U.mulberry32(sd);
    const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
    const C = 1 + nCx * PITCH, R = 1 + nCy * PITCH;
    const g = new Uint8Array(C * R).fill(1);
    const kd = new Uint8Array(C * R);
    const carve = (x0, y0, x1, y1) => {
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { g[y * C + x] = 0; kd[y * C + x] = 0; }
    };
    for (let j = 0; j < nCy; j++) for (let i = 0; i < nCx; i++) carve(1 + i * PITCH, 1 + j * PITCH, i * PITCH + 3, j * PITCH + 3);
    // walls between cells: east[i,j] separates (i,j)-(i+1,j), south[i,j] separates (i,j)-(i,j+1)
    const east = new Uint8Array(nCx * nCy).fill(1), south = new Uint8Array(nCx * nCy).fill(1);
    const openEast = (i, j) => { east[j * nCx + i] = 0; carve((i + 1) * PITCH, 1 + j * PITCH, (i + 1) * PITCH, j * PITCH + 3); };
    const openSouth = (i, j) => { south[j * nCx + i] = 0; carve(1 + i * PITCH, (j + 1) * PITCH, i * PITCH + 3, (j + 1) * PITCH); };

    const seen = new Uint8Array(nCx * nCy);
    const stack = [ri(0, nCx * nCy - 1)];
    seen[stack[0]] = 1;
    const nb = [];
    while (stack.length) {
      const c = stack[stack.length - 1], i = c % nCx, j = (c / nCx) | 0;
      nb.length = 0;
      if (i > 0 && !seen[c - 1]) nb.push(c - 1);
      if (i < nCx - 1 && !seen[c + 1]) nb.push(c + 1);
      if (j > 0 && !seen[c - nCx]) nb.push(c - nCx);
      if (j < nCy - 1 && !seen[c + nCx]) nb.push(c + nCx);
      if (!nb.length) { stack.pop(); continue; }
      const n = nb[Math.floor(rnd() * nb.length)];
      if (n === c + 1) openEast(i, j); else if (n === c - 1) openEast(i - 1, j);
      else if (n === c + nCx) openSouth(i, j); else openSouth(i, j - 1);
      seen[n] = 1;
      stack.push(n);
    }
    // loops: knock out about a quarter of the walls still standing
    for (let j = 0; j < nCy; j++) for (let i = 0; i < nCx; i++) {
      if (i < nCx - 1 && east[j * nCx + i] && rnd() < 0.25) openEast(i, j);
      if (j < nCy - 1 && south[j * nCx + i] && rnd() < 0.25) openSouth(i, j);
    }
    // plazas: cleared blocks of 2x2 or 3x2 cells, kept apart
    const pl = [];
    const plazaCell = new Uint8Array(nCx * nCy);
    const want = ri(3, 5);
    for (let tries = 0; pl.length < want && tries < 80; tries++) {
      const w = ri(2, 3), h = rnd() < 0.75 ? 2 : 3;
      if (w > nCx || h > nCy) continue;
      const i0 = ri(0, nCx - w), j0 = ri(0, nCy - h);
      if (pl.some((p) => i0 <= p.i + p.w && i0 + w >= p.i && j0 <= p.j + p.h && j0 + h >= p.j)) continue;
      pl.push({ i: i0, j: j0, w, h });
      for (let j = j0; j < j0 + h; j++) for (let i = i0; i < i0 + w; i++) {
        plazaCell[j * nCx + i] = 1;
        if (i < i0 + w - 1) east[j * nCx + i] = 0;
        if (j < j0 + h - 1) south[j * nCx + i] = 0;
      }
      carve(1 + i0 * PITCH, 1 + j0 * PITCH, (i0 + w - 1) * PITCH + 3, (j0 + h - 1) * PITCH + 3);
    }
    // isolated wall posts: most go, the rest become pebbles
    for (let j = 0; j < nCy - 1; j++) for (let i = 0; i < nCx - 1; i++) {
      const t = ((j + 1) * PITCH) * C + (i + 1) * PITCH;
      if (!g[t]) continue;
      const free = !east[j * nCx + i] && !east[(j + 1) * nCx + i] && !south[j * nCx + i] && !south[j * nCx + i + 1];
      if (free) { if (rnd() < 0.8) g[t] = 0; else kd[t] = 2; }
    }
    // bulges: a standing wall grows into one neighbour cell (at most one per cell) for an organic edge
    const bulged = new Uint8Array(nCx * nCy);
    const grow = (x0, y0, dx, dy, len) => { for (let k = 0; k < len; k++) { const t = (y0 + dy * k) * C + x0 + dx * k; g[t] = 1; kd[t] = 0; } };
    for (let j = 0; j < nCy; j++) for (let i = 0; i < nCx; i++) {
      const tryBulge = (ci, cj, x0, y0, dx, dy) => {
        const cc = cj * nCx + ci;
        if (bulged[cc] || plazaCell[cc]) return;
        bulged[cc] = 1;
        const r = rnd(), len = r < 0.5 ? 3 : 2, off = len === 2 && r > 0.75 ? 1 : 0;
        grow(x0 + dx * off, y0 + dy * off, dx, dy, len);
      };
      if (i < nCx - 1 && east[j * nCx + i] && rnd() < 0.2) {
        if (rnd() < 0.5) tryBulge(i, j, i * PITCH + 3, 1 + j * PITCH, 0, 1);
        else tryBulge(i + 1, j, (i + 1) * PITCH + 1, 1 + j * PITCH, 0, 1);
      }
      if (j < nCy - 1 && south[j * nCx + i] && rnd() < 0.2) {
        if (rnd() < 0.5) tryBulge(i, j, 1 + i * PITCH, j * PITCH + 3, 1, 0);
        else tryBulge(i, j + 1, 1 + i * PITCH, (j + 1) * PITCH + 1, 1, 0);
      }
    }
    // pebble clusters inside plazas
    const plz = pl.map((p) => {
      const x0 = 1 + p.i * PITCH, y0 = 1 + p.j * PITCH, x1 = (p.i + p.w - 1) * PITCH + 3, y1 = (p.j + p.h - 1) * PITCH + 3;
      if (rnd() < 0.75) {
        const rx = ri(x0 + 2, x1 - 2), ry = ri(y0 + 2, y1 - 2);
        const set = (x, y) => { g[y * C + x] = 1; kd[y * C + x] = 2; };
        set(rx, ry);
        const extra = ri(0, 2);
        for (let k = 0; k < extra; k++) {
          const d = ri(0, 3), x = rx + [1, -1, 0, 0][d], y = ry + [0, 0, 1, -1][d];
          if (x > x0 + 1 && x < x1 - 1 && y > y0 + 1 && y < y1 - 1) set(x, y);
        }
      }
      return { x0, y0, x1, y1, cx: Math.floor((x0 + x1) / 2), cy: Math.floor((y0 + y1) / 2) };
    });
    // keep only the largest connected open region
    const comp = new Int32Array(C * R).fill(-1);
    const q = new Int32Array(C * R);
    let best = -1, bestN = 0, id = 0;
    for (let s = 0; s < C * R; s++) {
      if (g[s] || comp[s] >= 0) continue;
      let h = 0, t = 0;
      q[t++] = s; comp[s] = id;
      while (h < t) {
        const c = q[h++], x = c % C;
        if (x > 0 && !g[c - 1] && comp[c - 1] < 0) { comp[c - 1] = id; q[t++] = c - 1; }
        if (x < C - 1 && !g[c + 1] && comp[c + 1] < 0) { comp[c + 1] = id; q[t++] = c + 1; }
        if (c >= C && !g[c - C] && comp[c - C] < 0) { comp[c - C] = id; q[t++] = c - C; }
        if (c < C * (R - 1) && !g[c + C] && comp[c + C] < 0) { comp[c + C] = id; q[t++] = c + C; }
      }
      if (t > bestN) { bestN = t; best = id; }
      id++;
    }
    for (let s = 0; s < C * R; s++) {
      if (!g[s] && comp[s] !== best) { g[s] = 1; kd[s] = 0; }
      if (g[s] && kd[s] !== 2) kd[s] = 1;
      const x = s % C, y = (s / C) | 0;
      if (x === 0 || y === 0 || x === C - 1 || y === R - 1) kd[s] = 1;
    }
    return { grid: g, kind: kd, cols: C, rows: R, plazas: plz };
  }

  // ================================================================ grid queries, line of sight
  const wallAt = (x, y) => x < 0 || y < 0 || x >= cols || y >= rows || grid[y * cols + x] === 1;
  const wallPt = (tx, ty) => wallAt(Math.floor(tx), Math.floor(ty));
  const inMap = (tx, ty) => tx >= 0 && ty >= 0 && tx < cols && ty < rows;

  /** Supercover grid raycast: true if no wall tile lies on the segment. */
  function los(x0, y0, x1, y1) {
    let ix = Math.floor(x0), iy = Math.floor(y0);
    const ex = Math.floor(x1), ey = Math.floor(y1);
    if (wallAt(ix, iy) || wallAt(ex, ey)) return false;
    const dx = x1 - x0, dy = y1 - y0;
    const sx = dx > 0 ? 1 : -1, sy = dy > 0 ? 1 : -1;
    const tdx = dx !== 0 ? Math.abs(1 / dx) : Infinity, tdy = dy !== 0 ? Math.abs(1 / dy) : Infinity;
    let tmx = dx > 0 ? (ix + 1 - x0) * tdx : dx < 0 ? (x0 - ix) * tdx : Infinity;
    let tmy = dy > 0 ? (iy + 1 - y0) * tdy : dy < 0 ? (y0 - iy) * tdy : Infinity;
    let n = Math.abs(ex - ix) + Math.abs(ey - iy);
    while (n > 0) {
      if (Math.abs(tmx - tmy) < 1e-9) {
        if (wallAt(ix + sx, iy) || wallAt(ix, iy + sy)) return false; // grazing a corner counts as blocked
        ix += sx; iy += sy; tmx += tdx; tmy += tdy; n -= 2;
      } else if (tmx < tmy) { ix += sx; tmx += tdx; n--; } else { iy += sy; tmy += tdy; n--; }
      if (wallAt(ix, iy)) return false;
    }
    return true;
  }
  /** Line of sight for a body of half-width w (three parallel rays). */
  function losWide(x0, y0, x1, y1, w) {
    if (!los(x0, y0, x1, y1)) return false;
    const dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy);
    if (d < 1e-6) return true;
    const nx = (-dy / d) * w, ny = (dx / d) * w;
    return los(x0 + nx, y0 + ny, x1 + nx, y1 + ny) && los(x0 - nx, y0 - ny, x1 - nx, y1 - ny);
  }
  function canSee(a, c) {
    const dx = c.tx - a.tx, dy = c.ty - a.ty, v = tw('vision');
    return dx * dx + dy * dy <= v * v && los(a.tx, a.ty, c.tx, c.ty);
  }
  /** Nudge a point out of wall margins; returns a shared {x,y} or null when the point is in a wall. */
  const FIT = { x: 0, y: 0 };
  function fitPoint(tx, ty, r) {
    if (!inMap(tx, ty) || wallPt(tx, ty)) return null;
    let x = tx, y = ty;
    for (let it = 0; it < 3; it++) {
      const ix = Math.floor(x), iy = Math.floor(y);
      for (let yy = iy - 1; yy <= iy + 1; yy++) for (let xx = ix - 1; xx <= ix + 1; xx++) {
        if (!wallAt(xx, yy)) continue;
        const qx = x < xx ? xx : x > xx + 1 ? xx + 1 : x, qy = y < yy ? yy : y > yy + 1 ? yy + 1 : y;
        const ex = x - qx, ey = y - qy, e = Math.hypot(ex, ey);
        if (e < r && e > 1e-6) { x += (ex / e) * (r - e); y += (ey / e) * (r - e); }
      }
    }
    if (wallPt(x, y)) return null;
    FIT.x = x; FIT.y = y;
    return FIT;
  }

  // ================================================================ way home: BFS distance + string-pulled waypoints
  function downhill(c, dist) {
    const x = c % cols, y = (c / cols) | 0;
    let best = c, bd = dist[c];
    const test = (t) => { if (dist[t] >= 0 && dist[t] < bd) { bd = dist[t]; best = t; } };
    if (x > 0) test(c - 1);
    if (x < cols - 1) test(c + 1);
    if (y > 0) test(c - cols);
    if (y < rows - 1) test(c + cols);
    for (let dy = -1; dy <= 1; dy += 2) for (let dx = -1; dx <= 1; dx += 2) {
      if (!wallAt(x + dx, y) && !wallAt(x, y + dy) && !wallAt(x + dx, y + dy)) test(c + dy * cols + dx);
    }
    return best;
  }
  function buildField(b) {
    const N = cols * rows, dist = new Int32Array(N).fill(-1), q = new Int32Array(N);
    let h = 0, t = 0;
    dist[b.tile] = 0; q[t++] = b.tile;
    while (h < t) {
      const c = q[h++], x = c % cols, nd = dist[c] + 1;
      if (x > 0 && !grid[c - 1] && dist[c - 1] < 0) { dist[c - 1] = nd; q[t++] = c - 1; }
      if (x < cols - 1 && !grid[c + 1] && dist[c + 1] < 0) { dist[c + 1] = nd; q[t++] = c + 1; }
      if (c >= cols && !grid[c - cols] && dist[c - cols] < 0) { dist[c - cols] = nd; q[t++] = c - cols; }
      if (c < N - cols && !grid[c + cols] && dist[c + cols] < 0) { dist[c + cols] = nd; q[t++] = c + cols; }
    }
    const wp = new Int32Array(N).fill(-1);
    const chain = new Int32Array(16);
    for (let c = 0; c < N; c++) {
      if (dist[c] < 0) continue;
      let cur = c, n = 0;
      while (n < 16 && dist[cur] > 0) { cur = downhill(cur, dist); chain[n++] = cur; }
      if (!n) { wp[c] = c; continue; }
      const x0 = (c % cols) + 0.5, y0 = ((c / cols) | 0) + 0.5;
      let pick = chain[0];
      for (let k = 1; k < n; k++) {
        const w = chain[k];
        if (losWide(x0, y0, (w % cols) + 0.5, ((w / cols) | 0) + 0.5, 0.3)) pick = w; else break;
      }
      wp[c] = pick;
    }
    return { dist, wp };
  }

  // ================================================================ entities
  class Base {
    constructor(i, tx, ty) { this.index = i; this.tx = tx; this.ty = ty; this.color = COLONY[i]; this.stored = 0; this.pulse = 0; }
    get x() { return OX + this.tx * T; }
    get y() { return OY + this.ty * T; }
    get tile() { return Math.floor(this.ty) * cols + Math.floor(this.tx); }
    // lets tests use either ant.base.x or bases[ant.base]
    valueOf() { return this.index; }
    toString() { return String(this.index); }
  }

  class Ant {
    constructor(base) {
      this.base = base;
      this.tx = base.tx; this.ty = base.ty;
      this.h = Math.random() * TAU; this.hc = 1; this.hs = 0; this.v = 0;
      this.state = 'home'; this.target = null; this.visited = new Set();
      this.carry = false; this.hidden = false; this.hideT = 0; this.vis = 1; this.goHole = false;
      this.scanT = Math.random() * 0.25; this.lost = 0;
      this.sf = U.rand(0.86, 1.14);                  // personal speed factor
      this.zf = U.rand(2.4, 3.8); this.zp = Math.random() * TAU; this.nz = 0; // zig-zag
      this.phase = Math.random() * TAU; this.pause = 0;
      this.mx = base.tx; this.my = base.ty; this.millT = 0;
      this.sepX = 0; this.sepY = 0; this.unstuck = 0; this.stuckT = 0; this.bestM = Infinity;
      this.flagMask = 0; this.trailAcc = 0; this.seekT = 0;
    }
    get x() { return OX + this.tx * T; }
    set x(v) { this.tx = (v - OX) / T; }
    get y() { return OY + this.ty * T; }
    set y(v) { this.ty = (v - OY) / T; }
  }

  class Cube {
    constructor(tx, ty) { this.id = nextCubeId++; this.tx = tx; this.ty = ty; this.bites = 0; this.born = fxTime; this.hit = 0; this.dead = false; this.r = Math.random(); }
    get x() { return OX + this.tx * T; }
    get y() { return OY + this.ty * T; }
  }

  class Flag {
    constructor(tx, ty, slot) { this.slot = slot; this.bit = 1 << slot; this.tx = tx; this.ty = ty; this.count = 0; this.born = fxTime; this.hit = 0; }
    get x() { return OX + this.tx * T; }
    get y() { return OY + this.ty * T; }
  }

  // ---------------------------------------------------------------- particles (pooled)
  const P_CRUMB = 0, P_PUFF = 1, P_RING = 2, P_SPARK = 3, P_GRAIN = 4, P_DUST = 5;
  const parts = [];
  for (let i = 0; i < PART_CAP; i++) parts.push({ on: false, type: 0, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 0, color: '#fff', rot: 0 });
  let partIdx = 0;
  function spawn(type, x, y, vx, vy, life, size, color) {
    if (silent) return;
    const p = parts[partIdx];
    partIdx = (partIdx + 1) % PART_CAP;
    p.on = true; p.type = type; p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = life; p.max = life; p.size = size; p.color = color || '#fff'; p.rot = Math.random() * TAU;
  }
  function burst(type, x, y, n, speed, life, size, color) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = speed * U.rand(0.4, 1);
      spawn(type, x, y, Math.cos(a) * s, Math.sin(a) * s, life * U.rand(0.7, 1.2), size * U.rand(0.7, 1.2), color);
    }
  }
  function updateParticles(dt) {
    for (let i = 0; i < PART_CAP; i++) {
      const p = parts[i];
      if (!p.on) continue;
      p.life -= dt;
      if (p.life <= 0) { p.on = false; continue; }
      const f = Math.exp(-dt * 5);
      p.vx *= f; p.vy *= f;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += dt * 4;
    }
  }

  // ---------------------------------------------------------------- scent trail (ring buffer, tile units)
  const TR = { x: new Float32Array(TRAIL_CAP), y: new Float32Array(TRAIL_CAP), t: new Float32Array(TRAIL_CAP).fill(-1e9), c: new Uint8Array(TRAIL_CAP), i: 0 };
  function pushTrail(x, y, c) {
    const i = TR.i;
    TR.x[i] = x; TR.y[i] = y; TR.t[i] = simTime; TR.c[i] = c;
    TR.i = (i + 1) % TRAIL_CAP;
  }

  // ================================================================ world setup
  function randomSeed() { return 10000 + Math.floor(Math.random() * 89999); }

  function newMap(sd, opts = {}) {
    seed = sd != null && isFinite(sd) ? Math.abs(Math.floor(sd)) % 1000000 : randomSeed();
    const pr = Kit.playRect;
    const tt = U.clamp(pr.w / 60, 18, 24);
    const nCx = Math.max(6, Math.round((pr.w / tt - 1) / PITCH));
    const nCy = Math.max(4, Math.round((pr.h / tt - 1) / PITCH));
    const m = genMaze(seed, nCx, nCy);
    grid = m.grid; kind = m.kind; cols = m.cols; rows = m.rows; plazas = m.plazas;
    cubes.length = 0;
    flags.length = 0;
    placeBases(tw('nests'));
    clearFx();
    if (!opts.quiet) {
      Kit.sfx('whoosh', { pitch: 1.25 });
      Kit.toast('New map · seed ' + seed, { tone: 'info' });
    }
    if (ui.seedNote) { ui.seedNote.label = 'Map seed ' + seed; Kit.rebuildTweaks(); }
    layout({ crossfade: !opts.quiet });
    syncStats(true);
    return seed;
  }

  function placeBases(n) {
    const rnd = U.mulberry32(Math.imul(seed, 31) + n * 7919);
    const cand = [];
    for (let y = 2; y < rows - 2; y++) for (let x = 2; x < cols - 2; x++) {
      let ok = true;
      for (let dy = -1; dy <= 1 && ok; dy++) for (let dx = -1; dx <= 1; dx++) if (grid[(y + dy) * cols + x + dx]) { ok = false; break; }
      if (ok) cand.push(y * cols + x);
    }
    bases.length = 0;
    for (let k = 0; k < n && cand.length; k++) {
      let best = cand[Math.floor(rnd() * cand.length)], bestScore = -1;
      if (k > 0) {
        for (let s = 0; s < 80; s++) {
          const c = cand[Math.floor(rnd() * cand.length)], x = c % cols, y = (c / cols) | 0;
          let md = 1e9;
          for (const b of bases) md = Math.min(md, Math.hypot(b.tx - x - 0.5, b.ty - y - 0.5));
          // spread out, but keep a little away from the outer hedge
          const edge = Math.min(x, y, cols - 1 - x, rows - 1 - y);
          const score = md - (edge < 4 ? (4 - edge) * 1.5 : 0) + rnd() * 2;
          if (score > bestScore) { bestScore = score; best = c; }
        }
      }
      bases.push(new Base(k, (best % cols) + 0.5, ((best / cols) | 0) + 0.5));
    }
    fields = bases.map(buildField);
    for (const f of flags) f.count = 0;
    spawnAll();
  }

  function spawnAll() {
    ants.length = 0;
    for (const b of bases) for (let i = 0; i < tw('perNest'); i++) spawnAnt(b, Math.random() < 0.45);
  }
  function spawnAnt(b, hidden) {
    const a = new Ant(b);
    if (hidden) { a.hidden = true; a.vis = 0; a.hideT = U.rand(0.3, 4); }
    else { pickMill(a); a.tx = a.mx; a.ty = a.my; a.millT = U.rand(0, 2); pickMill(a); }
    ants.push(a);
    return a;
  }
  /** Match the ant count of every nest to the tweak (adds at the nest, removes idle ants first). */
  function syncAntCount() {
    const per = tw('perNest');
    for (const b of bases) {
      let mine = 0;
      for (const a of ants) if (a.base === b) mine++;
      while (mine < per) { spawnAnt(b, true).hideT = U.rand(0.1, 1.5); mine++; }
      for (let pass = 0; pass < 2 && mine > per; pass++) {
        for (let i = ants.length - 1; i >= 0 && mine > per; i--) {
          const a = ants[i];
          if (a.base !== b || (pass === 0 && a.state !== 'home')) continue;
          ants.splice(i, 1); mine--;
        }
      }
    }
  }

  function clearFx() {
    TR.t.fill(-1e9);
    for (const p of parts) p.on = false;
  }

  /** Example scene: four cubes leading from the first nest toward the nearest plaza, plus a flag on the way. */
  function placeExample() {
    if (!bases.length || !plazas.length) return;
    const b = bases[0], f = fields[0];
    const openNear = (p) => {
      let best = -1, bd = 1e9;
      for (let y = p.y0; y <= p.y1; y++) for (let x = p.x0; x <= p.x1; x++) {
        const t = y * cols + x;
        if (grid[t] || f.dist[t] < 0) continue;
        const d = Math.abs(x - p.cx) + Math.abs(y - p.cy);
        if (d < bd) { bd = d; best = t; }
      }
      return best;
    };
    let goal = -1, gs = Infinity;
    for (const p of plazas) {
      const t = openNear(p);
      if (t < 0) continue;
      // the nearest plaza with room for four spaced cubes, else the farthest one
      const d = f.dist[t], score = d >= 16 ? d : 1000 - d;
      if (score < gs) { gs = score; goal = t; }
    }
    if (goal < 0) return;
    // the string-pulled way home (goal → nest), reversed and sampled every 0.25 tiles; its legs keep
    // a wide line of sight, so cubes on it see each other and stay off the hedge corners
    const tc = (t) => [(t % cols) + 0.5, ((t / cols) | 0) + 0.5];
    const way = [];
    for (let cur = goal, n = 0; cur !== b.tile && n < 400; cur = f.wp[cur], n++) way.push(tc(cur));
    way.push([b.tx, b.ty]);
    way.reverse();
    const pts = [];
    for (let i = 1; i < way.length; i++) {
      const [x0, y0] = way[i - 1], [x1, y1] = way[i], n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 0.25));
      for (let k = 1; k <= n; k++) pts.push([x0 + ((x1 - x0) * k) / n, y0 + ((y1 - y0) * k) / n]);
    }
    // four cubes spread over the way, each within `gap` of the previous one and in its sight; a one-step
    // lookahead keeps a cube from landing just before a corner (which would force a tiny next hop)
    const gap = U.clamp((pts.length * 0.25) / 4, 3, 6);
    const at = (i) => (i < 0 ? [b.tx, b.ty] : pts[i]);
    const seen = (i) => {
      const [x0, y0] = at(i), out = [];
      for (let j = i + 1; j < pts.length; j++) {
        const [x, y] = pts[j], d = Math.hypot(x - x0, y - y0);
        if (d > gap) break;
        if (losWide(x0, y0, x, y, 0.3)) out.push(j);
      }
      return out;
    };
    const hop = (i, j) => Math.hypot(at(j)[0] - at(i)[0], at(j)[1] - at(i)[1]);
    const stops = [];
    for (let k = 0, idx = -1; k < 4; k++) {
      const cand = seen(idx);
      if (!cand.length) break;
      let pick = cand[cand.length - 1], best = -1;
      if (k < 3) {
        for (const j of cand) {
          const nx = seen(j), score = Math.min(hop(idx, j), nx.length ? hop(j, nx[nx.length - 1]) : 0);
          if (score >= best) { best = score; pick = j; }
        }
      }
      const c = addCube(pts[pick][0], pts[pick][1]);
      if (!c) break;
      stops.push(c);
      idx = pick;
    }
    if (stops.length >= 2) {
      const c0 = stops[stops.length - 2], c1 = stops[stops.length - 1];
      addFlag((c0.tx + c1.tx) / 2, (c0.ty + c1.ty) / 2);
    }
  }

  // ================================================================ simulation
  function pickMill(a) {
    const b = a.base;
    for (let k = 0; k < 8; k++) {
      const ang = Math.random() * TAU, r = U.rand(0.9, MILL_R);
      const x = b.tx + Math.cos(ang) * r, y = b.ty + Math.sin(ang) * r;
      if (fitPoint(x, y, 0.35) && Math.abs(FIT.x - x) + Math.abs(FIT.y - y) < 0.05 && los(b.tx, b.ty, x, y)) { a.mx = x; a.my = y; return; }
    }
    a.mx = b.tx + U.rand(-0.6, 0.6); a.my = b.ty + U.rand(-0.6, 0.6);
  }

  // scan scratch (reused, no per-scan allocation)
  const scanC = [], scanD = [];
  /** Closest cube this ant can see and has not bitten on this trip, or null. */
  function scan(a) {
    const n = cubes.length;
    if (!n) return null;
    const v = tw('vision'), r2 = v * v;
    let m = 0;
    for (let i = 0; i < n; i++) {
      const c = cubes[i];
      if (a.visited.has(c)) continue;
      const dx = c.tx - a.tx, dy = c.ty - a.ty, d2 = dx * dx + dy * dy;
      if (d2 > r2) continue;
      scanC[m] = c; scanD[m] = d2; m++;
    }
    // nearest first, with no cap: a far visible cube must still win over any number of hidden near ones
    for (let tries = 0; tries < m; tries++) {
      let k = -1, bd = Infinity;
      for (let i = 0; i < m; i++) if (scanD[i] < bd) { bd = scanD[i]; k = i; }
      if (k < 0) break;
      const c = scanC[k];
      if (los(a.tx, a.ty, c.tx, c.ty)) { scanC.length = 0; scanD.length = 0; return c; }
      scanD[k] = Infinity;
    }
    scanC.length = 0; scanD.length = 0;
    return null;
  }

  function setState(a, s) { a.state = s; a.bestM = Infinity; a.stuckT = 0; a.lost = 0; }
  function setSeek(a, c) {
    if (a.state !== 'seek') {
      if (a.state === 'home') {
        // a short, individual reaction delay turns a crowd into a stream
        if (a.hidden) a.hideT = Math.min(a.hideT, U.rand(0.15, 2.2));
        else { a.pause = Math.max(a.pause, Math.random() * Math.random() * 1.2); a.v = 0; }
        a.goHole = false;
      }
      setState(a, 'seek');
    }
    if (a.target !== c) { a.bestM = Infinity; a.stuckT = 0; a.seekT = 0; }
    a.target = c; a.lost = 0;
  }
  function giveUp(a) {
    a.target = null;
    if (a.state === 'seek') setState(a, a.hidden ? 'home' : 'return');
  }
  function retarget(a) {
    const c = scan(a);
    if (c) setSeek(a, c); else giveUp(a);
  }
  /** Periodic look-around (every 0.15–0.25 s per ant). */
  function think(a, interval) {
    if (!cubes.length) { if (a.state === 'seek') giveUp(a); return; }
    const c = scan(a);
    if (c) { setSeek(a, c); return; }
    // brief occlusion while sliding past a corner: keep going for one more look
    if (a.state === 'seek' && a.target && !a.target.dead && (a.lost += interval) < 0.45) return;
    if (a.state === 'seek') giveUp(a);
  }

  function bite(a, c) {
    c.bites++; totalBites++;
    c.hit = 1;
    a.visited.add(c);
    a.carry = true;
    a.pause = U.rand(0.16, 0.3);
    spawn(P_CRUMB, c.tx, c.ty - 0.15, U.rand(-1.6, 1.6), U.rand(-1.8, -0.4), 0.5, 0.09);
    spawn(P_CRUMB, c.tx, c.ty - 0.1, U.rand(-1.6, 1.6), U.rand(-1.2, 0.4), 0.45, 0.07);
    if (!silent) Kit.sfx('bite', { gap: 70, pitch: U.rand(0.85, 1.3), vol: 0.5 });
    if (c.bites >= tw('bites')) killCube(c, 'eaten');
    else retarget(a);
  }

  function arriveHome(a) {
    const b = a.base;
    if (a.carry) {
      a.carry = false;
      b.stored++;
      b.pulse = 1;
      spawn(P_RING, b.tx, b.ty, 0, 0, 0.5, 1.3, b.color);
      if (!silent) Kit.sfx('bloop', { gap: 140, vol: 0.22, pitch: U.rand(1.1, 1.5) });
      if (Math.random() < 0.5) a.goHole = true;
    }
    a.visited.clear();
    a.flagMask = 0;
    a.target = null;
    setState(a, 'home');
    a.millT = 0;
    const c = scan(a);
    if (c) setSeek(a, c);
  }

  function hide(a, dur) { a.hidden = true; a.hideT = dur; a.goHole = false; a.v = 0; }
  function emerge(a) {
    const b = a.base;
    a.hidden = false;
    a.tx = b.tx + U.rand(-0.12, 0.12); a.ty = b.ty + U.rand(-0.12, 0.12);
    a.h = a.state === 'seek' && a.target ? Math.atan2(a.target.ty - a.ty, a.target.tx - a.tx) : Math.random() * TAU;
    a.v = 0; a.millT = 0;
  }

  function countFlag(a, f) {
    a.flagMask |= f.bit;
    f.count++;
    f.hit = 1;
    spawn(P_RING, f.tx, f.ty, 0, 0, 0.6, 1.2, SHAPE.yellow);
    if (silent) return;
    Kit.sfx('join', { gap: 110, vol: 0.5, pitch: U.rand(0.95, 1.2) });
    if (!seenOnce.flagHit) { seenOnce.flagHit = true; Kit.toast(word('An ant reached the flag', 'An agent reached the goal'), { tone: 'good' }); }
  }

  // separation through Kit.SpatialHash (tile units); the visitor is defined once to avoid per-ant closures
  const spatial = new Kit.SpatialHash(1);
  let sepA = null, sepX = 0, sepY = 0;
  function sepVisit(b) {
    if (b === sepA || b.hidden) return;
    const dx = sepA.tx - b.tx, dy = sepA.ty - b.ty, d2 = dx * dx + dy * dy;
    if (d2 > LANE_R * LANE_R || d2 < 1e-8) return;
    const d = Math.sqrt(d2);
    if (d < SEP_R) { const f = (SEP_R - d) / SEP_R; sepX += (dx / d) * f; sepY += (dy / d) * f; }
    // oncoming traffic: both sidestep to their right, which sorts two-way streams into lanes
    const ca = sepA.hc, sa = sepA.hs;
    if (ca * b.hc + sa * b.hs < -0.4 && dx * ca + dy * sa < 0) {
      const f = (1 - d / LANE_R) * 0.75;
      sepX -= sa * f; sepY += ca * f;
    }
  }
  function computeSeparation() {
    spatial.clear();
    for (let i = 0; i < ants.length; i++) {
      const a = ants[i];
      a.hc = Math.cos(a.h); a.hs = Math.sin(a.h);
      if (!a.hidden) spatial.insert(a, a.tx, a.ty);
    }
    for (let i = 0; i < ants.length; i++) {
      const a = ants[i];
      if (a.hidden) continue;
      sepA = a; sepX = 0; sepY = 0;
      spatial.query(a.tx, a.ty, LANE_R, sepVisit);
      let sx = sepX * 2, sy = sepY * 2;
      const m = Math.hypot(sx, sy);
      if (m > 1.6) { sx *= 1.6 / m; sy *= 1.6 / m; }
      a.sepX = sx; a.sepY = sy;
    }
    sepA = null;
  }

  /** Push an ant's body out of wall tiles; rescue it if its centre ended inside one. */
  function collide(a) {
    for (let it = 0; it < 2; it++) {
      const ix = Math.floor(a.tx), iy = Math.floor(a.ty);
      if (wallAt(ix, iy)) { rescue(a); return; }
      for (let yy = iy - 1; yy <= iy + 1; yy++) for (let xx = ix - 1; xx <= ix + 1; xx++) {
        if (!wallAt(xx, yy)) continue;
        const qx = a.tx < xx ? xx : a.tx > xx + 1 ? xx + 1 : a.tx;
        const qy = a.ty < yy ? yy : a.ty > yy + 1 ? yy + 1 : a.ty;
        const ex = a.tx - qx, ey = a.ty - qy, e2 = ex * ex + ey * ey;
        if (e2 < ANT_R * ANT_R && e2 > 1e-10) { const e = Math.sqrt(e2), k = (ANT_R - e) / e; a.tx += ex * k; a.ty += ey * k; }
      }
    }
  }
  function rescue(a) {
    const ix = Math.floor(a.tx), iy = Math.floor(a.ty);
    let best = null, bd = Infinity;
    for (let r = 1; r <= 3 && !best; r++) {
      for (let yy = iy - r; yy <= iy + r; yy++) for (let xx = ix - r; xx <= ix + r; xx++) {
        if (wallAt(xx, yy)) continue;
        const cx = U.clamp(a.tx, xx + ANT_R, xx + 1 - ANT_R), cy = U.clamp(a.ty, yy + ANT_R, yy + 1 - ANT_R);
        const d = U.dist2(a.tx, a.ty, cx, cy);
        if (d < bd) { bd = d; best = [cx, cy]; }
      }
    }
    if (best) { a.tx = best[0]; a.ty = best[1]; } else { a.tx = a.base.tx; a.ty = a.base.ty; }
  }

  function stepAnts(h) {
    const spdBase = tw('speed');
    const STRIDE = TAU / (0.95 * 0.42); // one gait cycle per ~0.4 body lengths
    for (let i = 0; i < ants.length; i++) {
      const a = ants[i], b = a.base;
      a.scanT -= h;
      if (a.scanT <= 0) { const iv = U.rand(0.15, 0.25); a.scanT += iv; think(a, iv); }
      if (a.hidden) {
        a.vis = Math.max(0, a.vis - h * 6);
        if ((a.hideT -= h) <= 0) emerge(a);
        continue;
      }
      if (a.vis < 1) a.vis = Math.min(1, a.vis + h * 5);
      if (a.pause > 0) a.pause -= h;

      // goal for this state
      let gx, gy, spd = spdBase * a.sf, idle = false;
      if (a.state === 'seek' && a.target) { gx = a.target.tx; gy = a.target.ty; }
      else if (a.state === 'return') {
        const w = fields[b.index].wp[Math.floor(a.ty) * cols + Math.floor(a.tx)];
        if (w >= 0 && w !== b.tile) { gx = (w % cols) + 0.5; gy = ((w / cols) | 0) + 0.5; } else { gx = b.tx; gy = b.ty; }
      } else if (a.goHole) { gx = b.tx; gy = b.ty; spd *= 0.6; }
      else {
        if ((a.millT -= h) <= 0) { pickMill(a); a.millT = U.rand(1.2, 3.6); if (Math.random() < 0.2) a.goHole = true; }
        gx = a.mx; gy = a.my; spd *= 0.42;
        idle = U.dist2(a.tx, a.ty, gx, gy) < 0.09;
      }

      // steering: smooth turn toward the goal with an ant-like zig-zag
      const dx = gx - a.tx, dy = gy - a.ty, d = Math.sqrt(dx * dx + dy * dy);
      a.nz += ((Math.random() * 2 - 1) * 7 - a.nz * 3) * h;
      let want = d > 1e-4 ? Math.atan2(dy, dx) : a.h;
      // the zig-zag eases in after a new target, so a fresh line of sight is not wobbled away
      const zig = a.state === 'seek' ? Math.min(1, (a.seekT += h) / 0.8) : 1;
      want += (Math.sin(simTime * a.zf + a.zp) * 0.3 + a.nz * 0.1) * U.clamp(d - 0.4, 0, 1) * zig;
      const dA = U.angleDiff(a.h, want);
      const turn = Math.max(7, spd * 2.8) * h;
      a.h += dA > turn ? turn : dA < -turn ? -turn : dA;
      let vt = a.pause > 0 || idle ? 0 : spd * (1 - 0.55 * Math.min(1, Math.abs(dA) / 1.6));
      a.v += (vt - a.v) * Math.min(1, h * 7);
      const c = Math.cos(a.h), s = Math.sin(a.h);
      let vx = c * a.v, vy = s * a.v;
      if (a.unstuck > 0) a.unstuck -= h; else { vx += a.sepX; vy += a.sepY; }

      // walls push gently, so streams keep off the hedges
      const ix = Math.floor(a.tx), iy = Math.floor(a.ty);
      let rx = 0, ry = 0;
      for (let yy = iy - 1; yy <= iy + 1; yy++) for (let xx = ix - 1; xx <= ix + 1; xx++) {
        if (!wallAt(xx, yy)) continue;
        const qx = a.tx < xx ? xx : a.tx > xx + 1 ? xx + 1 : a.tx;
        const qy = a.ty < yy ? yy : a.ty > yy + 1 ? yy + 1 : a.ty;
        const ex = a.tx - qx, ey = a.ty - qy, e2 = ex * ex + ey * ey;
        if (e2 < WALL_FEEL * WALL_FEEL && e2 > 1e-10) { const e = Math.sqrt(e2), f = (WALL_FEEL - e) / WALL_FEEL; rx += (ex / e) * f; ry += (ey / e) * f; }
      }
      vx += rx * 1.6; vy += ry * 1.6;

      const px = a.tx, py = a.ty;
      a.tx += vx * h; a.ty += vy * h;
      collide(a);
      const moved = Math.hypot(a.tx - px, a.ty - py);
      a.phase += moved * STRIDE;

      // events
      if (a.state === 'seek' && a.target) {
        const t = a.target, ex = t.tx - a.tx, ey = t.ty - a.ty;
        if (ex * ex + ey * ey < TOUCH_R * TOUCH_R) bite(a, t);
      } else if (a.state === 'return') {
        if (U.dist2(a.tx, a.ty, b.tx, b.ty) < HOME_R * HOME_R) arriveHome(a);
      } else if (a.goHole && U.dist2(a.tx, a.ty, b.tx, b.ty) < 0.09) hide(a, U.rand(0.8, 3));
      for (let k = 0; k < flags.length; k++) {
        const f = flags[k];
        if (!(a.flagMask & f.bit) && U.dist2(a.tx, a.ty, f.tx, f.ty) < FLAG_R * FLAG_R) countFlag(a, f);
      }
      if (a.state !== 'home' && moved > 0) {
        a.trailAcc += moved;
        if (a.trailAcc >= 0.42) { a.trailAcc = 0; pushTrail(a.tx - c * 0.3, a.ty - s * 0.3, b.index); }
      }
      // watchdog: no progress for a while → ignore the crowd briefly and wiggle free
      if (a.state !== 'home' && a.pause <= 0) {
        const m = a.state === 'seek' ? d : fields[b.index].dist[Math.floor(a.ty) * cols + Math.floor(a.tx)];
        if (m < a.bestM - 0.3) { a.bestM = m; a.stuckT = 0; }
        else if ((a.stuckT += h) > 2.2) { a.unstuck = 0.8; a.stuckT = 0; a.bestM = m; a.h += U.rand(-1.2, 1.2); }
      }
    }
  }

  function update(dt) {
    if (!grid) return;
    simTime += dt;
    computeSeparation();
    const n = Math.max(1, Math.ceil((dt * (tw('speed') + 5)) / 0.3));
    for (let k = 0; k < n; k++) stepAnts(dt / n);
  }
  /** Feedback runs on real time: pop-ins, squash, pulses and particles. */
  function tickFx(dt) {
    fxTime += dt;
    for (const c of cubes) c.hit = Math.max(0, c.hit - dt * 5);
    for (const f of flags) f.hit = Math.max(0, f.hit - dt * 4);
    for (const b of bases) b.pulse = Math.max(0, b.pulse - dt * 2.5);
    updateParticles(dt);
  }

  /** Run the simulation synchronously (pre-warm and tests). */
  function simulate(sec) {
    const was = silent;
    silent = true;
    for (let t = 0; t < sec; t += 1 / 60) update(1 / 60);
    silent = was;
  }

  // ================================================================ player actions
  function addCube(tx, ty, opts = {}) {
    const p = fitPoint(tx, ty, CUBE_MARGIN);
    if (!p) return null;
    if (opts.user) {
      for (const c of cubes) if (U.dist2(c.tx, c.ty, p.x, p.y) < 0.64) { c.hit = 1; return null; }
    }
    const c = new Cube(p.x, p.y);
    cubes.push(c);
    if (opts.user) {
      burst(P_SPARK, c.tx, c.ty - 0.2, 5, 3.2, 0.5, 0.22, '#fff7d6');
      spawn(P_RING, c.tx, c.ty, 0, 0, 0.45, 0.9, '#ffffff');
      burst(P_DUST, c.tx, c.ty + 0.15, 4, 1.2, 0.5, 0.25, '#d9b07a');
      Kit.sfx('place', { gap: opts.paint ? 55 : 0, pitch: U.rand(0.9, 1.15) });
    }
    return c;
  }
  function killCube(c, how) {
    const i = cubes.indexOf(c);
    if (i < 0) return;
    cubes.splice(i, 1);
    c.dead = true;
    if (how === 'eaten') {
      burst(P_PUFF, c.tx, c.ty, 6, 2.2, 0.55, 0.45, '#fffaf0');
      burst(P_CRUMB, c.tx, c.ty, 8, 3, 0.6, 0.09);
      for (let k = 0; k < 5; k++) spawn(P_GRAIN, c.tx + U.rand(-0.5, 0.5), c.ty + U.rand(-0.4, 0.5), 0, 0, U.rand(4, 7), U.rand(0.05, 0.08));
      spawn(P_RING, c.tx, c.ty, 0, 0, 0.5, 1.1, '#ffffff');
      if (!silent) {
        Kit.sfx('pop', { gap: 60 });
        if (!seenOnce.eaten) {
          seenOnce.eaten = true;
          const n = tw('bites');
          Kit.toast(word(`A cube is gone after ${n} bites`, `An attractor is gone after ${n} hits`), { tone: 'info', ms: 2400 });
        }
      }
    } else if (how === 'user') {
      burst(P_PUFF, c.tx, c.ty, 4, 1.6, 0.4, 0.35, '#fffaf0');
      spawn(P_RING, c.tx, c.ty, 0, 0, 0.35, 0.8, '#ffffff');
      Kit.sfx('remove', { gap: 40 });
    } else if (how === 'clear') {
      burst(P_PUFF, c.tx, c.ty, 2, 1.4, 0.35, 0.3, '#fffaf0');
    }
    for (const a of ants) if (a.target === c) retarget(a);
  }
  function clearCubes(user) {
    if (!cubes.length) return;
    for (const c of cubes.slice()) killCube(c, 'clear');
    if (user) {
      Kit.sfx('whoosh', { pitch: 0.9 });
      Kit.toast(word('Sugar cleared', 'Attractors cleared'), { tone: 'info' });
    }
  }
  function addFlag(tx, ty, user) {
    const p = fitPoint(tx, ty, 0.4);
    if (!p) return null;
    const x = p.x, y = p.y;
    if (flags.length >= MAX_FLAGS) {
      removeFlag(flags[0], true);
      if (user && !seenOnce.flagFull) { seenOnce.flagFull = true; Kit.toast(word('Three flags at most. The oldest one moved.', 'Three goals at most. The oldest one moved.'), { tone: 'info', ms: 2400 }); }
    }
    let slot = 0;
    while (flags.some((f) => f.slot === slot)) slot++;
    const f = new Flag(x, y, slot);
    flags.push(f);
    if (user) {
      spawn(P_RING, x, y, 0, 0, 0.5, FLAG_R, SHAPE.yellow);
      burst(P_SPARK, x, y - 1, 4, 2.5, 0.45, 0.2, '#fff3b0');
      Kit.sfx('chirp');
    }
    return f;
  }
  function removeFlag(f, quiet) {
    const i = flags.indexOf(f);
    if (i < 0) return;
    flags.splice(i, 1);
    for (const a of ants) a.flagMask &= ~f.bit;
    spawn(P_PUFF, f.tx, f.ty, 0, 0, 0.35, 0.6, '#fffaf0');
    if (!quiet) Kit.sfx('remove');
  }
  function cubeNear(tx, ty, r) {
    let best = null, bd = r * r;
    for (const c of cubes) { const d = U.dist2(c.tx, c.ty, tx, ty); if (d < bd) { bd = d; best = c; } }
    return best;
  }
  function flagNear(tx, ty) {
    for (let i = flags.length - 1; i >= 0; i--) {
      const f = flags[i];
      // the ground spot or the cloth above it
      if (U.dist2(f.tx, f.ty, tx, ty) < 0.7 * 0.7) return f;
      if (!Kit.isAbstract && tx > f.tx - 0.25 && tx < f.tx + 1.05 && ty > f.ty - 1.8 && ty < f.ty) return f;
    }
    return null;
  }
  function baseNear(tx, ty) {
    for (const b of bases) if (U.dist2(b.tx, b.ty, tx, ty) < 1.4 * 1.4) return b;
    return null;
  }
  function buzzWall(tx, ty) {
    Kit.sfx('buzz', { gap: 200 });
    spawn(P_RING, tx, ty, 0, 0, 0.35, 0.7, SHAPE.red);
    if (!seenOnce.wall) { seenOnce.wall = true; Kit.toast(word('Sugar only goes on open ground', 'Attractors only go on open ground'), { tone: 'bad' }); }
  }
  /** Primary action at a tile point with the current tool. */
  function actAt(tx, ty) {
    if (!inMap(tx, ty)) return null;
    if (wallPt(tx, ty)) { buzzWall(tx, ty); return null; }
    return tool === 'flag' ? addFlag(tx, ty, true) : addCube(tx, ty, { user: true });
  }
  /** Remove a cube (or flag) under a tile point. */
  function eraseAt(tx, ty, allowFlag) {
    const c = cubeNear(tx, ty, 0.75);
    if (c) { killCube(c, 'user'); return true; }
    if (allowFlag) { const f = flagNear(tx, ty); if (f) { removeFlag(f); return true; } }
    return false;
  }
  function removeLastCube() {
    const c = cubes[cubes.length - 1];
    if (c) killCube(c, 'user');
  }

  // ================================================================ input
  // paint drag: px/py last pointer point, lx/ly last cube, qx/qy last open point still in sight of it
  const drag = { mode: null, px: 0, py: 0, lx: 0, ly: 0, has: false, qx: 0, qy: 0, qok: false, flag: null };
  const kb = { on: false, tx: 0, ty: 0, mx: 0, my: 0 };
  const toTile = (p) => [(p.x - OX) / T, (p.y - OY) / T];

  /** Paint along the pointer path: a cube every PAINT_STEP tiles, plus one at a corner whenever the
   *  next spot would be out of sight of the previous cube, so ants can always see the next link. */
  function paintTo(tx, ty) {
    const sx = drag.px, sy = drag.py, len = Math.hypot(tx - sx, ty - sy);
    const n = Math.max(1, Math.ceil(len / 0.25));
    for (let i = 1; i <= n; i++) {
      const x = sx + ((tx - sx) * i) / n, y = sy + ((ty - sy) * i) / n;
      if (wallPt(x, y)) continue;
      if (drag.has && !losWide(drag.lx, drag.ly, x, y, 0.25)) {
        if (drag.qok && U.dist(drag.lx, drag.ly, drag.qx, drag.qy) > 0.9) paintCube(drag.qx, drag.qy);
        else if (!drag.qok) paintCube(x, y);
      } else if (!drag.has || U.dist(drag.lx, drag.ly, x, y) >= PAINT_STEP) paintCube(x, y);
      drag.qx = x; drag.qy = y; drag.qok = !drag.has || losWide(drag.lx, drag.ly, x, y, 0.25);
    }
    drag.px = tx; drag.py = ty;
  }
  function paintCube(x, y) {
    const c = addCube(x, y, { user: true, paint: true });
    const p = c || fitPoint(x, y, CUBE_MARGIN);
    if (!p) return;
    drag.lx = c ? c.tx : p.x; drag.ly = c ? c.ty : p.y; drag.has = true; drag.qok = true;
  }
  function pointerDown(p) {
    kb.on = false;
    const [tx, ty] = toTile(p);
    if (!inMap(tx, ty)) return;
    if (p.button === 2) { drag.mode = 'erase'; eraseAt(tx, ty, true); return; }
    if (p.button !== 0) return;
    if (tool === 'flag') {
      const f = flagNear(tx, ty);
      if (f) { drag.mode = 'flag'; drag.flag = f; f.hit = 1; Kit.sfx('click'); return; }
      actAt(tx, ty);
      return;
    }
    drag.mode = 'paint'; drag.px = tx; drag.py = ty; drag.has = false; drag.qok = false;
    const c = actAt(tx, ty);
    if (c) { drag.lx = c.tx; drag.ly = c.ty; drag.has = true; drag.qx = c.tx; drag.qy = c.ty; drag.qok = true; }
    else {
      // clicked an existing cube: continue the trail from it
      const near = cubeNear(tx, ty, 0.8);
      if (near) { drag.lx = near.tx; drag.ly = near.ty; drag.has = true; drag.qx = near.tx; drag.qy = near.ty; drag.qok = true; }
    }
  }
  function pointerMove(p) {
    if (kb.on && (Math.abs(p.x - kb.mx) > 3 || Math.abs(p.y - kb.my) > 3)) kb.on = false;
    const [tx, ty] = toTile(p);
    if (drag.mode === 'paint' && p.buttons & 1) paintTo(tx, ty);
    else if (drag.mode === 'erase' && p.buttons & 2) eraseAt(tx, ty, false);
    else if (drag.mode === 'flag' && p.buttons & 1) {
      const q = fitPoint(tx, ty, 0.4);
      if (q) { drag.flag.tx = q.x; drag.flag.ty = q.y; }
    }
  }
  function pointerUp() { drag.mode = null; drag.flag = null; }

  function setTool(t) {
    if (t === tool) return;
    tool = t;
    Kit.ui.setActive(ui.bSugar, t === 'sugar');
    Kit.ui.setActive(ui.bFlag, t === 'flag');
    Kit.setHint(t === 'flag' ? { sprite: 'Click to plant a flag. It counts the ants that reach it.', abstract: 'Click to set a goal. It counts the agents that reach it.' } : null);
    Kit.sfx('click');
  }
  function setSight(v) { Kit.ui.setActive(ui.bSight, v); }
  function toggleSight() { Kit.setTweak('sight', !tw('sight')); Kit.sfx('toggle', { pitch: tw('sight') ? 1.2 : 0.8 }); }

  function keydown(e) {
    switch (e.code) {
      case 'Digit1': case 'Numpad1': setTool('sugar'); return true;
      case 'Digit2': case 'Numpad2': case 'KeyG': setTool('flag'); return true;
      case 'KeyC': clearCubes(true); return true;
      case 'KeyN': newMap(); return true;
      case 'KeyL': toggleSight(); return true;
      case 'KeyZ': removeLastCube(); return true;
      case 'ArrowLeft': case 'ArrowRight': case 'ArrowUp': case 'ArrowDown': {
        if (!kb.on) {
          const inside = Kit.mouse.inside && inMap((Kit.mouse.x - OX) / T, (Kit.mouse.y - OY) / T);
          kb.tx = inside ? Math.floor((Kit.mouse.x - OX) / T) : Math.floor(bases[0] ? bases[0].tx : cols / 2);
          kb.ty = inside ? Math.floor((Kit.mouse.y - OY) / T) : Math.floor(bases[0] ? bases[0].ty : rows / 2);
          kb.on = true;
        }
        const st = e.shiftKey ? 3 : 1;
        if (e.code === 'ArrowLeft') kb.tx -= st;
        if (e.code === 'ArrowRight') kb.tx += st;
        if (e.code === 'ArrowUp') kb.ty -= st;
        if (e.code === 'ArrowDown') kb.ty += st;
        kb.tx = U.clamp(kb.tx, 0, cols - 1); kb.ty = U.clamp(kb.ty, 0, rows - 1);
        kb.mx = Kit.mouse.x; kb.my = Kit.mouse.y;
        Kit.sfx('click', { gap: 30, vol: 0.4 });
        return true;
      }
      case 'Enter': case 'NumpadEnter': {
        const [tx, ty] = cursorTile();
        actAt(tx, ty);
        return true;
      }
      case 'Delete': case 'Backspace': {
        const [tx, ty] = cursorTile();
        if (!eraseAt(tx, ty, true)) Kit.sfx('buzz', { gap: 200, vol: 0.6 });
        return true;
      }
      default: return false;
    }
  }
  function cursorTile() {
    if (kb.on) return [kb.tx + 0.5, kb.ty + 0.5];
    if (Kit.mouse.inside) return [(Kit.mouse.x - OX) / T, (Kit.mouse.y - OY) / T];
    kb.on = true; kb.mx = Kit.mouse.x; kb.my = Kit.mouse.y;
    kb.tx = Math.floor(bases[0] ? bases[0].tx : cols / 2); kb.ty = Math.floor(bases[0] ? bases[0].ty : rows / 2);
    return [kb.tx + 0.5, kb.ty + 0.5];
  }

  // ================================================================ layout and static layers
  let layer = null, layerPrev = null, fadeT = 0;
  const FADE = 0.45;
  let cubeSpr = [], cubeBad = null;

  function layout(opts = {}) {
    if (!grid) return;
    const pr = Kit.playRect;
    T = Math.max(8, Math.floor(Math.min(pr.w / cols, pr.h / rows)));
    OX = Math.round(pr.x + (pr.w - cols * T) / 2);
    OY = Math.round(pr.y + (pr.h - rows * T) / 2);
    if (opts.crossfade && layer) { const t = layerPrev; layerPrev = layer; layer = t; fadeT = FADE; } else fadeT = 0;
    buildLayers();
  }
  function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function buildLayers() {
    const dpr = Kit.dpr, W = Kit.W, H = Kit.H;
    if (!layer) layer = makeCanvas(1, 1);
    if (!layerPrev) layerPrev = makeCanvas(1, 1);
    layer.width = Math.round(W * dpr); layer.height = Math.round(H * dpr);
    const g = layer.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (Kit.isAbstract) paintShapesLayer(g, W, H); else { paintSpriteLayer(g, W, H); buildCubeSprites(); buildAntSprites(); }
  }

  // ---------------------------------------------------------------- sprite ground
  function dots(g, rnd, n, x0, y0, w, h, s0, s1, color) {
    g.beginPath();
    for (let i = 0; i < n; i++) { const s = s0 + rnd() * (s1 - s0); g.rect(x0 + rnd() * w, y0 + rnd() * h, s, s); }
    g.fillStyle = color; g.fill();
  }
  function blobPath(g, x, y, r) { g.moveTo(x + r, y); g.arc(x, y, r, 0, TAU); }
  /** Deterministic blob centres for a wall tile: [x, y, r] in tiles. */
  function hedgeBlob(t, k) {
    const x = t % cols, y = (t / cols) | 0;
    return [x + 0.5 + (hash(t, k) - 0.5) * 0.3, y + 0.5 + (hash(t, k + 3) - 0.5) * 0.3, 0.55 + hash(t, k + 6) * 0.12];
  }
  function paintSpriteLayer(g, W, H) {
    const rnd = U.mulberry32(seed * 7 + 13);
    const mw = cols * T, mh = rows * T;
    // undergrowth beyond the map
    g.fillStyle = '#17210f'; g.fillRect(0, 0, W, H);
    g.beginPath();
    for (let i = 0, n = (W * H) / 650; i < n; i++) blobPath(g, rnd() * W, rnd() * H, 2 + rnd() * 6);
    g.fillStyle = 'rgba(64,98,40,0.3)'; g.fill();
    dots(g, rnd, (W * H) / 260, 0, 0, W, H, 1, 2.5, 'rgba(0,0,0,0.22)');

    // soil
    g.save();
    g.beginPath(); g.rect(OX, OY, mw, mh); g.clip();
    const sg = g.createLinearGradient(OX, OY, OX + mw, OY + mh);
    sg.addColorStop(0, '#ab7a49'); sg.addColorStop(1, '#966639');
    g.fillStyle = sg; g.fillRect(OX, OY, mw, mh);
    for (let i = 0; i < 50; i++) {
      const x = OX + rnd() * mw, y = OY + rnd() * mh, r = T * (2 + rnd() * 6), light = rnd() < 0.5;
      const rg = g.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, light ? 'rgba(205,160,104,0.32)' : 'rgba(104,64,32,0.28)');
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = rg; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    const area = mw * mh;
    dots(g, rnd, area / 55, OX, OY, mw, mh, 1, 2, 'rgba(92,56,26,0.35)');
    dots(g, rnd, area / 70, OX, OY, mw, mh, 1, 2, 'rgba(214,170,116,0.32)');
    dots(g, rnd, area / 400, OX, OY, mw, mh, 1.5, 3, 'rgba(70,40,18,0.35)');
    // tiny pebbles and twigs
    g.beginPath();
    for (let i = 0, n = area / 2200; i < n; i++) { const x = OX + rnd() * mw, y = OY + rnd() * mh, r = 1 + rnd() * T * 0.07; g.moveTo(x + r, y); g.ellipse(x, y, r, r * 0.75, rnd() * 3, 0, TAU); }
    g.fillStyle = 'rgba(214,196,170,0.55)'; g.fill();
    g.strokeStyle = 'rgba(96,62,32,0.5)'; g.lineWidth = Math.max(1, T * 0.05); g.lineCap = 'round';
    g.beginPath();
    for (let i = 0, n = area / 9000; i < n; i++) {
      const x = OX + rnd() * mw, y = OY + rnd() * mh, a = rnd() * TAU, l = T * (0.3 + rnd() * 0.5);
      g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 0.4) * l * 0.5, y + Math.sin(a + 0.4) * l * 0.5, x + Math.cos(a) * l, y + Math.sin(a) * l);
    }
    g.stroke();
    g.restore();

    // wall shadows (blurred, offset)
    const walls = [];
    for (let t = 0; t < cols * rows; t++) if (grid[t]) walls.push(t);
    const sh = makeCanvas(Math.ceil(W), Math.ceil(H)); // blurred anyway, so CSS resolution is enough
    const s2 = sh.getContext('2d');
    s2.beginPath();
    for (const t of walls) for (let k = 0; k < 3; k++) { const b = hedgeBlob(t, k); blobPath(s2, OX + b[0] * T, OY + b[1] * T, b[2] * T); }
    s2.fillStyle = '#000'; s2.fill();
    g.save();
    g.globalAlpha = 0.45;
    g.filter = `blur(${Math.max(2, T * 0.22).toFixed(1)}px)`;
    g.drawImage(sh, T * 0.12, T * 0.2, W, H);
    g.restore();

    // hedges: dark mass, mid tones, highlights, blades
    const hedge = walls.filter((t) => kind[t] !== 2);
    const layerBlobs = (dxo, dyo, rs, keyOff, count, color) => {
      g.beginPath();
      for (const t of hedge) for (let k = 0; k < count; k++) {
        const b = hedgeBlob(t, k + keyOff);
        blobPath(g, OX + (b[0] + dxo) * T, OY + (b[1] + dyo) * T, b[2] * rs * T);
      }
      g.fillStyle = color; g.fill();
    };
    layerBlobs(0, 0, 1, 0, 3, '#2a561e');
    layerBlobs(-0.05, -0.08, 0.74, 0, 2, '#386f28');
    layerBlobs(-0.1, -0.16, 0.5, 1, 1, '#4a8a33');
    layerBlobs(-0.16, -0.24, 0.24, 2, 1, '#69aa45');
    const blades = (color, n, len, keyOff) => {
      g.beginPath();
      for (const t of hedge) {
        const x = t % cols, y = (t / cols) | 0;
        for (let k = 0; k < n; k++) {
          const bx = OX + (x + 0.1 + hash(t, 20 + k + keyOff) * 0.8) * T, by = OY + (y + 0.15 + hash(t, 30 + k + keyOff) * 0.8) * T;
          const a = -Math.PI / 2 + (hash(t, 40 + k + keyOff) - 0.5) * 1.6, l = len * T * (0.6 + hash(t, 50 + k + keyOff) * 0.6);
          g.moveTo(bx, by); g.quadraticCurveTo(bx + Math.cos(a) * l * 0.4 + l * 0.15, by + Math.sin(a) * l * 0.5, bx + Math.cos(a) * l, by + Math.sin(a) * l);
        }
      }
      g.strokeStyle = color; g.lineWidth = Math.max(1, T * 0.05); g.lineCap = 'round'; g.stroke();
    };
    blades('#1d3f15', 2, 0.3, 0);
    blades('#7fc152', 3, 0.26, 7);
    // fallen leaves and small flowers on the hedges
    const leafCols = ['#e0962e', '#c8642a', '#e8bf4c', '#a8472a'];
    for (const t of hedge) {
      const x = OX + ((t % cols) + 0.5) * T, y = OY + (((t / cols) | 0) + 0.5) * T;
      if (hash(t, 60) < 0.07) {
        const a = hash(t, 61) * TAU, L = T * (0.28 + hash(t, 62) * 0.12);
        g.save(); g.translate(x + (hash(t, 63) - 0.5) * T * 0.4, y + (hash(t, 64) - 0.5) * T * 0.4); g.rotate(a);
        g.beginPath(); g.moveTo(-L, 0); g.quadraticCurveTo(0, -L * 0.62, L, 0); g.quadraticCurveTo(0, L * 0.62, -L, 0);
        g.fillStyle = leafCols[Math.floor(hash(t, 65) * 4)]; g.fill();
        g.strokeStyle = 'rgba(80,30,10,0.55)'; g.lineWidth = Math.max(0.8, T * 0.03);
        g.beginPath(); g.moveTo(-L * 0.9, 0); g.lineTo(L * 0.85, 0); g.stroke();
        g.restore();
      } else if (hash(t, 66) < 0.05) {
        const fx = x + (hash(t, 67) - 0.5) * T * 0.5, fy = y + (hash(t, 68) - 0.5) * T * 0.5, r = T * 0.07;
        g.beginPath();
        for (let k = 0; k < 5; k++) { const a = (k / 5) * TAU; blobPath(g, fx + Math.cos(a) * r * 1.2, fy + Math.sin(a) * r * 1.2, r); }
        g.fillStyle = '#fff6e6'; g.fill();
        g.beginPath(); blobPath(g, fx, fy, r * 0.8); g.fillStyle = '#ffc93c'; g.fill();
      }
    }
    // pebbles
    for (const t of walls) {
      if (kind[t] !== 2) continue;
      const x = OX + ((t % cols) + 0.5 + (hash(t, 70) - 0.5) * 0.15) * T, y = OY + (((t / cols) | 0) + 0.5 + (hash(t, 71) - 0.5) * 0.15) * T;
      const rx = T * (0.5 + hash(t, 72) * 0.1), ry = rx * 0.8, rot = hash(t, 73) * Math.PI;
      const pg = g.createRadialGradient(x - rx * 0.35, y - ry * 0.45, rx * 0.1, x, y, rx * 1.1);
      pg.addColorStop(0, '#e3dbcc'); pg.addColorStop(0.6, '#b0a797'); pg.addColorStop(1, '#7e7668');
      g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU);
      g.fillStyle = pg; g.fill();
      g.strokeStyle = 'rgba(40,30,20,0.35)'; g.lineWidth = Math.max(1, T * 0.04); g.stroke();
      g.beginPath(); g.ellipse(x - rx * 0.3, y - ry * 0.4, rx * 0.28, ry * 0.14, rot - 0.3, 0, TAU);
      g.fillStyle = 'rgba(255,255,255,0.45)'; g.fill();
      if (hash(t, 74) < 0.6) {
        const sx = x + rx * 0.9, sy = y + ry * 0.7, sr = rx * 0.32;
        g.beginPath(); g.ellipse(sx, sy, sr, sr * 0.8, rot, 0, TAU); g.fillStyle = '#a49b8b'; g.fill(); g.stroke();
      }
    }
    // nest mounds: a ring of dug-out soil around a dark entrance
    for (const b of bases) {
      const x = OX + b.tx * T, y = OY + b.ty * T, r = T * 1.45;
      g.fillStyle = 'rgba(70,38,14,0.35)';
      g.beginPath(); g.ellipse(x + T * 0.08, y + T * 0.14, r, r * 0.92, 0, 0, TAU); g.fill();
      const mg = g.createRadialGradient(x - T * 0.3, y - T * 0.4, T * 0.2, x, y, r);
      mg.addColorStop(0, '#e2b47c'); mg.addColorStop(0.6, '#c99460'); mg.addColorStop(1, '#a8743f');
      g.fillStyle = mg; g.beginPath(); g.ellipse(x, y, r, r * 0.92, 0, 0, TAU); g.fill();
      const nr = U.mulberry32(seed + b.index * 101);
      g.beginPath();
      for (let i = 0; i < 90; i++) { const a = nr() * TAU, d = Math.sqrt(nr()) * T * 1.3, s = 1 + nr() * T * 0.07; g.rect(x + Math.cos(a) * d, y + Math.sin(a) * d * 0.92, s, s); }
      g.fillStyle = 'rgba(244,212,166,0.75)'; g.fill();
      g.beginPath();
      for (let i = 0; i < 50; i++) { const a = nr() * TAU, d = Math.sqrt(nr()) * T * 1.3, s = 1 + nr() * T * 0.06; g.rect(x + Math.cos(a) * d, y + Math.sin(a) * d * 0.92, s, s); }
      g.fillStyle = 'rgba(120,76,38,0.6)'; g.fill();
      const hg = g.createRadialGradient(x, y + T * 0.05, 0, x, y, T * 0.5);
      hg.addColorStop(0, '#080302'); hg.addColorStop(0.65, '#1e0f07'); hg.addColorStop(1, '#5a361a');
      g.fillStyle = hg; g.beginPath(); g.ellipse(x, y, T * 0.5, T * 0.38, 0, 0, TAU); g.fill();
      g.strokeStyle = 'rgba(255,232,196,0.6)'; g.lineWidth = Math.max(1, T * 0.07);
      g.beginPath(); g.ellipse(x, y, T * 0.52, T * 0.4, 0, 0.12 * Math.PI, 0.88 * Math.PI); g.stroke();

    // soft vignette
    const vg = g.createRadialGradient(OX + mw / 2, OY + mh / 2, Math.min(mw, mh) * 0.35, OX + mw / 2, OY + mh / 2, Math.hypot(mw, mh) * 0.6);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(30,14,4,0.32)');

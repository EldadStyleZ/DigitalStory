  }

  /** Isometric sugar cube, pre-rendered per bite stage; drawn in tile units around the centre. */
  function cubeCanvas(stage, bad) {
    const px = Math.max(8, Math.ceil(T * CUBE_SPR * Kit.dpr));
    const cv = makeCanvas(px, px), g = cv.getContext('2d');
    const k = px / CUBE_SPR;
    g.setTransform(k, 0, 0, k, px / 2, px / 2);
    const w = 0.45, hh = 0.25, dz = 0.42, top = -dz / 2 - 0.03;
    const N = [0, top - hh], E = [w, top], S = [0, top + hh], Wp = [-w, top];
    const S2 = [0, top + hh + dz], E2 = [w, top + dz], W2 = [-w, top + dz];
    const poly = (pts, fill) => { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); g.fillStyle = fill; g.fill(); };
    poly([Wp, S, S2, W2], bad ? '#ff7b72' : '#e2e8f2');
    poly([S, E, E2, S2], bad ? '#e0443a' : '#bfcadc');
    const tg = g.createLinearGradient(-w, top - hh, w, top + hh);
    tg.addColorStop(0, '#ffffff'); tg.addColorStop(1, bad ? '#ffb1ab' : '#eef3fa');
    poly([N, E, S, Wp], tg);
    if (!bad) {
      const r = U.mulberry32(11 + stage);
      g.fillStyle = 'rgba(150,172,210,0.55)';
      for (let i = 0; i < 16; i++) {
        const u = 0.12 + r() * 0.76, v = 0.12 + r() * 0.76;
        g.fillRect(N[0] + (E[0] - N[0]) * u + (Wp[0] - N[0]) * v, N[1] + (E[1] - N[1]) * u + (Wp[1] - N[1]) * v, 0.025, 0.025);
      }
      g.fillStyle = 'rgba(255,255,255,0.8)';
      for (let i = 0; i < 10; i++) g.fillRect(-w + r() * w * 2 * 0.95, top + 0.04 + r() * dz, 0.022, 0.022);
    }
    g.lineJoin = 'round';
    g.strokeStyle = bad ? 'rgba(120,0,0,0.7)' : 'rgba(104,120,152,0.85)';
    g.lineWidth = 0.03;
    g.beginPath(); g.moveTo(N[0], N[1]); g.lineTo(E[0], E[1]); g.lineTo(E2[0], E2[1]); g.lineTo(S2[0], S2[1]); g.lineTo(W2[0], W2[1]); g.lineTo(Wp[0], Wp[1]); g.closePath(); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,0.95)'; g.lineWidth = 0.02;
    g.beginPath(); g.moveTo(Wp[0], Wp[1]); g.lineTo(S[0], S[1]); g.lineTo(E[0], E[1]); g.moveTo(S[0], S[1]); g.lineTo(S2[0], S2[1]); g.stroke();
    const chips = [[0.03, top - hh + 0.03, 0.14], [w - 0.03, top + 0.04, 0.15], [-w + 0.03, top + dz - 0.01, 0.16], [0.15, top + hh + dz * 0.55, 0.13]];
    for (let i = 0; i < stage; i++) {
      const [cx, cy, r] = chips[i];
      g.globalCompositeOperation = 'destination-out';
      g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill();
      g.globalCompositeOperation = 'source-atop';
      g.strokeStyle = 'rgba(140,156,186,0.95)'; g.lineWidth = 0.035;
      g.beginPath(); g.arc(cx, cy, r + 0.015, 0, TAU); g.stroke();
    }
    g.globalCompositeOperation = 'source-over';
    return cv;
  }
  function buildCubeSprites() {
    cubeSpr = [0, 1, 2, 3, 4].map((s) => cubeCanvas(s, false));
    cubeBad = cubeCanvas(0, true);
  }

  function paintShapesLayer(g, W, H) {
    g.fillStyle = SHAPE.bg; g.fillRect(0, 0, W, H);
    g.fillStyle = SHAPE.floor; g.fillRect(OX, OY, cols * T, rows * T);
    const gap = T >= 14 ? 1 : 0;
    g.beginPath();
    for (let t = 0; t < cols * rows; t++) if (grid[t]) g.rect(OX + (t % cols) * T + gap, OY + ((t / cols) | 0) * T + gap, T - gap * 2, T - gap * 2);
    g.fillStyle = SHAPE.wall; g.fill();
  }

  // ================================================================ rendering — sprites
  // leg geometry in body lengths (x forward, y to the side): attach x, knee x/y, foot x/y
  const LEGS = [[0.06, 0.17, 0.17, 0.29, 0.27], [0.0, 0.02, 0.22, -0.01, 0.34], [-0.05, -0.15, 0.19, -0.31, 0.29]];
  const ABDOMEN = COLONY.map((c) => U.mixHex(c, ANT_DARK, 0.22));
  const TRAIL_COL = COLONY.map((c) => U.mixHex(c, '#fff1d6', 0.55));

  const GAIT = 6, DIRS = 32;          // walk-cycle frames and headings per sprite atlas
  let antSpr = [], antBox = 0, antCell = 0; // antSpr[colony] atlas; antBox CSS px, antCell device px

  /** One ant in body-length units: thorax at the origin, facing +x. */
  function paintAnt(g, ci, phase, carry, lw) {
    const E = (x, y, rx, ry) => { g.moveTo(x + rx, y); g.ellipse(x, y, rx, ry, 0, 0, TAU); };
    g.fillStyle = 'rgba(48,22,6,0.3)';
    g.beginPath(); E(-0.06, 0.05, 0.46, 0.2); g.fill();
    // legs in alternating tripods, two-segment, plus elbowed antennae
    const sw = Math.sin(phase) * 0.08, wig = Math.cos(phase) * 0.03;
    g.beginPath();
    for (let k = 0; k < 3; k++) {
      const q = LEGS[k];
      for (let side = -1; side <= 1; side += 2) {
        const off = (k + (side > 0 ? 1 : 0)) & 1 ? sw : -sw;
        g.moveTo(q[0], 0.045 * side);
        g.lineTo(q[1] + off * 0.5, q[2] * side);
        g.lineTo(q[3] + off, q[4] * side);
      }
    }
    for (let side = -1; side <= 1; side += 2) {
      g.moveTo(0.28, 0.035 * side);
      g.lineTo(0.36, (0.13 + wig * side) * side);
      g.lineTo(0.5, (0.08 - wig * side) * side);
    }
    g.strokeStyle = ANT_DARK; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke();
    g.beginPath(); E(0.03, 0, 0.13, 0.075); E(0.23, 0, 0.1, 0.095); E(-0.12, 0, 0.045, 0.04);
    g.fillStyle = ANT_DARK; g.fill();
    const ag = g.createRadialGradient(-0.34, -0.06, 0.02, -0.3, 0, 0.24);
    ag.addColorStop(0, U.mixHex(COLONY[ci], '#ffffff', 0.25)); ag.addColorStop(0.55, ABDOMEN[ci]); ag.addColorStop(1, U.mixHex(ABDOMEN[ci], ANT_DARK, 0.45));
    g.beginPath(); E(-0.3, 0, 0.22, 0.155); g.fillStyle = ag; g.fill();
    g.beginPath(); E(-0.27, -0.055, 0.09, 0.04); E(0.25, -0.035, 0.035, 0.025);
    g.fillStyle = 'rgba(255,255,255,0.42)'; g.fill();
    if (carry) {
      g.fillStyle = '#fffdf6'; g.fillRect(0.31, -0.085, 0.17, 0.17);
      g.strokeStyle = 'rgba(90,70,50,0.6)'; g.lineWidth = lw * 0.5; g.strokeRect(0.31, -0.085, 0.17, 0.17);
    }
  }
  /** Per-colony atlas of pre-rotated ants: column = heading, row = gait frame (+GAIT when carrying).
   *  Rotated blits are slow on a 2D canvas, so rotation happens once here. */
  function buildAntSprites() {
    const L = T * 1.05;
    antBox = Math.ceil(L * 1.3);
    const cell = Math.max(8, Math.ceil(antBox * Kit.dpr)), big = cell * 2;
    const k = (big / antBox) * L, lw = Math.max(1, T * 0.055) / L;
    const src = makeCanvas(big, big), sg = src.getContext('2d');
    antCell = cell;
    antSpr = bases.map((b) => {
      const atlas = makeCanvas(cell * DIRS, cell * GAIT * 2), ag = atlas.getContext('2d');
      for (let carry = 0; carry < 2; carry++) for (let f = 0; f < GAIT; f++) {
        sg.setTransform(1, 0, 0, 1, 0, 0); sg.clearRect(0, 0, big, big);
        sg.setTransform(k, 0, 0, k, big / 2, big / 2);
        paintAnt(sg, b.index, (f / GAIT) * TAU, carry === 1, lw);
        const row = f + carry * GAIT;
        for (let d = 0; d < DIRS; d++) {
          const ang = (d / DIRS) * TAU, c = Math.cos(ang), s = Math.sin(ang);
          ag.setTransform(c, s, -s, c, d * cell + cell / 2, row * cell + cell / 2);
          ag.drawImage(src, -cell / 2, -cell / 2, cell, cell);
        }
      }
      return atlas;
    });
  }

  function drawAntsSprite(ctx) {
    const cell = antCell;
    for (let i = 0; i < ants.length; i++) {
      const a = ants[i];
      if (a.vis <= 0.02) continue;
      const f = Math.floor((((a.phase % TAU) + TAU) % TAU / TAU) * GAIT) % GAIT;
      const d = ((Math.round((a.h / TAU) * DIRS) % DIRS) + DIRS) % DIRS;
      const sz = antBox * a.vis;
      ctx.drawImage(antSpr[a.base.index], d * cell, (f + (a.carry ? GAIT : 0)) * cell, cell, cell, OX + a.tx * T - sz / 2, OY + a.ty * T - sz / 2, sz, sz);
    }
  }

  const bucketN = new Int32Array(COLONY.length * TRAIL_BUCKETS);
  const bucketIdx = Array.from({ length: COLONY.length * TRAIL_BUCKETS }, () => new Int32Array(TRAIL_CAP));
  function drawTrail(ctx) {
    bucketN.fill(0);
    for (let i = 0; i < TRAIL_CAP; i++) {
      const age = simTime - TR.t[i];
      if (age < 0 || age >= TRAIL_LIFE) continue;
      const k = TR.c[i] * TRAIL_BUCKETS + Math.min(TRAIL_BUCKETS - 1, ((age / TRAIL_LIFE) * TRAIL_BUCKETS) | 0);
      bucketIdx[k][bucketN[k]++] = i;
    }
    const sz = Math.max(1.5, T * 0.09), hs = sz / 2;
    for (let c = 0; c < COLONY.length; c++) for (let k = 0; k < TRAIL_BUCKETS; k++) {
      const m = bucketN[c * TRAIL_BUCKETS + k];
      if (!m) continue;
      const list = bucketIdx[c * TRAIL_BUCKETS + k];
      ctx.beginPath();
      for (let j = 0; j < m; j++) { const i = list[j]; ctx.rect(OX + TR.x[i] * T - hs, OY + TR.y[i] * T - hs, sz, sz); }
      ctx.globalAlpha = TRAIL_ALPHA[k]; ctx.fillStyle = TRAIL_COL[c]; ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function cubeScale(c) {
    const age = fxTime - c.born;
    const pop = age < 0.4 ? U.easeOutBack(U.clamp(age / 0.4, 0, 1)) : 1;
    return (0.55 + 0.45 * (1 - c.bites / tw('bites'))) * pop;
  }
  function drawCubesSprite(ctx) {
    const max = tw('bites');
    // shadows and spilled crumbs
    ctx.beginPath();
    for (const c of cubes) {
      const sc = cubeScale(c), px = OX + c.tx * T, py = OY + c.ty * T;
      ctx.moveTo(px + T * 0.55 * sc + T * 0.06, py + T * 0.36 * sc);
      ctx.ellipse(px + T * 0.06, py + T * 0.36 * sc, T * 0.55 * sc, T * 0.18 * sc, 0, 0, TAU);
    }
    ctx.fillStyle = 'rgba(48,22,6,0.32)'; ctx.fill();
    ctx.beginPath();
    for (const c of cubes) {
      const n = Math.min(14, Math.floor(c.bites * 0.7)), px = OX + c.tx * T, py = OY + c.ty * T, s = Math.max(1.2, T * 0.06);
      for (let k = 0; k < n; k++) {
        const a = c.r * 40 + k * 2.39996, d = (0.55 + ((k * 0.618 + c.r) % 1) * 0.4) * T;
        ctx.rect(px + Math.cos(a) * d, py + Math.sin(a) * d * 0.8 + T * 0.15, s, s);
      }
    }
    ctx.fillStyle = '#fbf6ea'; ctx.fill();
    for (const c of cubes) {
      const sc = cubeScale(c), age = fxTime - c.born, px = OX + c.tx * T, py = OY + c.ty * T;
      const stage = Math.min(4, Math.floor((c.bites / max) * 5));
      const drop = age < 0.22 ? (1 - age / 0.22) * T * 0.9 : 0;
      const sq = c.hit * 0.14, w = T * CUBE_SPR * sc * (1 + sq), h = T * CUBE_SPR * sc * (1 - sq);
      ctx.drawImage(cubeSpr[stage], px - w / 2, py - h / 2 - drop + (T * CUBE_SPR * sc - h) * 0.5, w, h);
      // twinkle
      const tk = (fxTime * 0.8 + c.r * 9) % 3.2;
      if (tk < 0.4) {
        const k = Math.sin((tk / 0.4) * Math.PI), sx = px - T * 0.16 * sc, sy = py - T * 0.52 * sc, r = T * 0.3 * k;
        star(ctx, sx, sy, r, 'rgba(255,255,255,0.95)');
      }
    }
  }
  function star(ctx, x, y, r, color) {
    ctx.beginPath();
    ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
    ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r);
    ctx.fillStyle = color; ctx.fill();
  }

  function drawNestsSprite(ctx) {
    for (const b of bases) {
      const x = OX + b.tx * T, y = OY + b.ty * T, hov = hover.base === b;
      const r = T * (1.25 + b.pulse * 0.25);
      ctx.lineWidth = T * (0.34 + b.pulse * 0.3);
      ctx.strokeStyle = U.rgba(b.color, 0.16 + b.pulse * 0.25 + (hov ? 0.12 : 0));
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
      ctx.lineWidth = Math.max(2, T * (hov ? 0.17 : 0.12));
      ctx.strokeStyle = b.color;
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
    }
  }

  function drawFlagsSprite(ctx) {
    const t = Kit.realTime;
    for (const f of flags) {
      const x = OX + f.tx * T, y = OY + f.ty * T, age = fxTime - f.born;
      const pop = age < 0.45 ? U.easeOutBack(U.clamp(age / 0.45, 0, 1)) : 1, hov = hover.flag === f;
      ctx.fillStyle = 'rgba(255,214,10,0.08)';
      ctx.beginPath(); ctx.arc(x, y, FLAG_R * T * pop, 0, TAU); ctx.fill();
      ctx.setLineDash([T * 0.28, T * 0.22]);
      ctx.lineWidth = Math.max(1.5, T * 0.07); ctx.strokeStyle = hov ? 'rgba(255,230,120,0.95)' : 'rgba(255,214,10,0.6)';
      ctx.stroke();
      ctx.setLineDash([]);
      const hgt = T * 1.75 * pop;
      ctx.fillStyle = 'rgba(48,22,6,0.3)';
      ctx.beginPath(); ctx.ellipse(x + T * 0.3, y + T * 0.05, T * 0.42, T * 0.12, 0.15, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#efe6d2'; ctx.lineWidth = Math.max(1.5, T * 0.1); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - hgt); ctx.stroke();
      // waving pennant
      const top = y - hgt + T * 0.05, len = T * 1.0 * pop, dep = T * 0.62 * pop;
      ctx.beginPath(); ctx.moveTo(x, top);
      for (let i = 1; i <= 8; i++) { const u = i / 8; ctx.lineTo(x + u * len, top + u * dep * 0.5 + Math.sin(t * 6 - u * 4) * T * 0.08 * u); }
      for (let i = 8; i >= 0; i--) { const u = i / 8; ctx.lineTo(x + u * len, top + dep - u * dep * 0.5 + Math.sin(t * 6 - u * 4) * T * 0.08 * u); }
      ctx.closePath();
      ctx.fillStyle = SHAPE.yellow; ctx.fill();
      ctx.strokeStyle = '#a88400'; ctx.lineWidth = Math.max(1, T * 0.04); ctx.stroke();
      ctx.fillStyle = '#fff4d6'; ctx.beginPath(); ctx.arc(x, y - hgt, T * 0.1, 0, TAU); ctx.fill();
      badge(ctx, x + T * 0.5, y - hgt - T * 0.6, String(f.count), 1 + f.hit * 0.35);
    }
  }
  function badge(ctx, x, y, text, scale) {
    const fs = Math.round(U.clamp(T * 0.62, 12, 18) * scale);
    ctx.font = `600 ${fs}px Fredoka, Rubik, system-ui, sans-serif`;
    const w = Math.max(fs * 1.3, ctx.measureText(text).width + fs * 0.8), h = fs * 1.35;
    ctx.fillStyle = 'rgba(22,18,40,0.88)';
    U.roundRect(ctx, x - w / 2, y - h / 2, w, h, h / 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y + fs * 0.04);
  }

  function drawParticlesSprite(ctx) {
    for (let i = 0; i < PART_CAP; i++) {
      const p = parts[i];
      if (!p.on) continue;
      const k = p.life / p.max, x = OX + p.x * T, y = OY + p.y * T;
      switch (p.type) {
        case P_CRUMB: case P_GRAIN: {
          const s = p.size * T;
          ctx.globalAlpha = Math.min(1, k * 2.5);
          ctx.fillStyle = '#fffaf0'; ctx.fillRect(x - s / 2, y - s / 2, s, s);
          break;
        }
        case P_PUFF:
          ctx.globalAlpha = 0.6 * k; ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(x, y, p.size * T * (1.4 - k * 0.6), 0, TAU); ctx.fill();
          break;
        case P_DUST:
          ctx.globalAlpha = 0.45 * k; ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(x, y, p.size * T * (1.5 - k * 0.7), 0, TAU); ctx.fill();
          break;
        case P_RING:
          ctx.globalAlpha = k; ctx.strokeStyle = p.color; ctx.lineWidth = Math.max(1.5, T * 0.09 * k + 1);
          ctx.beginPath(); ctx.arc(x, y, T * (0.3 + p.size * (1 - k)), 0, TAU); ctx.stroke();
          break;
        case P_SPARK:
          ctx.globalAlpha = k; star(ctx, x, y, p.size * T * (0.5 + k * 0.5), p.color);
          break;
        default: break;
      }
    }
    ctx.globalAlpha = 1;
  }

  function renderSprite(ctx) {
    if (tw('trail')) drawTrail(ctx);
    drawNestsSprite(ctx);
    drawCubesSprite(ctx);
    if (tw('sight')) drawSight(ctx, 'rgba(255,255,255,0.32)');
    drawAntsSprite(ctx);
    drawFlagsSprite(ctx);
    drawParticlesSprite(ctx);
  }

  // ================================================================ rendering — shapes
  function renderShapes(ctx) {
    // bases
    for (const b of bases) {
      const x = OX + b.tx * T, y = OY + b.ty * T;
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(x, y, T * (1.1 + b.pulse * 0.12), 0, TAU); ctx.fill();
      if (hover.base === b) { ctx.strokeStyle = SHAPE.white; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, T * 1.35, 0, TAU); ctx.stroke(); }
    }
    // goals: zone ring + diamond (count is drawn above the agents)
    for (const f of flags) {
      const x = OX + f.tx * T, y = OY + f.ty * T, age = fxTime - f.born;
      const pop = age < 0.45 ? U.easeOutBack(U.clamp(age / 0.45, 0, 1)) : 1, s = T * 0.6 * pop * (1 + f.hit * 0.25);
      ctx.strokeStyle = hover.flag === f ? SHAPE.white : SHAPE.mid; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, FLAG_R * T * pop, 0, TAU); ctx.stroke();
      ctx.fillStyle = SHAPE.yellow;
      ctx.beginPath(); ctx.moveTo(x, y - s); ctx.lineTo(x + s, y); ctx.lineTo(x, y + s); ctx.lineTo(x - s, y); ctx.closePath(); ctx.fill();
    }
    // attractors: white square + hit ring
    const max = tw('bites');
    for (const c of cubes) {
      const x = OX + c.tx * T, y = OY + c.ty * T, age = fxTime - c.born;
      const pop = age < 0.35 ? U.easeOutBack(U.clamp(age / 0.35, 0, 1)) : 1;
      const s = T * 0.62 * pop * (1 + c.hit * 0.2);
      ctx.fillStyle = SHAPE.white; ctx.fillRect(x - s / 2, y - s / 2, s, s);
      const rr = T * 0.62 * pop;
      ctx.lineWidth = Math.max(1.5, T * 0.09);
      ctx.strokeStyle = SHAPE.wall; ctx.beginPath(); ctx.arc(x, y, rr, 0, TAU); ctx.stroke();
      if (c.bites > 0) { ctx.strokeStyle = SHAPE.light; ctx.beginPath(); ctx.arc(x, y, rr, -Math.PI / 2, -Math.PI / 2 + (c.bites / max) * TAU); ctx.stroke(); }
    }
    if (tw('sight')) drawSight(ctx, 'rgba(255,255,255,0.3)');
    // agents
    const r0 = T * 0.27;
    ctx.lineWidth = Math.max(1, T * 0.07); ctx.strokeStyle = SHAPE.floor;
    for (let k = 0; k < bases.length; k++) {
      const b = bases[k];
      ctx.beginPath();
      for (const a of ants) {
        if (a.base !== b || a.vis <= 0.02) continue;
        const x = OX + a.tx * T, y = OY + a.ty * T, r = r0 * a.vis;
        ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU);
      }
      ctx.fillStyle = b.color; ctx.fill(); ctx.stroke();
    }
    ctx.beginPath();
    for (const a of ants) {
      if (!a.carry || a.vis <= 0.5) continue;
      const x = OX + a.tx * T, y = OY + a.ty * T, r = r0 * 0.4;
      ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU);
    }
    ctx.fillStyle = SHAPE.white; ctx.fill();
    // particles: plain squares and rings only
    for (let i = 0; i < PART_CAP; i++) {
      const p = parts[i];
      if (!p.on) continue;
      const k = p.life / p.max, x = OX + p.x * T, y = OY + p.y * T;
      if (p.type === P_CRUMB) {
        const s = p.size * T; ctx.globalAlpha = Math.min(1, k * 2.5); ctx.fillStyle = SHAPE.white; ctx.fillRect(x - s / 2, y - s / 2, s, s);
      } else if (p.type === P_RING || p.type === P_PUFF) {
        ctx.globalAlpha = k; ctx.strokeStyle = p.type === P_PUFF ? SHAPE.white : p.color; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x, y, T * (0.3 + (p.type === P_PUFF ? 0.5 : p.size) * (1 - k)), 0, TAU); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    const fs = Math.round(U.clamp(T * 0.66, 12, 18));
    for (const f of flags) {
      const x = OX + f.tx * T, y = OY + f.ty * T, sc = 1 + f.hit * 0.3;
      ctx.font = `600 ${Math.round(fs * sc)}px Rubik, system-ui, sans-serif`;
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
      ctx.lineWidth = 4; ctx.strokeStyle = SHAPE.floor; ctx.strokeText(String(f.count), x + T * 0.85, y);
      ctx.fillStyle = SHAPE.white; ctx.fillText(String(f.count), x + T * 0.85, y);
    }
  }

  // ================================================================ rendering — shared overlays
  const hover = { on: false, tx: 0, ty: 0, inMap: false, wall: false, cube: null, flag: null, base: null };
  let lastCursor = '';
  function setCursor(c) { if (c !== lastCursor) { lastCursor = c; Kit.canvas.style.cursor = c; } }
  function computeHover() {
    const mouseOn = Kit.mouse.inside && !Kit.helpOpen;
    hover.on = kb.on || mouseOn;
    if (kb.on) { hover.tx = kb.tx + 0.5; hover.ty = kb.ty + 0.5; } else { hover.tx = (Kit.mouse.x - OX) / T; hover.ty = (Kit.mouse.y - OY) / T; }
    hover.inMap = hover.on && inMap(hover.tx, hover.ty);
    hover.wall = hover.inMap && wallPt(hover.tx, hover.ty);
    hover.cube = hover.inMap ? cubeNear(hover.tx, hover.ty, 0.75) : null;
    hover.flag = hover.inMap && !hover.cube ? flagNear(hover.tx, hover.ty) : null;
    hover.base = hover.inMap ? baseNear(hover.tx, hover.ty) : null;
    if (!mouseOn) return;
    if (drag.mode === 'flag') setCursor('grabbing');
    else if (!hover.inMap) setCursor('default');
    else if (hover.cube || hover.flag) setCursor(tool === 'flag' && hover.flag ? 'grab' : 'pointer');
    else if (hover.wall) setCursor('not-allowed');
    else setCursor('crosshair');
  }

  function drawSight(ctx, color) {
    ctx.beginPath();
    for (const a of ants) {
      if (a.state !== 'seek' || !a.target || a.hidden) continue;
      ctx.moveTo(OX + a.tx * T, OY + a.ty * T); ctx.lineTo(OX + a.target.tx * T, OY + a.target.ty * T);
    }
    ctx.strokeStyle = color; ctx.lineWidth = Math.max(1, T * 0.05); ctx.stroke();
  }

  function label(ctx, x, y, text) {
    const fs = Math.round(U.clamp(T * 0.58, 12, 15));
    ctx.font = `500 ${fs}px Rubik, system-ui, sans-serif`;
    const w = ctx.measureText(text).width + fs * 1.2, h = fs * 1.9;
    const lx = U.clamp(x - w / 2, 8, Kit.W - w - 8), ly = U.clamp(y - h, 8, Kit.H - h - 8);
    ctx.fillStyle = 'rgba(14,12,30,0.9)';
    U.roundRect(ctx, lx, ly, w, h, 9); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#f1effb'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(text, lx + fs * 0.6, ly + h / 2 + 0.5);
  }

  function drawOverlay(ctx) {
    const abs = Kit.isAbstract;
    if (hover.cube) {
      const x = OX + hover.cube.tx * T, y = OY + hover.cube.ty * T;
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, T * 0.78, 0, TAU); ctx.stroke();
      label(ctx, x, y - T * 0.95, 'Right-click to remove');
    } else if (hover.flag && tool !== 'flag') {
      const x = OX + hover.flag.tx * T, y = OY + hover.flag.ty * T;
      label(ctx, x, y + T * 2.6, 'Right-click to remove');
    }
    if (hover.base && !hover.cube) {
      const b = hover.base;
      let home = 0;
      for (const a of ants) if (a.base === b && a.state === 'home') home++;
      const name = COLONY_NAME[b.index];
      const text = abs ? `${name} base · ${home} agents home · ${b.stored} returned` : `${name} nest · ${home} ants home · ${b.stored} crumbs`;
      label(ctx, OX + b.tx * T, OY + (b.ty - 1.6) * T, text);
    }
    // ghost of the next placement
    if (hover.inMap && !hover.cube && !(tool === 'flag' && hover.flag) && !drag.mode) {
      const bad = hover.wall;
      const p = bad ? null : fitPoint(hover.tx, hover.ty, tool === 'flag' ? 0.4 : CUBE_MARGIN);
      const gx = OX + (p ? p.x : hover.tx) * T, gy = OY + (p ? p.y : hover.ty) * T;
      ctx.globalAlpha = bad ? 0.75 : 0.55;
      if (tool === 'flag') {
        if (abs) {
          const s = T * 0.6;
          ctx.fillStyle = bad ? SHAPE.red : SHAPE.yellow;
          ctx.beginPath(); ctx.moveTo(gx, gy - s); ctx.lineTo(gx + s, gy); ctx.lineTo(gx, gy + s); ctx.lineTo(gx - s, gy); ctx.closePath(); ctx.fill();
        } else {
          ctx.strokeStyle = '#efe6d2'; ctx.lineWidth = Math.max(1.5, T * 0.1);
          ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx, gy - T * 1.75); ctx.stroke();
          ctx.fillStyle = bad ? SHAPE.red : SHAPE.yellow;
          ctx.beginPath(); ctx.moveTo(gx, gy - T * 1.7); ctx.lineTo(gx + T, gy - T * 1.39); ctx.lineTo(gx, gy - T * 1.08); ctx.closePath(); ctx.fill();
        }
        if (!bad) { ctx.strokeStyle = abs ? SHAPE.mid : 'rgba(255,214,10,0.8)'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.arc(gx, gy, FLAG_R * T, 0, TAU); ctx.stroke(); ctx.setLineDash([]); }
      } else if (abs) {
        const s = T * 0.62;
        ctx.fillStyle = bad ? SHAPE.red : SHAPE.white; ctx.fillRect(gx - s / 2, gy - s / 2, s, s);
      } else {
        const s = T * CUBE_SPR;
        ctx.drawImage(bad ? cubeBad : cubeSpr[0], gx - s / 2, gy - s / 2, s, s);
      }
      ctx.globalAlpha = 1;
      // vision preview: which ants could see a cube here
      if (!bad && tool === 'sugar' && tw('sight')) {
        ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5; ctx.setLineDash([6, 6]);
        ctx.beginPath(); ctx.arc(gx, gy, tw('vision') * T, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    // keyboard cursor
    if (kb.on) {
      const x = OX + kb.tx * T, y = OY + kb.ty * T, s = T, l = T * 0.32;
      ctx.strokeStyle = abs ? SHAPE.white : '#ff9f6e'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y + l); ctx.lineTo(x, y); ctx.lineTo(x + l, y);
      ctx.moveTo(x + s - l, y); ctx.lineTo(x + s, y); ctx.lineTo(x + s, y + l);
      ctx.moveTo(x + s, y + s - l); ctx.lineTo(x + s, y + s); ctx.lineTo(x + s - l, y + s);
      ctx.moveTo(x + l, y + s); ctx.lineTo(x, y + s); ctx.lineTo(x, y + s - l);
      ctx.stroke();
    }
  }

  function render(ctx, rdt) {
    if (!grid || !layer) { ctx.fillStyle = '#120f26'; ctx.fillRect(0, 0, Kit.W, Kit.H); return; }
    ctx.drawImage(layer, 0, 0, Kit.W, Kit.H);
    if (fadeT > 0) {
      fadeT = Math.max(0, fadeT - rdt);
      ctx.globalAlpha = fadeT / FADE;
      ctx.drawImage(layerPrev, 0, 0, Kit.W, Kit.H);
      ctx.globalAlpha = 1;
    }
    tickFx(Math.min(rdt, 0.1));
    computeHover();
    if (Kit.isAbstract) renderShapes(ctx); else renderSprite(ctx);
    drawOverlay(ctx);
    syncStats(false);
  }

  // ================================================================ UI wiring
  let statT = 0;
  function syncStats(force) {
    Kit.setStat('ants', ants.length, { neutral: true });
    Kit.setStat('sugar', cubes.length);
    let f = 0;
    for (const fl of flags) f += fl.count;
    Kit.setStat('flag', f);
    if (force || Kit.realTime - statT > 0.15) { statT = Kit.realTime; Kit.setStat('bites', totalBites, { neutral: true }); }
  }

  function setIcon(btn, html) {
    const old = btn.querySelector('svg');
    if (!old) return;
    old.insertAdjacentHTML('beforebegin', html);
    old.remove();
  }

  function setup() {
    const gPlace = Kit.ui.group('Place');
    ui.bSugar = Kit.ui.button({ parent: gPlace, label: { sprite: 'Sugar', abstract: 'Attractor' }, icon: ICON_CUBE, key: '1', tip: { sprite: 'Sugar: click to drop, drag for a trail', abstract: 'Attractor: click to drop, drag for a line' }, onClick: () => setTool('sugar') });
    ui.bFlag = Kit.ui.button({ parent: gPlace, label: { sprite: 'Flag', abstract: 'Goal' }, icon: 'flag', key: '2', tip: { sprite: 'Flag: counts the ants that reach it', abstract: 'Goal: counts the agents that reach it' }, onClick: () => setTool('flag') });
    const gMap = Kit.ui.group(null);
    Kit.ui.button({ parent: gMap, label: 'Clear', icon: 'trash', key: 'C', tip: { sprite: 'Remove all sugar', abstract: 'Remove all attractors' }, onClick: () => clearCubes(true) });
    Kit.ui.button({ parent: gMap, label: 'New map', icon: 'shuffle', key: 'N', tip: 'Make a new maze', onClick: () => newMap() });
    ui.bSight = Kit.ui.button({ parent: gMap, label: 'Sight lines', icon: 'eye', key: 'L', tip: { sprite: 'Show what each ant is heading to', abstract: 'Show what each agent is heading to' }, onClick: toggleSight });
    Kit.ui.setActive(ui.bSugar, true);
    Kit.ui.setActive(ui.bFlag, false);
    Kit.ui.setActive(ui.bSight, tw('sight'));
    ready = true;
  }

  function viewChanged(v) {
    // toasts and an open tooltip still carry the old view's words; drop them so Shapes never shows "sugar"
    for (const n of [...Kit.dom.toasts.children]) n.remove();
    Kit.dom.tip.classList.remove('is-on');
    Kit.dom.tip.textContent = '';
    if (ui.bSugar) {
      setIcon(ui.bSugar, v === 'abstract' ? Kit.icons.square : ICON_CUBE);
      setIcon(ui.bFlag, v === 'abstract' ? ICON_DIAMOND : Kit.icons.flag);
    }
    if (grid) buildLayers();
  }

  function resize() {
    if (!ready) return;
    if (!grid) {
      let s = null;
      try { const q = new URLSearchParams(location.search).get('seed'); if (q && /^\d+$/.test(q)) s = parseInt(q, 10); } catch (e) { /* ignore */ }
      newMap(s, { quiet: true });
    } else layout();
  }

  function reset() {
    if (!grid) return;
    if (firstReset) {
      firstReset = false;
      placeExample();
      simulate(1.3); // the first frame already shows a stream on the move
      syncStats(true);
      return;
    }
    cubes.length = 0;
    for (const f of flags) f.count = 0;
    for (const b of bases) { b.stored = 0; b.pulse = 0; }
    totalBites = 0;
    drag.mode = null;
    clearFx();
    spawnAll();
    syncStats(true);
  }

  const seedNote = { type: 'note', label: 'Map seed' };
  ui.seedNote = seedNote;

  Kit.init({
    id: 'trail',
    number: '03',
    accent: '#ff9f6e',
    accentInk: '#2b1004',
    title: { sprite: 'Ants & Sugar', abstract: 'Trail' },
    hint: {
      sprite: 'Click to drop sugar. Drag to lay a trail. Lead the ants anywhere.',
      abstract: 'Click to drop an attractor. Drag to lay a line. Lead the agents anywhere.',
    },
    about: {
      get sprite() {
        const n = bases.length || tw('nests');
        return `${n === 1 ? 'An ant colony lives' : NUM[n][0].toUpperCase() + NUM[n].slice(1) + ' ant colonies live'} in a garden maze. Drop sugar and every ant that can see a cube walks to the closest one, takes one bite, then looks for the next. Lay a trail of cubes to lead them anywhere. When the trail ends, each ant walks back to its own nest. A cube lasts ${tw('bites')} bites.`;
      },
      get abstract() {
        const n = bases.length || tw('nests');
        return `Agents start at ${n === 1 ? 'one base' : NUM[n] + ' bases'} in a maze. Drop attractors and every agent that can see one moves to the closest, hits it once, then looks for the next. Lay a line of attractors to lead them anywhere. When the line ends, each agent goes back to its own base. An attractor lasts ${tw('bites')} hits.`;
      },
    },
    controls: [
      { keys: ['Click'], label: { sprite: 'Drop a sugar cube', abstract: 'Drop an attractor' } },
      { keys: ['Drag'], label: { sprite: 'Lay a trail of sugar', abstract: 'Lay a line of attractors' } },
      { keys: ['Right-click'], label: { sprite: 'Remove a cube or flag', abstract: 'Remove an attractor or goal' } },
      { keys: ['1', '2'], label: { sprite: 'Sugar tool, flag tool (also G)', abstract: 'Attractor tool, goal tool (also G)' } },
      { keys: ['Arrows', 'Enter'], label: 'Move the cursor and drop' },
      { keys: ['Del', 'Z'], label: { sprite: 'Remove under cursor, undo last cube', abstract: 'Remove under cursor, undo last attractor' } },
      { keys: ['C'], label: { sprite: 'Clear all sugar', abstract: 'Clear all attractors' } },
      { keys: ['N'], label: 'New map' },
      { keys: ['L'], label: 'Show sight lines' },
    ],
    stats: [
      { id: 'ants', label: { sprite: 'Ants', abstract: 'Agents' }, value: 0 },
      { id: 'sugar', label: { sprite: 'Sugar', abstract: 'Attractors' }, value: 0 },
      { id: 'bites', label: { sprite: 'Bites', abstract: 'Hits' }, value: 0 },
      { id: 'flag', label: { sprite: 'At flag', abstract: 'At goal' }, value: 0 },
    ],
    tweaks: [
      { type: 'section', label: { sprite: 'Colonies', abstract: 'Bases' } },
      { type: 'range', id: 'nests', label: { sprite: 'Nests', abstract: 'Bases' }, min: 1, max: 5, step: 1, value: DEF.nests, onChange: () => { placeBases(tw('nests')); layout(); syncStats(true); }, note: 'Places them again on the same maze' },
      { type: 'range', id: 'perNest', label: { sprite: 'Ants per nest', abstract: 'Agents per base' }, min: 5, max: 80, step: 1, value: DEF.perNest, onInput: syncAntCount },
      { type: 'section', label: { sprite: 'Ants', abstract: 'Agents' } },
      { type: 'range', id: 'speed', label: { sprite: 'Ant speed', abstract: 'Agent speed' }, min: 1, max: 6, step: 0.25, value: DEF.speed, format: (v) => v + ' tiles/s' },
      { type: 'range', id: 'vision', label: 'Vision radius', min: 4, max: 60, step: 1, value: DEF.vision, format: (v) => v + ' tiles' },
      { type: 'section', label: { sprite: 'Sugar', abstract: 'Attractors' } },
      { type: 'range', id: 'bites', label: { sprite: 'Bites per cube', abstract: 'Hits per attractor' }, min: 5, max: 60, step: 1, value: DEF.bites, onInput: (v) => { for (const c of cubes.slice()) if (c.bites >= v) killCube(c, 'eaten'); } },
      { type: 'section', label: 'Display' },
      { type: 'toggle', id: 'trail', label: 'Trail dots', value: DEF.trail, note: { sprite: 'Faint scent dots behind moving ants.', abstract: 'Shown in the Sprites look only.' } },
      { type: 'toggle', id: 'sight', label: 'Sight lines', value: DEF.sight, onChange: setSight },
      { type: 'section', label: 'Map' },
      { type: 'button', id: 'newmap', label: 'New map', onClick: () => newMap() },
      seedNote,
    ],
    setup,
    reset,
    update,
    render,
    resize,
    viewChanged,
    pointerDown,
    pointerMove,
    pointerUp,
    pointerLeave() { if (!Kit.mouse.down) drag.mode = null; },
    keydown,
    escape() { drag.mode = null; kb.on = false; if (tool !== 'sugar') setTool('sugar'); },
  });

  // ================================================================ test API
  window.__toy = {
    get ants() { return ants; },
    get cubes() { return cubes; },
    get bases() { return bases; },
    get flags() { return flags; },
    get tile() { return T; },
    get origin() { return { x: OX, y: OY }; },
    get cols() { return cols; },
    get rows() { return rows; },
    get seed() { return seed; },
    get bitesPerCube() { return tw('bites'); },
    get tool() { return tool; },
    get plazas() { return plazas.map((p) => ({ x: OX + (p.cx + 0.5) * T, y: OY + (p.cy + 0.5) * T })); },
    isWall(x, y) { return wallPt((x - OX) / T, (y - OY) / T); },
    canSee(ant, cube) { return canSee(ant, cube); },
    placeCube(x, y) { return addCube((x - OX) / T, (y - OY) / T); },
    removeCube(cube) { if (cube) killCube(cube, 'user'); },
    clearCubes() { clearCubes(false); },
    newMap(s) { return newMap(s, { quiet: true }); },
    placeFlag(x, y) { return addFlag((x - OX) / T, (y - OY) / T); },
    removeFlag(f) { removeFlag(f, true); },
    setTool,
    /** Advance the simulation synchronously by `sec` seconds. */
    step(sec) { simulate(sec); },
    /** Pixel centre of tile (cx, cy). */
    tileCenter(cx, cy) { return { x: OX + (cx + 0.5) * T, y: OY + (cy + 0.5) * T }; },
    /** Path length in tiles from a pixel point to base i (−1 if unreachable). */
    homeDist(x, y, i) { const f = fields[i]; return f ? f.dist[Math.floor((y - OY) / T) * cols + Math.floor((x - OX) / T)] : -1; },
    /** True when every open tile can reach every base. */
    connected() { for (const f of fields) for (let t = 0; t < cols * rows; t++) if (!grid[t] && f.dist[t] < 0) return false; return true; },
  };
})();
</script>
</body>
</html>

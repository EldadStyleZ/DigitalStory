<script src="kit.js"></script>
<script>
'use strict';
/* Toy 04 — Funnel.
 * Particles race through a rounded maze (a signed distance field with one connected free space).
 * Every funnel pulls particles into its red mouth, carries them through the cone and shoots them
 * out of its blue spout: everything that goes in comes out. A power slider rides on each funnel.
 */

// ================================================================== config
const U = Kit.util;
const { TAU, clamp, lerp } = U;

const WORLD_W = 1600, WORLD_H = 880;
const GRID = 4;                                      // SDF sample spacing (world units)
const GW = WORLD_W / GRID + 1, GH = WORLD_H / GRID + 1;
const DEFAULT_SEED = 7;
const MIN_PARTICLES = 50, MAX_PARTICLES = 2000;
const BASE_SPEED = 220;                              // cruising speed at 1× (world units / s)
const MAX_FUNNELS = 12;
const R_MAX = 5;                                     // largest particle radius the tweak allows
const PASS = R_MAX + 1.5;                            // free-space threshold for the connectivity check

// funnel shape, local frame: +x runs from the red mouth to the blue spout; profile = wall center line
const F_LEN = 150, F_HALF = F_LEN / 2, F_WALL = 4;  // F_WALL: half thickness of a side wall
const PROF_X = [-75, -45, -15, 15, 45, 75];
const PROF_H = [45, 31, 22.5, 17.5, 14.5, 14.5];    // inner spout opening = 2 × (14.5 − 4) = 21 units
const F_BOUND = Math.hypot(F_HALF, PROF_H[0]) + F_WALL + R_MAX + 2;
const PILL_AT = -14;                                 // the slider sits on the wide part of the body
// forces in world units / s² at 1× speed and 100 % power (pull and push share one power)
const PULL_ACC = 2300, CARRY_ACC = 1700, PUSH_ACC = 1700, KICK = 300;
const PUSH_REACH = 0.6;                              // push zone radius as a fraction of the pull reach
const RELAX_UP = 4, RELAX_DOWN = 1.15;               // back to cruising speed (1/s): quick after bounces, slow after a kick
const WANDER = 1.5;                                  // random-walk heading noise (rad / √s)
const VMAX = 1500;
const STUCK_T = 1.3;                                 // after this long inside, a nudge guarantees the exit
const ROT_MAX = 2.4, ROT_K = 7.5;                    // A / D: top spin (rad/s) and ease stiffness
const MOVE_MAX = 300, MOVE_K = 10;                   // arrow keys: top speed (world/s) and ease stiffness
const GLIDE_K = 13;
const CLICK_PX = 5, CLICK_MS = 350;

const COL = { red: '#ff4d6d', blue: '#4aa3ff', violet: '#b48cff', part: '#ece8ff' };
const SH = { bg: '#0d0d10', band: '#2c2c34', mid: '#5a5a66', light: '#9a9aa6', white: '#ffffff', red: '#ff3b30', blue: '#0a84ff' };   // Shapes palette
const DEFAULTS = { size: 3.5, bounce: 0.9, reach: 2.5, fields: false };
const tw = (id) => (Kit.tweaks[id] !== undefined ? Kit.tweaks[id] : DEFAULTS[id]);

const CSS = `
/* kit-glass blurs what lies behind it; over a canvas that changes every frame a software compositor redoes
   that blur every frame (about 10 ms at 1920 × 1080). The panels sit over the plain backdrop here, so a
   denser fill looks the same and keeps the frame rate up. */
.kit-glass { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(24, 20, 48, 0.96); }
/* kit.css gives the Sprites / Shapes buttons z-index 1, which paints them through the help overlay */
.kit-help { z-index: 20; }
.fn-layer { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
.fn-pos { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.fn-pill {
  --p: 0.6; --k: 1; --tc: #b48cff;
  position: absolute; left: 0; top: 0;
  transform: translate(-50%, -50%) scale(var(--k));
  display: flex; align-items: center; gap: 3px;
  height: 24px; padding: 0 5px; border-radius: 12px; box-sizing: border-box;
  background: rgba(15, 11, 32, 0.66);
  border: 1px solid rgba(236, 230, 255, 0.16);
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.07);
  pointer-events: auto; touch-action: none; cursor: pointer;
  transition: background .15s, border-color .15s, box-shadow .15s, opacity .25s, scale .25s;
  animation: fn-in .38s cubic-bezier(.3, 1.5, .5, 1) both;
}
.fn-pill.is-hot { background: rgba(28, 22, 56, 0.86); border-color: rgba(236, 230, 255, 0.34); }
.fn-pill.is-sel { box-shadow: 0 3px 12px rgba(0, 0, 0, 0.42), 0 0 0 2px rgba(180, 140, 255, 0.38); }
.fn-pill.is-drag { border-color: color-mix(in srgb, var(--tc) 70%, white); }
.fn-pill.is-lift { opacity: 0.55; }
.fn-pill.is-out { opacity: 0; scale: 0.5; pointer-events: none; }
body.view-abstract .fn-pill { background: rgba(13, 13, 16, 0.8); border-color: #5a5a66; box-shadow: none; }
body.view-abstract .fn-pill.is-hot { background: #1c1c22; border-color: #9a9aa6; }
body.view-abstract .fn-pill.is-sel { border-color: #ffffff; }
@keyframes fn-in { from { opacity: 0; scale: 0.4; } }
.fn-mk {
  width: 11px; height: 18px; display: grid; place-items: center; flex: none;
  font: 600 14px/1 var(--font-ui); color: #f1effb; border-radius: 6px;
  transition: opacity .15s, background .15s;
}
.fn-mk:hover { background: rgba(255, 255, 255, 0.1); }
.fn-track { position: relative; width: 74px; height: 20px; flex: none; cursor: ew-resize; }
.fn-ramp { position: absolute; left: 3px; top: 50%; width: 68px; height: 13px; margin-top: -6.5px; }
.fn-ramp svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.fn-ramp-base { fill: rgba(236, 230, 255, 0.24); }
.fn-ramp-fill { fill: url(#fn-grad); clip-path: inset(0 calc((1 - var(--p)) * 100%) 0 0); }
body.view-abstract .fn-ramp-base { fill: #5a5a66; }
body.view-abstract .fn-ramp-fill { fill: url(#fn-grad-sh); }
.fn-thumb {
  position: absolute; top: 50%; left: calc(var(--p) * (100% - 38px)); width: 38px; height: 18px; margin-top: -9px;
  border-radius: 9px; background: #f6f3ff; color: #1a0f2e;
  display: grid; place-items: center;
  font: 500 12.5px/1 var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.55), 0 0 0 1.5px var(--tc);
  pointer-events: none; white-space: nowrap;
}
body.view-abstract .fn-thumb { background: #ffffff; color: #0d0d10; box-shadow: none; }
.fn-range { width: 118px; }
.fn-readout { min-width: 44px; text-align: left; padding: 0 6px 0 4px; }
`;

// ================================================================== state
const S = {
  ready: false,
  seed: DEFAULT_SEED,
  sc: 1, ox: 0, oy: 0,                   // world → screen: sx = ox + x * sc
  count: 600, speed: 1,
  funnels: [], dead: [], slots: new Array(MAX_FUNNELS).fill(null),
  sel: null, hover: null, pillHover: null, pillDrag: null,
  press: null, drag: null,
  undo: [],
  ghost: null,                            // refused placement: { x, y, angle, t }
  through: 0, exits: 0, statT: 0,
  nextId: 1,
  cursor: '',
  layerDirty: true, layerAt: -1e9,
  ui: {},
};

// particles: structure of arrays, allocated once
const PX = new Float32Array(MAX_PARTICLES), PY = new Float32Array(MAX_PARTICLES);
const VX = new Float32Array(MAX_PARTICLES), VY = new Float32Array(MAX_PARTICLES);
const WARM = new Float32Array(MAX_PARTICLES), COOL = new Float32Array(MAX_PARTICLES);
const INT = new Float32Array(MAX_PARTICLES);             // seconds spent inside the current funnel
const INF = new Int8Array(MAX_PARTICLES).fill(-1);       // slot of the funnel a particle is inside, or −1
const ENTRY = new Uint8Array(MAX_PARTICLES);             // 1 when it came in through the mouth
let N = 0;
const FA = new Array(MAX_FUNNELS).fill(null);            // landed funnels, refilled each step (no allocation)
const keyHold = new Map();

// ================================================================== world: signed distance field maze
// SDF > 0 is free space (distance to the nearest wall), < 0 is inside a wall. Built from smooth unions of
// rounded chambers and capsule tunnels, minus rounded obstacles; sampled on a grid, read bilinearly.
const SDF = new Float32Array(GW * GH);
const LABEL = new Int32Array(GW * GH);
const QUEUE = new Int32Array(GW * GH);
const MAP = { chambers: [], tunnels: [], obstacles: [], free: new Int32Array(GW * GH), freeN: 0, comps: 0 };

const smin = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; };
const smax = (a, b, k) => -smin(-a, -b, k);
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const t = clamp(((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy || 1), 0, 1);
  return Math.hypot(px - ax - dx * t, py - ay - dy * t);
}
// shape kinds: 0 circle {x,y,r}, 1 capsule {x,y,x2,y2,r}, 2 rounded box {x,y,hx,hy,r,c,s}
function sdShape(px, py, s) {
  if (s.t === 0) return Math.hypot(px - s.x, py - s.y) - s.r;
  if (s.t === 1) return segDist(px, py, s.x, s.y, s.x2, s.y2) - s.r;
  const dx = px - s.x, dy = py - s.y;
  const qx = Math.abs(dx * s.c + dy * s.s) - s.hx + s.r, qy = Math.abs(-dx * s.s + dy * s.c) - s.hy + s.r;
  return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - s.r;
}
function bound(s) {   // bounding circle, for culling
  if (s.t === 0) { s.bx = s.x; s.by = s.y; s.br = s.r; }
  else if (s.t === 1) { s.bx = (s.x + s.x2) / 2; s.by = (s.y + s.y2) / 2; s.br = Math.hypot(s.x2 - s.x, s.y2 - s.y) / 2 + s.r; }
  else { s.bx = s.x; s.by = s.y; s.br = Math.hypot(s.hx, s.hy); }
  return s;
}
const circle = (x, y, r) => bound({ t: 0, x, y, r });
const capsule = (x, y, x2, y2, r) => bound({ t: 1, x, y, x2, y2, r });
const rbox = (x, y, hx, hy, r, a) => bound({ t: 2, x, y, hx, hy, r: Math.min(r, hx, hy), c: Math.cos(a), s: Math.sin(a) });

/** Field of one compound (smooth union of its parts). */
function sdGroup(px, py, g) {
  let d = 1e9;
  for (const s of g.parts) {
    if (Math.hypot(px - s.bx, py - s.by) - s.br > d + g.k) continue;
    d = d > 1e8 ? sdShape(px, py, s) : smin(d, sdShape(px, py, s), g.k);
  }
  return d;
}
const chamberField = (px, py, ch) => sdGroup(px, py, ch);
const BORDER = rbox(WORLD_W / 2, WORLD_H / 2, WORLD_W / 2 - 22, WORLD_H / 2 - 22, 80, 0);

/** "Carved" field: negative inside the free space. */
function carved(px, py) {
  let f = 1e9;
  for (const ch of MAP.chambers) {
    if (Math.hypot(px - ch.bx, py - ch.by) - ch.br - ch.k * 0.25 > f) continue;
    f = Math.min(f, chamberField(px, py, ch));
  }
  for (const t of MAP.tunnels) {
    if (Math.hypot(px - t.bx, py - t.by) - t.br > f + 30) continue;
    let d = 1e9;
    for (const s of t.parts) d = Math.min(d, sdShape(px, py, s));
    f = smin(f, d, t.narrow ? 26 : 34);
  }
  f = smax(f, sdShape(px, py, BORDER), 24);
  for (const o of MAP.obstacles) {
    if (Math.hypot(px - o.bx, py - o.by) - o.br > -f + 16) continue;
    f = smax(f, -sdGroup(px, py, o), 14);
  }
  return f;
}

function computeField() {
  for (let j = 0; j < GH; j++) {
    const y = j * GRID;
    for (let i = 0; i < GW; i++) {
      const x = i * GRID;
      SDF[j * GW + i] = (i === 0 || j === 0 || i === GW - 1 || j === GH - 1) ? -40 : -carved(x, y);
    }
  }
}

/** Bilinear SDF read (world units). Outside the world counts as deep wall. */
function sdfAt(x, y) {
  const gx = x / GRID, gy = y / GRID;
  if (!(gx >= 0 && gy >= 0 && gx < GW - 1 && gy < GH - 1)) return -40;
  const i = gx | 0, j = gy | 0, fx = gx - i, fy = gy - j, k = j * GW + i;
  const a = SDF[k], b = SDF[k + 1], c = SDF[k + GW], d = SDF[k + GW + 1];
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
}

/** Label 4-connected components of cells with SDF > th. Returns sizes (index = label − 1). */
function labelComponents(th) {
  LABEL.fill(0);
  const sizes = [];
  for (let s = 0; s < GW * GH; s++) {
    if (LABEL[s] || !(SDF[s] > th)) continue;
    const id = sizes.length + 1;
    let head = 0, tail = 0;
    QUEUE[tail++] = s; LABEL[s] = id;
    while (head < tail) {
      const k = QUEUE[head++], i = k % GW;
      if (i > 0 && !LABEL[k - 1] && SDF[k - 1] > th) { LABEL[k - 1] = id; QUEUE[tail++] = k - 1; }
      if (i < GW - 1 && !LABEL[k + 1] && SDF[k + 1] > th) { LABEL[k + 1] = id; QUEUE[tail++] = k + 1; }
      if (k >= GW && !LABEL[k - GW] && SDF[k - GW] > th) { LABEL[k - GW] = id; QUEUE[tail++] = k - GW; }
      if (k < GW * (GH - 1) && !LABEL[k + GW] && SDF[k + GW] > th) { LABEL[k + GW] = id; QUEUE[tail++] = k + GW; }
    }
    sizes.push(tail);
  }
  return sizes;
}
function components() { const n = labelComponents(PASS).length; MAP.comps = n; return n; }

/** Join every stray pocket to the main space with a smooth tunnel; seal crumbs too small to matter. */
function ensureConnected() {
  for (let iter = 0; iter < 14; iter++) {
    const sizes = labelComponents(PASS);
    if (sizes.length <= 1) break;
    let main = 0;
    for (let k = 1; k < sizes.length; k++) if (sizes[k] > sizes[main]) main = k;
    const deep = sizes.map(() => -1);
    for (let s = 0; s < GW * GH; s++) { const l = LABEL[s] - 1; if (l >= 0 && l !== main && (deep[l] < 0 || SDF[s] > SDF[deep[l]])) deep[l] = s; }
    for (let l = 0; l < sizes.length; l++) {
      if (l === main) continue;
      const s = deep[l], x = (s % GW) * GRID, y = Math.floor(s / GW) * GRID;
      if (sizes[l] < 70) { const c = circle(x, y, SDF[s] + 5); MAP.obstacles.push({ parts: [c], k: 1, bx: c.bx, by: c.by, br: c.br }); continue; }
      let best = -1, bd = 1e18;
      for (let q = 0; q < GW * GH; q++) {
        if (LABEL[q] - 1 !== main) continue;
        const qx = (q % GW) * GRID - x, qy = Math.floor(q / GW) * GRID - y, d = qx * qx + qy * qy - SDF[q] * 40;
        if (d < bd) { bd = d; best = q; }
      }
      const bx = (best % GW) * GRID, by = Math.floor(best / GW) * GRID;
      addTunnel(-1, -1, [[x, y], [bx, by]], 26, true, true);
    }
    computeField();
  }
  // last resort (never needed for the seeds tested): fill whatever is still cut off
  const sizes = labelComponents(PASS);
  if (sizes.length > 1) {
    let main = 0;
    for (let k = 1; k < sizes.length; k++) if (sizes[k] > sizes[main]) main = k;
    for (let s = 0; s < GW * GH; s++) if (LABEL[s] && LABEL[s] - 1 !== main) SDF[s] = -1;
  }
  MAP.freeN = 0;
  labelComponents(PASS);
  for (let s = 0; s < GW * GH; s++) if (LABEL[s] === 1 && SDF[s] > R_MAX + 6) MAP.free[MAP.freeN++] = s;
  MAP.comps = components();
}

function addTunnel(a, b, pts, w, narrow, fix) {
  const parts = [];
  for (let i = 0; i + 1 < pts.length; i++) parts.push(capsule(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], w / 2));
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const p of pts) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }
  const t = { a, b, pts, w, narrow, fix: !!fix, parts, bx: (x0 + x1) / 2, by: (y0 + y1) / 2, br: Math.hypot(x1 - x0, y1 - y0) / 2 + w };
  MAP.tunnels.push(t);
  return t;
}

/** Build the maze for a seed: six rounded chambers on a jittered 3 × 2 grid, joined by narrow curved
 *  tunnels and wide gaps (a spanning tree plus loops), with pillars, pebbles and fingers inside. */
function generate(seed) {
  const rnd = U.mulberry32((seed >>> 0) * 2654435761 + 1013);
  const R = (a, b) => a + (b - a) * rnd();
  MAP.chambers = []; MAP.tunnels = []; MAP.obstacles = [];
  const cols = 3, rows = 2, cw = WORLD_W / cols, chh = WORLD_H / rows;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const jx = R(-30, 30), jy = R(-20, 20);
    const cx = (c + 0.5) * cw + jx, cy = (r + 0.5) * chh + jy;
    const mx = cw / 2 - 32 - Math.abs(jx), my = chh / 2 - 32 - Math.abs(jy);
    const hx = mx * R(0.84, 0.97), hy = my * R(0.8, 0.95), a = R(-0.08, 0.08);
    const parts = [rbox(cx, cy, hx * 0.96, hy * 0.96, Math.min(hx, hy) * R(0.55, 0.85), a)];
    const lobes = 1 + (rnd() < 0.55 ? 1 : 0);
    for (let l = 0; l < lobes; l++) {
      const rho = Math.min(mx, my) * R(0.38, 0.55), ang = R(0, TAU);
      parts.push(circle(cx + Math.cos(ang) * (mx - rho) * R(0.75, 1), cy + Math.sin(ang) * (my - rho) * R(0.75, 1), rho));
    }
    let br = 0;
    for (const p of parts) br = Math.max(br, Math.hypot(p.bx - cx, p.by - cy) + p.br);
    MAP.chambers.push({ x: cx, y: cy, hx: mx, hy: my, parts, k: 50, bx: cx, by: cy, br, col: c, row: r });
  }
  // connections: random spanning tree over the grid neighbours, then one or two loops
  const edges = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = r * cols + c;
    if (c + 1 < cols) edges.push([i, i + 1]);
    if (r + 1 < rows) edges.push([i, i + cols]);
  }
  for (let i = edges.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [edges[i], edges[j]] = [edges[j], edges[i]]; }
  const root = MAP.chambers.map((_, i) => i);
  const find = (i) => (root[i] === i ? i : (root[i] = find(root[i])));
  const used = [], spare = [];
  for (const e of edges) { const a = find(e[0]), b = find(e[1]); if (a !== b) { root[a] = b; used.push(e); } else spare.push(e); }
  used.push(...spare.slice(0, rnd() < 0.5 ? 1 : 2));
  // one long, curved tunnel between diagonal neighbours, through the solid rock in between
  const diag = [[0, 4], [1, 3], [1, 5], [2, 4]][Math.floor(rnd() * 4)];
  // at least three narrow tunnels and two wide gaps
  const kinds = used.map((_, i) => (i < 3 ? 'narrow' : i < 5 ? 'wide' : rnd() < 0.5 ? 'narrow' : 'wide'));
  for (let i = kinds.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [kinds[i], kinds[j]] = [kinds[j], kinds[i]]; }
  used.forEach((e, n) => {
    const A = MAP.chambers[e[0]], B = MAP.chambers[e[1]];
    const narrow = kinds[n] === 'narrow';
    const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy);
    const bend = narrow && rnd() < 0.7 ? R(0.18, 0.34) * (rnd() < 0.5 ? -1 : 1) * len : R(-0.05, 0.05) * len;
    const qx = (A.x + B.x) / 2 - (dy / len) * bend, qy = (A.y + B.y) / 2 + (dx / len) * bend;
    const pts = [];
    for (let k = 0; k <= 10; k++) {
      const t = k / 10, u = 1 - t;
      pts.push([u * u * A.x + 2 * u * t * qx + t * t * B.x, u * u * A.y + 2 * u * t * qy + t * t * B.y]);
    }
    addTunnel(e[0], e[1], pts, narrow ? R(22, 30) : R(66, 96), narrow);
  });
  {
    const A = MAP.chambers[diag[0]], B = MAP.chambers[diag[1]], dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy);
    const bend = R(0.12, 0.22) * (rnd() < 0.5 ? -1 : 1) * len, qx = (A.x + B.x) / 2 - (dy / len) * bend, qy = (A.y + B.y) / 2 + (dx / len) * bend;
    const pts = [];
    for (let k = 0; k <= 14; k++) { const t = k / 14, u = 1 - t; pts.push([u * u * A.x + 2 * u * t * qx + t * t * B.x, u * u * A.y + 2 * u * t * qy + t * t * B.y]); }
    addTunnel(diag[0], diag[1], pts, R(22, 27), true);
  }
  // where each connection leaves each chamber: obstacles keep clear of these mouths
  const mouths = [];
  for (const t of MAP.tunnels) for (const end of [0, 1]) {
    const ch = MAP.chambers[end ? t.b : t.a], pts = end ? t.pts.slice().reverse() : t.pts;
    const e = tunnelEntrance(ch, pts);
    if (e) mouths.push({ x: e.x, y: e.y, r: t.w / 2 });
  }
  // obstacles: pillars, pebble clusters, capsules, rounded blocks, and fingers from the walls
  const clearOf = (x, y, rad, gap) => mouths.every((m) => Math.hypot(x - m.x, y - m.y) > rad + m.r + gap)
    && MAP.obstacles.every((o) => Math.hypot(x - o.bx, y - o.by) > rad + o.br + 44);
  for (const ch of MAP.chambers) {
    const want = 2 + Math.floor(R(0, 3));

  inp.min = o.min; inp.max = o.max; inp.step = o.step; inp.value = o.value;
  inp.setAttribute('aria-label', o.label);
  inp.dataset.tip = o.tip;
  group.append(inp);
  const out = Kit.ui.readout(group, null);
  out.classList.add('fn-readout');
  const pct = () => inp.style.setProperty('--pct', ((inp.value - o.min) / (o.max - o.min)) * 100 + '%');
  const show = (v) => { inp.value = v; out.textContent = o.fmt(v); pct(); };
  inp.addEventListener('input', () => o.onInput(parseFloat(inp.value)));
  inp.addEventListener('pointerup', () => inp.blur());   // give the keys back to the toy after a drag
  show(o.value);
  return { inp, out, show };
}

    { type: 'range', id: 'bounce', label: 'Wall bounciness', min: 0.5, max: 1, step: 0.05, value: DEFAULTS.bounce, format: (v) => Math.round(v * 100) + ' %' },
    { type: 'section', label: 'Funnels' },
    { type: 'range', id: 'reach', label: 'Pull reach', min: 1, max: 4, step: 0.25, value: DEFAULTS.reach, format: (v) => v.toFixed(2) + '× length', note: 'How far in front of the red mouth the pull is felt. The push reaches 60 % as far.' },
    { type: 'toggle', id: 'fields', label: 'Show fields', value: DEFAULTS.fields, note: 'Draws the pull and push zones faintly.' },
    { type: 'button', label: 'Clear funnels', onClick: clearFunnels },
    { type: 'section', label: 'Map' },
    { type: 'button', label: 'New map', onClick: () => newMap() },
  ],
  setup,
  reset: buildDefaultScene,
  update,
  render,
  resize: layout,
  viewChanged,
  pointerDown,
  pointerMove,
  pointerUp,
  pointerLeave: () => { S.hover = null; if (!S.drag) setCursor('default'); },
  wheel,
  keydown,
  keyup,
  escape: () => select(null),
});

// ================================================================== test API
// World units throughout (the world is WORLD_W × WORLD_H); toScreen / toWorld convert to CSS pixels.
// funnels: the live objects: { id, x, y, angle (rad, mouth → spout), power (0–1), inside (particles in it now), lifted, ... }
window.__toy = {
  particles: {
    get count() { return N; },
    x: (i) => PX[i], y: (i) => PY[i], vx: (i) => VX[i], vy: (i) => VY[i],
    insideOf: (i) => (INF[i] >= 0 ? S.slots[INF[i]] : null),
    tint: (i) => ({ warm: WARM[i], cool: COOL[i] }),
    get radius() { return tw('size'); },
  },
  get funnels() { return S.funnels; },
  toScreen: (wx, wy) => ({ x: S.ox + wx * S.sc, y: S.oy + wy * S.sc }),
  toWorld: (sx, sy) => ({ x: toWorldX(sx), y: toWorldY(sy) }),
  sdf: (wx, wy) => sdfAt(wx, wy),
  components,
  createFunnel: (wx, wy, angle = 0) => (sdfAt(wx, wy) < 3 || funnelAt(wx, wy, 4) ? null : addFunnel(wx, wy, angle, 0.6, { quiet: true })),
  destroyFunnel: (f) => destroyFunnel(f),
  undo,
  setParticleCount: (n) => setParticleCount(n),
  setSpeed,
  setPower: (f, p) => setPower(f, p > 1 ? p / 100 : p),   // 0–1 (values above 1 are read as percent)
  throughput: () => S.through,
  insideTooLong: () => { let n = 0; for (let i = 0; i < N; i++) if (INF[i] >= 0 && INT[i] > 3) n++; return n; },
  newMap: (seed) => newMap(seed),
  // extras for tests
  get seed() { return S.seed; },
  get selected() { return S.sel; },
  get ghost() { return S.ghost; },                        // the red ghost of a refused placement, while it shows
  select: (f) => select(f),
  get scale() { return S.sc; },
  world: { w: WORLD_W, h: WORLD_H, funnelLength: F_LEN },
  get map() { return { chambers: MAP.chambers.length, tunnels: MAP.tunnels.filter((t) => !t.fix).map((t) => ({ narrow: t.narrow, width: t.w })), fixes: MAP.tunnels.filter((t) => t.fix).length }; },
  wallViolations: () => { let n = 0; for (let i = 0; i < N; i++) if (sdfAt(PX[i], PY[i]) <= 0) n++; return n; },
  fits: (f, x, y, a) => fits(f, x, y, a),
  localOf: (f, wx, wy) => { const dx = wx - f.x, dy = wy - f.y; return { x: dx * f.c + dy * f.s, y: -dx * f.s + dy * f.c, hw: hwAt(dx * f.c + dy * f.s) - F_WALL }; },
  pillOf: (f) => (f.ui ? f.ui.pill : null),
};
</script>
